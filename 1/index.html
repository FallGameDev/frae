<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fried Rice at Eddie's</title>
<style>
  /* ===== Fonts used by the game's text (Scratch's own fonts + pixel fonts) ===== */
  @font-face { font-family: "Sans Serif"; src: url("assets/fonts/NotoSans-Medium.ttf"); }
  @font-face { font-family: "Serif"; src: url("assets/fonts/SourceSerifPro-Regular.otf"); }
  @font-face { font-family: "Pixel"; src: url("assets/fonts/Grand9K-Pixel.ttf"); }
  @font-face { font-family: "Press Start 2P"; src: url("assets/fonts/PressStart2P.woff2"); }
  @font-face { font-family: "Courier Prime"; src: url("assets/fonts/CourierPrime.woff2"); }
  @font-face { font-family: "Share Tech Mono"; src: url("assets/fonts/ShareTechMono.woff2"); }

  /* ===== Page theme: black VHS look to match the game menu ===== */
  :root {
    --bg: #000;
    --line: #fff;
    --dim: #8a8a99;
    --accent: #5b16ec;
    --soul: #ff2a3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: #fff; overflow: hidden; }
  body {
    font-family: "Press Start 2P", monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }

  /* The game screen keeps Scratch's 4:3 shape and grows to fit the window */
  #frame {
    position: relative;
    border: 4px solid var(--line);
    box-shadow: 0 0 0 4px #000, 8px 8px 0 4px #1d1d2b;
    background: #000;
  }
  #stage { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }

  /* ===== Loading screen: a flat picture spinning in 3D, with a bar under it ===== */
  #cover {
    position: absolute; inset: 0; z-index: 5;
    background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6%;
    perspective: 900px;                       /* gives the spin its 3D depth */
    transition: opacity .4s;
  }
  #cover.done { opacity: 0; pointer-events: none; }
  #spinner {
    width: 38%;
    animation: spin 2.4s linear infinite;    /* one full turn every 2.4 seconds */
  }
  @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
  #barOuter { width: 46%; height: 16px; border: 3px solid #fff; padding: 2px; }
  #barInner { height: 100%; width: 0; background: #fff; transition: width .15s; }

  /* ===== "ask and wait" box ===== */
  #ask {
    position: absolute; left: 4%; right: 4%; bottom: 4%; z-index: 4;
    background: #000; border: 3px solid #fff; padding: 10px; display: flex; flex-direction: column; gap: 8px;
  }
  #ask[hidden] { display: none; }
  #askText { font-size: 11px; }
  #ask div { display: flex; gap: 8px; }
  #askInput { flex: 1; font: inherit; font-size: 12px; padding: 6px; background: #111; color: #fff; border: 2px solid #fff; }
  #ask button { font: inherit; font-size: 11px; background: var(--accent); color: #fff; border: 2px solid #fff; padding: 0 10px; cursor: pointer; }


  /* ===== Settings + Mods panels (sizes use --u = 1 Scratch pixel) ===== */
  .panel {
    position: absolute; inset: 0; z-index: 6; background: #000; color: #fff;
    font-family: "Share Tech Mono", monospace; font-size: calc(var(--u) * 13);
    display: flex; flex-direction: column; padding: calc(var(--u) * 14) calc(var(--u) * 18);
    animation: fadeIn .35s;
  }
  .panel[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0; } }
  .panel button, .panel input { font: inherit; color: #fff; }
  .panel button { cursor: pointer; background: #000; border: calc(var(--u) * 2) solid #fff; padding: calc(var(--u) * 4) calc(var(--u) * 10); }
  .panel button:hover { background: #222; }
  .panel button:active { transform: translateY(calc(var(--u) * 1)); }
  .panel button:disabled { opacity: .4; cursor: wait; }

  /* settings */
  #settingsPanel h2 { font-size: calc(var(--u) * 22); font-weight: normal; margin-bottom: calc(var(--u) * 16); }
  #settingsPanel .row { display: flex; align-items: center; gap: calc(var(--u) * 12); margin: calc(var(--u) * 9) 0 calc(var(--u) * 9) calc(var(--u) * 40); }
  #settingsPanel .label { width: calc(var(--u) * 110); font-size: calc(var(--u) * 15); }
  #settingsPanel .pair { display: flex; gap: calc(var(--u) * 8); }
  /* jumpscare buttons: orange when picked, gray when not (like the old pictures) */
  #settingsPanel .pick { min-width: calc(var(--u) * 70); font-family: "Sans Serif", sans-serif; font-size: calc(var(--u) * 16);
    background: #666; border-color: #666; padding: calc(var(--u) * 3) calc(var(--u) * 10); }
  #settingsPanel .pick:hover { border-color: #fff; background: #777; }
  #settingsPanel .pick.on { background: #f7931e; border-color: #f7931e; }
  #settingsPanel .pick.on:hover { border-color: #fff; }
  #settingsPanel input[type=range] { width: calc(var(--u) * 170); accent-color: #f7931e; }
  #settingsPanel .val { width: calc(var(--u) * 40); color: #aaa; }
  #settingsPanel .big { font-size: calc(var(--u) * 15); padding: calc(var(--u) * 4) calc(var(--u) * 22); }
  #settingsPanel .confirm { margin: auto auto 0; font-family: "Sans Serif", sans-serif; font-size: calc(var(--u) * 18);
    background: #666; border-color: #666; padding: calc(var(--u) * 4) calc(var(--u) * 26); }
  #settingsPanel .confirm:hover { border-color: #fff; }

  /* mods */
  #modsPanel { gap: calc(var(--u) * 7); }
  .modsTop { display: flex; align-items: center; gap: calc(var(--u) * 10); }
  .modsTop h2 { font-size: calc(var(--u) * 20); font-weight: normal; }
  .tabs { display: flex; gap: calc(var(--u) * 6); margin-left: auto; }
  .tabs button.on { background: #fff; color: #000; }
  .pane { border: calc(var(--u) * 2) solid #444; padding: calc(var(--u) * 6) calc(var(--u) * 8); display: flex; flex-wrap: wrap; gap: calc(var(--u) * 6); align-items: center; }
  .pane[hidden] { display: none; }
  .pane .hint { color: #999; font-size: calc(var(--u) * 11); width: 100%; }
  #ghInput { flex: 1; min-width: 0; background: #111; border: calc(var(--u) * 2) solid #fff; padding: calc(var(--u) * 4) calc(var(--u) * 6); }
  #modStatus { min-height: calc(var(--u) * 15); font-size: calc(var(--u) * 11); color: #9f9; }
  #modStatus.bad { color: #ff6b6b; }
  .lists { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 10); min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col h3 { font-weight: normal; font-size: calc(var(--u) * 13); margin-bottom: calc(var(--u) * 4); }
  .col h3 small { color: #999; font-size: calc(var(--u) * 10); }
  .list { flex: 1; overflow-y: auto; border: calc(var(--u) * 2) solid #fff; padding: calc(var(--u) * 5); }
  #modsInUse { border-color: #f7931e; }
  .mod { position: relative; border: calc(var(--u) * 2) solid #666; padding: calc(var(--u) * 4) calc(var(--u) * 22) calc(var(--u) * 4) calc(var(--u) * 6);
    margin-bottom: calc(var(--u) * 5); background: #111; cursor: grab; touch-action: none; user-select: none; }
  .mod:hover { border-color: #fff; }
  .modName { font-size: calc(var(--u) * 13); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .modInfo { font-size: calc(var(--u) * 10); color: #999; }
  .mod .del { position: absolute; right: calc(var(--u) * 3); top: calc(var(--u) * 3); border: none; padding: 0 calc(var(--u) * 4); font-size: calc(var(--u) * 14); color: #999; background: none; }
  .mod .del:hover { color: #ff6b6b; background: none; }
  .mod.dragging { opacity: .3; }
  .mod.ghost { position: fixed; z-index: 99; pointer-events: none; opacity: .9; border-color: #fff; font-family: "Share Tech Mono", monospace; color: #fff; }
  .dropMark { height: calc(var(--u) * 3); background: #f7931e; margin-bottom: calc(var(--u) * 5); }
  .empty { color: #666; font-size: calc(var(--u) * 11); text-align: center; padding: calc(var(--u) * 14) 0; }
  #reloadNote { position: absolute; inset: 0; z-index: 7; background: #000; display: flex; align-items: center; justify-content: center; }
  #reloadNote[hidden] { display: none; }
</style>
</head>
<body>

<div id="frame">
  <canvas id="stage" tabindex="0"></canvas>

  <!-- Loading screen: spinning rice bowl + loading bar -->
  <div id="cover">
    <img id="spinner" src="assets/loading-rice.webp" alt="">
    <div id="barOuter"><div id="barInner"></div></div>
  </div>


  <!-- Settings screen (opens when the Settings button is clicked) -->
  <div id="settingsPanel" class="panel" hidden></div>

  <!-- Mods screen -->
  <div id="modsPanel" class="panel" hidden>
    <div class="modsTop">
      <button id="modsBack">&lt; BACK</button>
      <h2>MODS</h2>
      <div class="tabs">
        <button id="tabUnpacked">LOAD UNPACKED</button>
        <button id="tabPacked">LOAD PACKED</button>
      </div>
    </div>
    <div class="pane" id="paneUnpacked">
      <button id="pickFolder">PICK MOD FOLDER</button>
      <button id="pickZip">PICK .ZIP</button>
      <button id="tplBtn" style="margin-left:auto">DOWNLOAD TEMPLATE</button>
      <div class="hint">Pick a mod folder from your computer. New to modding? Download the template, change some files, then pick that folder.</div>
      <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
      <input type="file" id="zipInput" accept=".zip" hidden>
    </div>
    <div class="pane" id="panePacked" hidden>
      <input id="ghInput" placeholder="github.com/user/repo" autocomplete="off" spellcheck="false">
      <button id="ghLoad">LOAD</button>
      <div class="hint">Loads a mod straight from a public GitHub repo (it needs a manifest.json).</div>
    </div>
    <div id="modStatus"></div>
    <div class="lists">
      <div class="col"><h3>DOWNLOADED <small>(not in use)</small></h3><div class="list" id="modsDownloaded"></div></div>
      <div class="col"><h3>IN USE <small>(top one wins)</small></h3><div class="list" id="modsInUse"></div></div>
    </div>
  </div>
  <div id="reloadNote" hidden></div>

  <!-- Box for the "ask and wait" block -->
  <form id="ask" hidden>
    <div id="askText"></div>
    <div><input id="askInput" autocomplete="off"><button type="submit">OK</button></div>
  </form>
</div>

<script>
/* =====================================================================
   MINI SCRATCH ENGINE
   Runs the converted Scratch scripts in plain JavaScript.

   How it works (short version):
   - Every sprite is a "Target" with a position, costume, size, effects
     and its own variables.
   - Every script is a generator function (function*). The engine steps
     each running script ("thread") until it hits a `yield`, then moves
     to the next one. That is exactly how Scratch shares time between
     scripts, so timing and loop behavior match the original project.
   - 30 times per second the engine runs the threads, then draws all
     visible sprites onto a <canvas>.
   ===================================================================== */
"use strict";

const STAGE_W = 480, STAGE_H = 360;
const FRAME_MS = 1000 / 30;          // Scratch runs at 30 frames per second
const WORK_MS = FRAME_MS * 0.75;     // max time scripts may use per frame
const WAIT = Symbol("wait");         // yielded by waits (not counted as "busy")
const FENCE = 15;                    // sprites must keep 15px on stage (Scratch rule)
let SMOOTH = true;                   // blend movement between steps (set false for exact Scratch look)

/* ---------------------------------------------------------------------
   Scratch value rules
   Scratch treats "10" and 10 the same in math, compares text without
   caring about capital letters, and so on. These helpers copy that.
   --------------------------------------------------------------------- */
function num(v) {
  if (typeof v === "number") return isNaN(v) ? 0 : v;
  const n = Number(v);
  return isNaN(n) ? 0 : n;
}
function str(v) { return String(v); }
function bool(v) {
  if (typeof v === "boolean") return v;
  if (typeof v === "string") return !(v === "" || v === "0" || v.toLowerCase() === "false");
  return Boolean(v);
}
function isWhite(v) { return v === null || (typeof v === "string" && v.trim().length === 0); }
function compare(a, b) {
  let n1 = Number(a), n2 = Number(b);
  if (n1 === 0 && isWhite(a)) n1 = NaN;
  if (n2 === 0 && isWhite(b)) n2 = NaN;
  if (isNaN(n1) || isNaN(n2)) {
    const s1 = String(a).toLowerCase(), s2 = String(b).toLowerCase();
    return s1 < s2 ? -1 : s1 > s2 ? 1 : 0;
  }
  if ((n1 === Infinity && n2 === Infinity) || (n1 === -Infinity && n2 === -Infinity)) return 0;
  return n1 - n2;
}
const eq = (a, b) => compare(a, b) === 0;
const lt = (a, b) => compare(a, b) < 0;
const gt = (a, b) => compare(a, b) > 0;
function join(a, b) { return str(a) + str(b); }
function letterOf(i, s) { s = str(s); i = num(i) - 1; return (i < 0 || i >= s.length) ? "" : s.charAt(i); }
function isInt(v) {
  if (typeof v === "number") return isNaN(v) || v === parseInt(v, 10);
  if (typeof v === "boolean") return true;
  if (typeof v === "string") return v.indexOf(".") < 0;
  return false;
}
function random(a, b) {
  const lo = Math.min(num(a), num(b)), hi = Math.max(num(a), num(b));
  if (lo === hi) return lo;
  if (isInt(a) && isInt(b)) return lo + Math.floor(Math.random() * (hi + 1 - lo));
  return Math.random() * (hi - lo) + lo;
}
// Scratch hides tiny float errors in x/y reporters (like 9.999999999)
function limitPrecision(n) { const r = Math.round(n); return Math.abs(n - r) < 1e-9 ? r : n; }

/* ---------------------------------------------------------------------
   Assets: images, fonts and sounds are loaded once, before the game starts
   --------------------------------------------------------------------- */
const Assets = {
  images: new Map(),   // url -> HTMLImageElement
  sounds: new Map(),   // url -> AudioBuffer
  tints: new Map(),    // "url|color" -> canvas (for silhouettes)

  image(url) { return this.images.get(url); },

  // Draws an image filled with one flat color (used for black silhouettes)
  tinted(url, color) {
    const key = url + "|" + color;
    if (!this.tints.has(key)) {
      const img = this.image(url);
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.ceil(img.naturalWidth * 2));
      c.height = Math.max(1, Math.ceil(img.naturalHeight * 2));
      const g = c.getContext("2d");
      g.drawImage(img, 0, 0, c.width, c.height);
      g.globalCompositeOperation = "source-in";
      g.fillStyle = color;
      g.fillRect(0, 0, c.width, c.height);
      this.tints.set(key, c);
    }
    return this.tints.get(key);
  },

  // Loads every file and reports progress (0 to 1)
  async loadAll(imageUrls, soundUrls, audio, onProgress) {
    const total = imageUrls.length + soundUrls.length;
    let done = 0;
    const tick = () => onProgress(++done / total);
    const loadImage = url => new Promise(res => {
      const img = new Image();
      img.onload = () => { this.images.set(url, img); tick(); res(); };
      img.onerror = () => { console.warn("Missing image", url); this.images.set(url, img); tick(); res(); };
      img.src = url;
    });
    const loadSound = async url => {
      try {
        const data = await (await fetch(url)).arrayBuffer();
        this.sounds.set(url, await audio.decodeAudioData(data));
      } catch (e) { console.warn("Missing sound", url, e); }
      tick();
    };
    // a few at a time so the browser stays responsive
    const queue = [...imageUrls.map(u => () => loadImage(u)), ...soundUrls.map(u => () => loadSound(u))];
    const workers = Array.from({ length: 8 }, async () => { while (queue.length) await queue.shift()(); });
    await Promise.all(workers);
  }
};

/* ---------------------------------------------------------------------
   Costumes
   A costume is a stack of layers drawn in "costume units" (1 unit =
   1 Scratch pixel at 100% size). Layer types:
     {img, x, y, w, h}          a picture
     {img, m:[a,b,c,d,e,f], iw, ih, tint?}  a character picture placed with a
                                matrix (used for characters on cameras)
     {rect:[x,y,w,h], fill, stroke, lw}     a rectangle
     {text, font, color, box:[x,y,w,h]}     real text squeezed into a box
   --------------------------------------------------------------------- */
const textCache = new Map();   // font|text -> measured ink box

function measureInk(ctx, text, font) {
  const key = font + "|" + text;
  if (!textCache.has(key)) {
    ctx.font = `100px "${font}"`;
    const m = ctx.measureText(text);
    textCache.set(key, {
      left: -m.actualBoundingBoxLeft, top: -m.actualBoundingBoxAscent,
      w: m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
      h: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent
    });
  }
  return textCache.get(key);
}

// Words shown in the game. Mods can change them with texts.json
// (original text -> new text). Filled in before the game starts.
let TEXTS = {};

function drawCostume(ctx, cos) {
  if (cos.spin && ctx !== maskCtx) {
    // a flat picture spinning in 3D (like the rice bowl on the loading screen): squeeze it sideways
    const turn = Math.cos(performance.now() / 2400 * Math.PI * 2);
    ctx.translate(cos.w / 2, 0); ctx.scale(turn, 1); ctx.translate(-cos.w / 2, 0);
  }
  if (cos.clip) { ctx.beginPath(); ctx.rect(0, 0, cos.w, cos.h); ctx.clip(); }
  for (const L of cos.layers) {
    if (L.img) {
      const img = L.tint ? Assets.tinted(L.img, L.tint) : Assets.image(L.img);
      if (!img || (img.complete === false)) continue;
      ctx.save();
      if (L.cut) {                      // only show part of the picture
        ctx.beginPath(); ctx.rect(...L.cut); ctx.clip();
      }
      if (L.outline) {                  // only show the picture inside these shapes (custom night heads)
        if (!L._clip) {
          L._clip = new Path2D();
          for (const [d, m] of L.outline) L._clip.addPath(new Path2D(d), new DOMMatrix(m));
        }
        ctx.clip(L._clip);
      }
      if (L.m) {
        ctx.transform(...L.m);
        ctx.drawImage(img, 0, 0, L.iw, L.ih);
      } else {
        ctx.drawImage(img, L.x, L.y, L.w, L.h);
      }
      if (L.shade) {                    // darken the picture (characters in dark rooms)
        ctx.globalAlpha *= L.shade;
        const dark = Assets.tinted(L.img, "#000");
        if (L.m) ctx.drawImage(dark, 0, 0, L.iw, L.ih); else ctx.drawImage(dark, L.x, L.y, L.w, L.h);
      }
      ctx.restore();
    } else if (L.rect) {
      const [x, y, w, h] = L.rect;
      if (L.fill && L.hole) {
        // a filled box with a see-through window cut out of it
        const [hx, hy, hw, hh] = L.hole;
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.rect(hx, hy, hw, hh);
        ctx.fillStyle = L.fill;
        ctx.fill("evenodd");
      } else if (L.fill) { ctx.fillStyle = L.fill; ctx.fillRect(x, y, w, h); }
      if (L.stroke) {
        ctx.strokeStyle = L.stroke; ctx.lineWidth = L.lw;
        ctx.strokeRect(x + L.lw / 2, y + L.lw / 2, w - L.lw, h - L.lw);
      }
    } else if (L.text !== undefined) {
      drawText(ctx, L);
    }
  }
}

function drawText(ctx, L) {
  const shown = TEXTS[L.text] !== undefined ? String(TEXTS[L.text]) : L.text;
  if (L.tm) {
    // text exactly as it was in an SVG drawing (can be turned and stretched)
    ctx.save();
    ctx.transform(...L.tm);
    ctx.font = `${L.size}px "${L.font}"`;
    ctx.fillStyle = L.color;
    ctx.textBaseline = "alphabetic";
    ctx.fillText(shown, L.pos[0], L.pos[1]);
    ctx.restore();
    return;
  }
  if (L.at) {
    // text placed like in the original drawing: [left x, baseline y, font size]
    ctx.save();
    ctx.font = `${L.at[2]}px "${L.font}"`;
    ctx.fillStyle = L.color;
    ctx.textBaseline = "alphabetic";
    ctx.fillText(shown, L.at[0], L.at[1]);
    ctx.restore();
    return;
  }
  const [x, y, w, h] = L.box;
  const orig = measureInk(ctx, L.text, L.font);
  if (orig.w <= 0 || orig.h <= 0) return;
  ctx.save();
  ctx.font = `100px "${L.font}"`;
  ctx.fillStyle = L.color;
  ctx.textBaseline = "alphabetic";
  if (shown === L.text && !L.like) {
    // Stretch the text so its ink fills the box exactly where the old picture had it
    ctx.translate(x, y);
    ctx.scale(w / orig.w, h / orig.h);
    ctx.fillText(L.text, -orig.left, -orig.top);
  } else {
    // Changed text (or text sized like another one): keep the letter size, let the width change
    let k = h / orig.h;
    if (L.like) k = L.like[1] / measureInk(ctx, L.like[0], L.font).h;   // same letter size as L.like[0]
    const ink = measureInk(ctx, shown, L.font);
    const baseline = L.like ? y + h : y - orig.top * k;   // "like" boxes end on the baseline
    let left = x;
    if (L.align === "center") left = x + w / 2 - ink.w * k / 2;
    if (L.align === "right") left = x + w - ink.w * k;
    ctx.translate(left - ink.left * k, baseline);
    ctx.scale(k, k);
    ctx.fillText(shown, 0, 0);
  }
  ctx.restore();
}

let maskCtx = null;                  // (spinning costumes are measured unturned)

// Builds a 1-unit-per-pixel see-through map of a costume, used for clicks,
// "touching mouse" checks and keeping sprites on the stage.
function costumeMask(cos) {
  if (cos.mask !== undefined) return cos.mask;
  const w = Math.max(1, Math.ceil(cos.w)), h = Math.max(1, Math.ceil(cos.h));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  maskCtx = g;
  drawCostume(g, cos);
  maskCtx = null;
  let data = null;
  try { data = g.getImageData(0, 0, w, h).data; } catch (e) { data = null; }  // blocked when opened from a file:// URL
  let minX = w, minY = h, maxX = -1, maxY = -1;
  const alpha = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const a = data ? data[(y * w + x) * 4 + 3] : 255;
    alpha[y * w + x] = a;
    if (a > 0) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  }
  cos.mask = { w, h, alpha, box: maxX < 0 ? null : [minX, minY, maxX + 1, maxY + 1] };
  return cos.mask;
}

/* ---------------------------------------------------------------------
   Target = a sprite (or the stage, or a clone of a sprite)
   --------------------------------------------------------------------- */
class Target {
  constructor(rt, def, from) {
    this.rt = rt;
    this.def = def;                      // shared data: name, costumes, sounds, scripts
    this.name = def.name;
    this.isStage = def.isStage;
    this.isClone = !!from;
    const s = from || def.start;         // starting values (or the parent's for clones)
    this.x = s.x; this.y = s.y;
    this.dir = s.dir; this.size = s.size;
    this.visible = s.visible;
    this.costumeIndex = s.costumeIndex;
    this.rotationStyle = s.rotationStyle;
    this.draggable = s.draggable;
    this.volume = s.volume;
    this.effects = { ghost: 0, brightness: 0, ...(from ? from.effects : {}) };
    this.v = { ...(from ? from.v : def.start.vars) };   // local variables
    // sound output for this sprite (each sprite has its own volume);
    // music goes through the Music slider, everything else through the Sound slider
    this.outMusic = rt.audio.createGain();
    this.outSfx = rt.audio.createGain();
    this.outMusic.gain.value = this.outSfx.gain.value = this.volume / 100;
    this.outMusic.connect(rt.musicBus);
    this.outSfx.connect(rt.sfxBus);
    this.playing = new Map();            // sound index -> playback info
  }

  get costumeObj() { return this.def.costumes[this.costumeIndex]; }
  get costumeName() { return this.costumeObj.name; }
  get costumeNumber() { return this.costumeIndex + 1; }
  get xPos() { return limitPrecision(this.x); }
  get yPos() { return limitPrecision(this.y); }

  /* ---- motion ---- */
  goTo(x, y) {
    if (this.isStage) return;
    [x, y] = this.fence(x, y);
    if (x !== this.x || y !== this.y) { this.x = x; this.y = y; this.changed(); }
  }
  changeX(dx) { this.goTo(this.x + dx, this.y); }
  changeY(dy) { this.goTo(this.x, this.y + dy); }
  setX(x) { this.goTo(x, this.y); }
  setY(y) { this.goTo(this.x, y); }
  move(steps) {
    const r = (90 - this.dir) * Math.PI / 180;
    this.goTo(this.x + steps * Math.cos(r), this.y + steps * Math.sin(r));
  }
  turn(deg) {
    let d = (this.dir + deg) % 360;
    if (d > 180) d -= 360; if (d <= -180) d += 360;
    this.dir = d; this.changed();
  }
  goToTarget(name) {
    if (name === "_mouse_") return this.goTo(this.rt.mouseX, this.rt.mouseY);
    if (name === "_random_") return this.goTo(Math.round(STAGE_W * (Math.random() - 0.5)), Math.round(STAGE_H * (Math.random() - 0.5)));
    const t = this.rt.sprite(name);
    if (t) this.goTo(t.x, t.y);
  }
  *glide(secs, x, y) {
    const sx = this.x, sy = this.y, start = performance.now(), ms = secs * 1000;
    if (ms <= 0) { this.goTo(x, y); return; }
    yield WAIT;
    for (;;) {
      const f = (performance.now() - start) / ms;
      if (f >= 1) { this.goTo(x, y); return; }
      this.goTo(sx + (x - sx) * f, sy + (y - sy) * f);
      yield WAIT;
    }
  }

  // Scratch keeps at least a small part of every sprite on the stage
  bounds(x = this.x, y = this.y) {
    const m = costumeMask(this.costumeObj);
    if (!m.box) return null;
    const c = this.costumeObj, s = this.size / 100;
    const [x0, y0, x1, y1] = m.box;
    let pts = [[x0, y0], [x1, y0], [x0, y1], [x1, y1]].map(([u, v]) => [(u - c.cx) * s, (c.cy - v) * s]);
    if (this.rotationStyle === "all around" && this.dir !== 90) {
      const r = (90 - this.dir) * Math.PI / 180, cs = Math.cos(r), sn = Math.sin(r);
      pts = pts.map(([px, py]) => [px * cs - py * sn, px * sn + py * cs]);
    } else if (this.rotationStyle === "left-right" && this.dir < 0) {
      pts = pts.map(([px, py]) => [-px, py]);
    }
    const xs = pts.map(p => p[0] + x), ys = pts.map(p => p[1] + y);
    return { left: Math.min(...xs), right: Math.max(...xs), bottom: Math.min(...ys), top: Math.max(...ys) };
  }
  fence(x, y) {
    const b = this.bounds();
    if (!b) return [x, y];
    const dx = x - this.x, dy = y - this.y;
    const inset = Math.floor(Math.min(b.right - b.left, b.top - b.bottom) / 2);
    const sx = STAGE_W / 2 - Math.min(FENCE, inset), sy = STAGE_H / 2 - Math.min(FENCE, inset);
    if (b.right + dx < -sx) x = Math.ceil(this.x - (sx + b.right));
    else if (b.left + dx > sx) x = Math.floor(this.x + (sx - b.left));
    if (b.top + dy < -sy) y = Math.ceil(this.y - (sy + b.top));
    else if (b.bottom + dy > sy) y = Math.floor(this.y + (sy - b.bottom));
    return [x, y];
  }

  /* ---- looks ---- */
  show() { if (!this.visible) { this.visible = true; this.rt.redraw(); } }
  hide() { if (this.visible) { this.visible = false; this.rt.redraw(); } }
  costume(c) {
    const list = this.def.costumes;
    if (typeof c === "number") { this.setCostumeIndex(c - 1); return; }
    const i = list.findIndex(k => k.name === c);
    if (i >= 0) { this.setCostumeIndex(i); return; }
    if (c === "next costume") return this.nextCostume();
    if (c === "previous costume") return this.setCostumeIndex(this.costumeIndex - 1);
    if (c === "random costume") return this.setCostumeIndex(Math.floor(Math.random() * list.length));
    if (!isNaN(Number(c)) && !isWhite(c)) this.setCostumeIndex(Number(c) - 1);
  }
  setCostumeIndex(i) {
    const n = this.def.costumes.length;
    i = ((Math.round(i) % n) + n) % n;
    if (i !== this.costumeIndex) { this.costumeIndex = i; this.changed(); }
  }
  nextCostume() { this.setCostumeIndex(this.costumeIndex + 1); }
  setSize(size) {
    if (this.isStage) return;
    const c = this.costumeObj;
    const minScale = Math.min(1, Math.max(5 / c.w, 5 / c.h));
    const maxScale = Math.min(1.5 * STAGE_W / c.w, 1.5 * STAGE_H / c.h);
    const s = Math.min(maxScale, Math.max(minScale, size / 100)) * 100;
    if (s !== this.size) { this.size = s; this.changed(); }
  }
  effect(name) { return this.effects[name] || 0; }
  setEffect(name, value) {
    if (name === "ghost") value = Math.min(100, Math.max(0, value));
    if (name === "brightness") value = Math.min(100, Math.max(-100, value));
    this.effects[name] = value; this.changed();
  }
  clearEffects() { this.effects = { ghost: 0, brightness: 0 }; this.changed(); }
  goToFront() { this.rt.moveLayer(this, Infinity); }
  goToBack() { this.rt.moveLayer(this, -Infinity); }
  moveLayers(n) { this.rt.moveLayer(this, Math.round(n), true); }
  changed() { if (this.visible) this.rt.redraw(); }

  /* ---- sound ---- */
  findSound(s) {
    const list = this.def.sounds;
    let i = list.findIndex(k => k.name === s);
    if (i < 0 && typeof s === "number") i = ((Math.round(s) - 1) % list.length + list.length) % list.length;
    if (i < 0 && !isNaN(Number(s)) && !isWhite(s)) i = ((Math.round(Number(s)) - 1) % list.length + list.length) % list.length;
    return i;
  }
  playSound(s) {
    const i = this.findSound(s);
    if (i < 0) return null;
    this.stopSound(i);                    // playing the same sound again restarts it
    const buf = Assets.sounds.get(this.def.sounds[i].src);
    const p = { done: false };
    if (buf) {
      const src = this.rt.audio.createBufferSource();
      src.buffer = buf;
      src.connect(this.def.sounds[i].music ? this.outMusic : this.outSfx);
      src.onended = () => { p.done = true; if (this.playing.get(i) === p) this.playing.delete(i); };
      src.start();
      p.src = src;
    } else p.done = true;
    this.playing.set(i, p);
    return p;
  }
  *playSoundUntilDone(s) {
    const p = this.playSound(s);
    while (p && !p.done) yield WAIT;
  }
  stopSound(i) {
    const p = this.playing.get(i);
    if (p) { p.done = true; try { p.src && p.src.stop(); } catch (e) {} this.playing.delete(i); }
  }
  stopSounds() { for (const i of [...this.playing.keys()]) this.stopSound(i); }
  setVolume(v) {
    this.volume = Math.min(100, Math.max(0, v));
    this.outMusic.gain.value = this.outSfx.gain.value = this.volume / 100;
  }

  /* ---- sensing ---- */
  // true if stage point (x, y) lands on a non-see-through pixel of this sprite
  hitTest(x, y) {
    const c = this.costumeObj, s = this.size / 100;
    let px = x - this.x, py = y - this.y;
    if (this.rotationStyle === "all around" && this.dir !== 90) {
      const r = -(90 - this.dir) * Math.PI / 180, cs = Math.cos(r), sn = Math.sin(r);
      [px, py] = [px * cs - py * sn, px * sn + py * cs];
    } else if (this.rotationStyle === "left-right" && this.dir < 0) px = -px;
    const u = Math.floor(px / s + c.cx), v = Math.floor(c.cy - py / s);
    const m = costumeMask(c);
    if (u < 0 || v < 0 || u >= m.w || v >= m.h) return false;
    return m.alpha[v * m.w + u] > 0;
  }
  touching(what) {
    if (what === "_mouse_") {
      if (this.isStage) return false;
      return this.hitTest(this.rt.mouseX, this.rt.mouseY);
    }
    return false; // (this project only checks the mouse pointer)
  }
}

/* ---------------------------------------------------------------------
   Thread = one running script
   --------------------------------------------------------------------- */
class Thread {
  constructor(target, script) {
    this.target = target;
    this.script = script;
    this.gen = script.fn.call(target, target);
    this.done = false;
  }
}

/* ---------------------------------------------------------------------
   Runtime = the whole game: all sprites, all running scripts, drawing
   --------------------------------------------------------------------- */
class Runtime {
  constructor(canvas, project) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.audio = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.audio.createGain();
    this.master.connect(this.audio.destination);
    this.musicBus = this.audio.createGain();      // Music volume (settings)
    this.sfxBus = this.audio.createGain();        // Sound volume (settings)
    this.musicBus.connect(this.master);
    this.sfxBus.connect(this.master);
    this.hooks = {};                              // page code that runs when a message is broadcast
    this.project = project;
    this.defs = new Map();                 // sprite name -> shared definition
    this.targets = [];                     // stage + sprites + clones
    this.drawOrder = [];                   // sprites from back to front
    this.threads = [];
    this.cur = null;                       // the thread being stepped right now
    this.mouseX = 0; this.mouseY = 0; this.mouseDown = false;
    this.keys = new Set();
    this.arrowHistory = [];
    this.answer = "";
    this.needsRedraw = true;
    this.redrawRequested = false;
    for (const d of project.targets) { d.scripts = []; this.defs.set(d.name, d); }
  }

  /* ---- setup ---- */
  scripts(name, register) {
    const d = this.defs.get(name);
    if (!d) return;
    register({ on: (type, arg, fn) => {
      if (typeof arg === "function") { fn = arg; arg = null; }
      d.scripts.push({ type, arg: arg === null ? null : String(arg).toLowerCase(), fn });
    } });
  }
  createTargets() {
    for (const t of this.targets) t.stopSounds();
    this.targets = []; this.drawOrder = [];
    const defs = [...this.defs.values()].sort((a, b) => a.start.layer - b.start.layer);
    for (const d of defs) {
      const t = new Target(this, d);
      this.targets.push(t);
      if (t.isStage) { this.stage = t; G = t.v; } else this.drawOrder.push(t);
    }
  }
  sprite(name) { return this.targets.find(t => t.name === name && !t.isClone && !t.isStage); }

  /* ---- scripts and events ---- */
  // Scripts start top sprite first, stage last (same order as Scratch)
  executionOrder() { return [...this.drawOrder].reverse().concat(this.stage ? [this.stage] : []); }

  startHats(type, arg = null, only = null, restart = true) {
    const key = arg === null ? null : String(arg).toLowerCase();
    const started = [];
    for (const t of only ? [only] : this.executionOrder()) {
      for (const s of t.def.scripts) {
        if (s.type !== type || s.arg !== key) continue;
        const old = this.threads.find(th => th.target === t && th.script === s && !th.done);
        if (old) {
          if (!restart) continue;
          const fresh = new Thread(t, s);
          old.done = true;                       // the old run stops at its next pause
          this.threads[this.threads.indexOf(old)] = fresh;
          started.push(fresh);
        } else {
          const th = new Thread(t, s);
          this.threads.push(th);
          started.push(th);
        }
      }
    }
    return started;
  }
  broadcast(name) {
    const hook = this.hooks[str(name).toLowerCase()];
    if (hook) hook();
    return this.startHats("broadcast", str(name));
  }
  *broadcastAndWait(name) {
    const started = this.broadcast(name);
    yield WAIT;
    while (started.some(th => !th.done)) yield WAIT;
  }
  *wait(secs) {
    const end = performance.now() + Math.max(0, secs * 1000);
    this.redraw();                               // Scratch ends the busy loop when a wait starts
    yield WAIT;
    while (performance.now() < end) yield WAIT;
  }
  *waitUntil(test) { while (!test()) yield WAIT; }
  *ask(question) {
    const box = document.getElementById("ask");
    const input = document.getElementById("askInput");
    document.getElementById("askText").textContent = question;
    box.hidden = false; input.value = ""; input.focus();
    let answered = null;
    const finish = () => { answered = input.value; };
    box.onsubmit = e => { e.preventDefault(); finish(); };
    while (answered === null) yield WAIT;
    box.hidden = true;
    this.answer = answered;
    document.getElementById("stage").focus();
  }

  stopOtherScripts(t) {
    for (const th of this.threads) if (th.target === t && th !== this.cur) th.done = true;
    t.stopSounds();                              // Scratch also stops that sprite's sounds
  }
  stopAllSounds() { for (const t of this.targets) t.stopSounds(); }
  stopAll() {
    for (const th of this.threads) th.done = true;
    this.threads = [];
    this.stopAllSounds();
    this.targets = this.targets.filter(t => !t.isClone);
    this.drawOrder = this.drawOrder.filter(t => !t.isClone);
    for (const t of this.targets) t.clearEffects();
    this.redraw();
  }
  greenFlag() {
    this.stopAll();
    this.startHats("flag");
  }

  createClone(t, which) {
    const src = which === "_myself_" ? t : this.sprite(which);
    if (!src || this.targets.filter(k => k.isClone).length >= 300) return;
    const c = new Target(this, src.def, src);
    this.targets.push(c);
    this.drawOrder.splice(this.drawOrder.indexOf(src), 0, c);   // clones sit just behind the original
    this.startHats("clone", null, c);
  }

  // value of another sprite ("x position of Fan", etc.)
  of(name, prop) {
    const t = name === "_stage_" ? this.stage : this.sprite(name);
    if (!t) return 0;
    switch (prop) {
      case "x position": return t.xPos;
      case "y position": return t.yPos;
      case "direction": return t.dir;
      case "costume #": case "backdrop #": return t.costumeNumber;
      case "costume name": case "backdrop name": return t.costumeName;
      case "size": return t.size;
      case "volume": return t.volume;
      default: return prop in t.v ? t.v[prop] : 0;
    }
  }

  moveLayer(t, n, relative = false) {
    const list = this.drawOrder, i = list.indexOf(t);
    if (i < 0) return;
    list.splice(i, 1);
    let j = relative ? i + n : (n > 0 ? list.length : 0);
    j = Math.max(0, Math.min(list.length, j));
    list.splice(j, 0, t);
    this.redraw();
  }

  redraw() { this.redrawRequested = true; this.needsRedraw = true; }

  /* ---- one frame of scripts ---- */
  step() {
    this.redrawRequested = false;
    // remember where everything was, so frames drawn between steps can blend smoothly
    for (const t of this.targets) {
      t.prev = { x: t.x, y: t.y, size: t.size, dir: t.dir, ghost: t.effects.ghost, costume: t.costumeIndex, visible: t.visible };
    }
    // "while key held" hats (Makey Makey key block) start whenever the key is down
    for (const t of this.executionOrder()) for (const s of t.def.scripts) {
      if (s.type === "keyHeld" && this.keys.has(s.arg)) this.startHats("keyHeld", s.arg, t, false);
    }
    const start = performance.now();
    let busy;
    do {
      busy = 0;
      for (let i = 0; i < this.threads.length; i++) {
        const th = this.threads[i];
        if (th.done) continue;
        this.cur = th;
        let r;
        try { r = th.gen.next(); }
        catch (e) { console.error(`Script error in "${th.target.name}"`, e); r = { done: true }; }
        if (r.done) th.done = true;
        else if (r.value !== WAIT && !th.done) busy++;
      }
      this.cur = null;
      this.threads = this.threads.filter(th => !th.done);
    } while (busy > 0 && !this.redrawRequested && performance.now() - start < WORK_MS);
  }

  /* ---- drawing ---- */
  // a = how far we are between the last step and the next one (0 to 1).
  // Position, size, turn and fade are blended so movement looks smooth on fast screens;
  // big jumps (teleports, costume changes) are not blended.
  render(a = 1) {
    const ctx = this.ctx, cw = this.canvas.width, ch = this.canvas.height;
    const k = cw / STAGE_W;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, cw, ch);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    let moving = false;
    for (const t of [this.stage, ...this.drawOrder]) {
      if (!t || !t.visible) continue;
      let { x, y, size, dir } = t, ghost = t.effects.ghost;
      const p = t.prev;
      if (SMOOTH && p && a < 1 && p.visible && !t.isStage) {
        // Same rules as TurboWarp's interpolation:
        const f = (u, v) => u + (v - u) * a;
        // position: always, unless it is a big jump (judged by the sprite's own size)
        const dx = x - p.x, dy = y - p.y;
        const b = t.bounds();
        const tol = b ? Math.min(240, Math.max(50, 1.5 * ((b.right - b.left) + (b.top - b.bottom)))) : 50;
        if ((Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) && Math.abs(dx) < tol && Math.abs(dy) < tol) {
          x = f(p.x, x); y = f(p.y, y); moving = true;
        }
        // fade: small changes only
        const dg = ghost - p.ghost;
        if (dg !== 0 && Math.abs(dg) < 25) { ghost = f(p.ghost, ghost); moving = true; }
        // turn and size: only while the costume stays the same
        if (p.costume === t.costumeIndex) {
          if (dir !== p.dir && !(p.dir % 90 === 0 && dir % 90 === 0)) {
            const r1 = p.dir * Math.PI / 180, r2 = dir * Math.PI / 180;
            dir = Math.atan2(f(Math.sin(r1), Math.sin(r2)), f(Math.cos(r1), Math.cos(r2))) * 180 / Math.PI;
            moving = true;
          }
          if (size !== p.size && Math.abs(size - p.size) < 100) { size = f(p.size, size); moving = true; }
        }
      }
      if (ghost >= 100) continue;
      const c = t.costumeObj;
      ctx.save();
      ctx.setTransform(k, 0, 0, k, 0, 0);
      if (t.isStage) {
        ctx.translate(STAGE_W / 2 - c.cx, STAGE_H / 2 - c.cy);
      } else {
        ctx.translate(STAGE_W / 2 + x, STAGE_H / 2 - y);
        if (t.rotationStyle === "all around") ctx.rotate((dir - 90) * Math.PI / 180);
        else if (t.rotationStyle === "left-right" && dir < 0) ctx.scale(-1, 1);
        ctx.scale(size / 100, size / 100);
        ctx.translate(-c.cx, -c.cy);
      }
      ctx.globalAlpha = 1 - ghost / 100;
      // brightness: Scratch adds light; a CSS filter is a close match
      if (t.effects.brightness) ctx.filter = `brightness(${Math.max(0, 1 + t.effects.brightness / 100)})`;
      drawCostume(ctx, c);
      ctx.restore();
      if (c.spin) moving = true;        // keep the spin going
    }
    this.needsRedraw = false;
    this.moving = moving;               // keep drawing in-between frames while something moves
  }

  /* ---- input ---- */
  setMouse(clientX, clientY) {
    const r = this.canvas.getBoundingClientRect();
    const x = (clientX - r.left) / r.width * STAGE_W - STAGE_W / 2;
    const y = STAGE_H / 2 - (clientY - r.top) / r.height * STAGE_H;
    this.mouseX = Math.round(Math.max(-STAGE_W / 2, Math.min(STAGE_W / 2, x)));
    this.mouseY = Math.round(Math.max(-STAGE_H / 2, Math.min(STAGE_H / 2, y)));
  }
  pick(x, y) {
    for (let i = this.drawOrder.length - 1; i >= 0; i--) {
      const t = this.drawOrder[i];
      if (t.visible && t.hitTest(x, y)) return t;
    }
    return null;
  }
  mousePressed() {
    this.mouseDown = true;
    const t = this.pick(this.mouseX, this.mouseY);
    if (!t) return;
    if (t.draggable) { this.drag = { t, ox: t.x - this.mouseX, oy: t.y - this.mouseY, moved: false }; t.goToFront(); }
    else this.startHats("click", null, t);
  }
  mouseMoved() {
    if (this.drag && this.mouseDown) {
      const d = this.drag;
      d.t.goTo(this.mouseX + d.ox, this.mouseY + d.oy);
      d.moved = true;
    }
  }
  mouseReleased() {
    this.mouseDown = false;
    if (this.drag) { if (!this.drag.moved) this.startHats("click", null, this.drag.t); this.drag = null; }
  }
  keyPressed(key) {
    this.keys.add(key);
    this.startHats("key", key, null, false);
    this.startHats("key", "any", null, false);
    // Makey Makey "when code pressed" (arrow key sequences)
    const arrow = { "left arrow": "LEFT", "right arrow": "RIGHT", "up arrow": "UP", "down arrow": "DOWN" }[key];
    if (arrow) {
      this.arrowHistory.push(arrow);
      if (this.arrowHistory.length > 8) this.arrowHistory.shift();
      for (const t of this.executionOrder()) for (const s of t.def.scripts) {
        if (s.type !== "keySequence") continue;
        const seq = s.arg.toUpperCase().split(" ");
        if (this.arrowHistory.slice(-seq.length).join(" ") === seq.join(" ")) {
          this.startHats("keySequence", s.arg, t, false);
        }
      }
    }
  }
  keyReleased(key) { this.keys.delete(key); }

/* =====================================================================
   SAVE PROGRESS
   Scratch forgets your progress when the page reloads. The web version
   remembers which night you reached. Set SAVE_PROGRESS to false to
   turn this off.
   ===================================================================== */
const SAVE_PROGRESS = true;
const SAVE_KEY = "frae1-save";
const SAVED_VARS = ["level", "beat 5", "beat 6", "beat 420"];

function loadSave() {
  if (!SAVE_PROGRESS) return;
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}");
    const stage = PROJECT.targets.find(t => t.isStage);
    for (const k of SAVED_VARS) if (k in saved) stage.start.vars[k] = saved[k];
  } catch (e) { /* storage blocked: just play without saving */ }
}
let lastSave = "";
function writeSave() {
  if (!SAVE_PROGRESS) return;
  const data = JSON.stringify(Object.fromEntries(SAVED_VARS.map(k => [k, G[k]])));
  if (data === lastSave) return;
  lastSave = data;
  try { localStorage.setItem(SAVE_KEY, data); } catch (e) {}
}

/* =====================================================================
   START UP
   ===================================================================== */
const canvas = document.getElementById("stage");
const frame = document.getElementById("frame");

// Fit the 4:3 screen inside the window (and keep it sharp on hi-res screens)
function fit() {
  const full = document.fullscreenElement === frame;
  const maxW = window.innerWidth - (full ? 0 : 40);
  const maxH = window.innerHeight - (full ? 0 : 40);
  const w = Math.max(240, Math.min(maxW, maxH * 4 / 3));
  const h = w * 3 / 4;
  frame.style.width = (full ? window.innerWidth : w + 8) + "px";
  frame.style.height = (full ? window.innerHeight : h + 8) + "px";
  canvas.style.width = w + "px";
  frame.style.setProperty("--u", (w / 480) + "px");     // 1 Scratch pixel, used by the panels
  canvas.style.height = h + "px";
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  if (rt) rt.redraw();
}
window.addEventListener("resize", fit);
document.addEventListener("fullscreenchange", fit);

loadSave();
rt = new Runtime(canvas, PROJECT);
fit();

scripts("Stage", t => {
  // when I receive [intro]
  t.on("broadcast", "intro", function* (t) {
    rt.stopOtherScripts(t);
  });

  // when I receive [win]
  t.on("broadcast", "win", function* (t) {
    rt.stopOtherScripts(t);
  });

  // when I receive [continue]
  t.on("broadcast", "continue", function* (t) {
    rt.stopOtherScripts(t);
    G.play = "1";
  });

  // when I receive [power out]
  t.on("broadcast", "power out", function* (t) {
    rt.stopOtherScripts(t);
  });

  // when green flag clicked
  t.on("flag", function* (t) {
    rt.broadcast("message1");
  });

  // when green flag clicked
  t.on("flag", function* (t) {
    rt.broadcast("message1");
  });

  // when green flag clicked
  t.on("flag", function* (t) {
    G.rice = "0";
  });

  // when I receive [newgame]
  t.on("broadcast", "newgame", function* (t) {
    G.play = "1";
  });

  // when I receive [dead]
  t.on("broadcast", "dead", function* (t) {
    rt.stopOtherScripts(t);
  });

  // when I receive [start]
  t.on("broadcast", "start", function* (t) {
    while (true) {
      yield* t.playSoundUntilDone("ColdPresc B");
      yield;
    }
  });

  // when I receive [night 7]

  });

  // when I receive [ricesong]
  t.on("broadcast", "ricesong", function* (t) {
    G.rice = "1";
    rt.stopAllSounds();
    yield* t.playSoundUntilDone("Fried Rice At Eddies (1)_E_major__bpm_103");
  });

  // when I receive [custom night]
  t.on("broadcast", "custom night", function* (t) {
    G.play = "1";
  });

  // when I receive [night 6]
  t.on("broadcast", "night 6", function* (t) {
    rt.stopOtherScripts(t);
    G.play = "1";
  });

  // when I receive [message1]
  t.on("broadcast", "message1", function* (t) {
    G.play = "0";
    t.setVolume(100);
    while (true) {
      if (eq(G.rice, "1")) {
      } else {
        yield* t.playSoundUntilDone("Menu");
      }
      yield;
    }
  });

  // when I receive [ricesong]
  t.on("broadcast", "ricesong", function* (t) {
    yield* rt.wait(5);
    rt.broadcast("Newspaper");
  });

  // when I receive [message1]
  t.on("broadcast", "message1", function* (t) {
    G.load = "0";
  });

  // when green flag clicked
  t.on("flag", function* (t) {
    if (eq(rt.answer, "1")) {
      yield* rt.ask("Want Custom night added? 1=yes 0=no");
      if (eq(rt.answer, "0")) {
        G["ini level"] = G["level?"];
        G["beat 5"] = "1";
        G["beat 6"] = "1";
        G["beat 420"] = "0";
      } else {
        if (eq(rt.answer, "1")) {
          G["ini level"] = G["level?"];
          G["beat 5"] = "1";
          G["beat 6"] = "1";
          G["beat 420"] = "1";
        } else {
          G.load = "0";
        }
      }
    } else {
      G.load = "0";
    }
  });
});

  t.on("broadcast", "Settings Menu", function* (t) {

  t.on("broadcast", "night 6", function* (t) {
    t.hide();
  });

    t.show();

      t.goToBack();

    t.hide();
  });

    while (true) {
      if (!eq(G["Foxy Progress"], "5")) {
        if (gt(t.v["hall flicker"], "3")) {
          t.costume("light off");
        } else {
          if (lt(t.v["hall flicker"], "4")) {
            if (eq(G["Bonnie Location"], "West Hall")) {
              t.costume("bonnie");
            } else {
              t.costume("light on");
            }
          } else {
          }
        }
      }
      yield;
    }
  });

  // when I receive [start]
  t.on("broadcast", "start", function* (t) {
    while (true) {
      t.goToTarget("Show Stage");
      yield;
    }
  });

  // when I receive [camera]
  t.on("broadcast", "camera", function* (t) {
    if (eq(G.Camera, "West Hall")) {
      t.show();
      if (eq(G["Foxy Progress"], "4")) {
        rt.broadcast("foxy run");
      }
    } else {
      t.hide();
    }
  });

  // when I receive [foxy run]
  t.on("broadcast", "foxy run", function* (t) {
    yield* rt.wait(2);
    G["Foxy Progress"] = "6";
  });

  // when I receive [foxy run]
  t.on("broadcast", "foxy run", function* (t) {
    G["Foxy Progress"] = "5";
    t.setVolume(100);
    t.playSound("run");
    t.costume("FoxyRun (1)");
    t.v.Frame = "0";
    for (let i1 = Math.round(31); i1 > 0; i1--) {
      t.v.Frame = num(t.v.Frame) + 1;
      t.costume(join("FoxyRun (", join(t.v.Frame, ")")));
      yield;
    }
  });

  // when I receive [freddy run]
  t.on("broadcast", "freddy run", function* (t) {
    if (eq(G["Freddy Location"], "Show Stage")) {
      t.setVolume(30);
    } else {
      if (eq(G["Freddy Location"], "Dining Area")) {
        t.setVolume(35);
      } else {
        if (eq(G["Freddy Location"], "Restrooms")) {
          t.setVolume(40);
        } else {
          if (eq(G["Freddy Location"], "Kitchen")) {
            t.setVolume(60);
          } else {
            if ((eq(G["Freddy Location"], "East Hall") || eq(G["Freddy Location"], "E. Hall Corner"))) {
              t.setVolume(75);
            } else {
              if (eq(G["Freddy Location"], "Got You")) {
                t.setVolume(100);
                while (true) {
                  yield* t.playSoundUntilDone("whispering2");
                  yield;
                }
              } else {
              }
            }
          }
        }
      }
    }
    t.playSound("running fast3");
  });
});

scripts("Bonnie", t => {
  // when I receive [start]
  t.on("broadcast", "start", function* (t) {
    while (true) {
      t.v["Bonnie Move"] = random("1", "2");
      yield* rt.wait(1);
      yield;
    }
  });

  // when green flag clicked
  t.on("flag", function* (t) {
    t.hide();
  });

  // when I receive [dead]
  t.on("broadcast", "dead", function* (t) {
    rt.stopOtherScripts(t);
    t.hide();
  });

  // when I receive [win]
  t.on("broadcast", "win", function* (t) {
    rt.stopOtherScripts(t);
    yield* rt.wait(3);
    t.hide();
  });

  // when I receive [power out]
  t.on("broadcast", "power out", function* (t) {
    if (eq(G["Bonnie Location"], "Got You")) {
      rt.stopOtherScripts(t);
      t.hide();
    }
  });

  // when I receive [start]
  t.on("broadcast", "start", function* (t) {
    yield* rt.waitUntil(() => eq(G.Time, "2"));
    G.BonnieAI = num(G.BonnieAI) + 1;
    yield* rt.waitUntil(() => eq(G.Time, "3"));
    G.BonnieAI = num(G.BonnieAI) + 1;
    yield* rt.waitUntil(() => eq(G.Time, "4"));
    G.BonnieAI = num(G.BonnieAI) + 1;
  });

  // when I receive [intro]
  t.on("broadcast", "intro", function* (t) {
    G["Bonnie Location"] = "Show Stage";
    if (eq(G.level, "1")) {
      G.BonnieAI = "0";
    } else {
      if (eq(G.level, "2")) {
        G.BonnieAI = "3";
      } else {
        if (eq(G.level, "3")) {
          G.BonnieAI = "0";
        } else {
          if (eq(G.level, "4")) {
            G.BonnieAI = "2";
          } else {
            if (eq(G.level, "5")) {
              G.BonnieAI = "5";
            } else {
              if (eq(G.level, "6")) {
                G.BonnieAI = "10";
              } else {
              }
            }
          }
        }
      }
    }
  });

  // when I receive [office]
  t.on("broadcast", "office", function* (t) {
    if (gt(G.Power, "0")) {
      if (eq(G["Bonnie Location"], "Got You")) {
        if (!eq(G["Chica Location"], "Got You")) {
          rt.broadcast("scream");
          if (eq(G.Jumpscares, "1")) {
            t.show();
            for (let i1 = Math.round(3); i1 > 0; i1--) {
              t.v.Frames = "1";
              t.costume("ScareBonnie (1)");
              while (!eq(rt.of("Bonnie", "costume name"), "ScareBonnie (11)")) {
                t.costume(join("ScareBonnie (", join(t.v.Frames, ")")));
                t.v.Frames = num(t.v.Frames) + 2;
                t.goToTarget("Fan");
                yield;
              }
              yield;
            }
          }
          yield* rt.wait(0.001);
          G.KilledYou = "Bonnie";
          rt.broadcast("dead");

  t.on("broadcast", "dead", function* (t) {
    rt.stopOtherScripts(t);
    t.hide();
  });

  // when I receive [win]
  t.on("broadcast", "win", function* (t) {
    rt.stopOtherScripts(t);
    yield* rt.wait(3);
    t.hide();
  });

  // when I receive [start]
  t.on("broadcast", "start", function* (t) {
    while (true) {
      t.goToTarget("Show Stage");
      yield;
    }
  });
});


/* =====================================================================
   SETTINGS + MODS
   - Settings screen: jumpscares on/off, music volume, sound volume, mods
   - Mods: load a mod folder (or .zip), load a mod from a GitHub repo,
     download a template mod, and drag mods between "Downloaded" and
     "In use". In use mods replace game files; the top one wins.
   Mods are saved in this browser (IndexedDB) and applied when the game
   loads, so the page reloads after mods change.
   ===================================================================== */

/* ---------------------------------------------------------------------
   Player settings (saved in this browser)
   --------------------------------------------------------------------- */
const SETTINGS_KEY = "frae1-settings";
const settings = { music: 100, sound: 100, jumpscares: "0" };
try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")); } catch (e) {}
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {} }
function applyVolumes() {
  rt.musicBus.gain.value = settings.music / 100;
  rt.sfxBus.gain.value = settings.sound / 100;
}

// Words for the settings screen (mods can change these too)
const T = s => (TEXTS[s] !== undefined ? String(TEXTS[s]) : s);

/* ---------------------------------------------------------------------
   Small helpers
   --------------------------------------------------------------------- */
const $ = sel => document.querySelector(sel);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids) e.append(k);
  return e;
}
const MIME = {
  png: "image/png", webp: "image/webp", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif",
  svg: "image/svg+xml", mp3: "audio/mpeg", wav: "audio/wav", ogg: "audio/ogg", m4a: "audio/mp4",
  ttf: "font/ttf", otf: "font/otf", woff: "font/woff", woff2: "font/woff2", json: "application/json", txt: "text/plain"
};
// Blobs need the right type or the browser will not show SVGs
function typed(blob, path) {
  const type = MIME[path.split(".").pop().toLowerCase()] || "application/octet-stream";
  return blob.type === type ? blob : new Blob([blob], { type });
}
// what kind of file an extension is (a mod may swap a file for another of the same kind)
const KINDS = { image: ["png", "webp", "jpg", "jpeg", "gif", "svg"], audio: ["mp3", "wav", "ogg", "m4a"], font: ["ttf", "otf", "woff", "woff2"] };
const kindOf = p => { const e = p.split(".").pop().toLowerCase(); return Object.keys(KINDS).find(k => KINDS[k].includes(e)) || e; };
const stemOf = p => p.split("/").slice(-2).join("/").replace(/\.[^./]+$/, "").toLowerCase();
let GAME_FILE_BY_STEM = null;
// "anything/img/office-normal.png" -> "img/office-normal.webp" (the game's own file), or null
function gameFile(path) {
  if (!GAME_FILE_BY_STEM) {
    GAME_FILE_BY_STEM = {};
    for (const a of ASSET_FILES) GAME_FILE_BY_STEM[stemOf(a)] = a;
  }
  const a = GAME_FILE_BY_STEM[stemOf(path)];
  return a && kindOf(a) === kindOf(path) ? a : null;
}

// Any picture -> PNG. Drawings (SVG) are made bigger so they stay sharp in close-ups.
async function toPng(blob, path) {
  const url = URL.createObjectURL(typed(blob, path));
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    let scale = 1;
    if (path.endsWith(".svg")) scale = path.startsWith("characters/") ? 6 : 4;
    const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
    const k = Math.min(1, 4096 / Math.max(w, h));             // keep huge pictures a sane size
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/png"));
  } finally { URL.revokeObjectURL(url); }
}

function sizeText(bytes) {
  return bytes > 1048576 ? (bytes / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(bytes / 1024)) + " KB";
}

/* ---------------------------------------------------------------------
   Mod storage (IndexedDB)
   Store "mods": { id, name, author, version, description, source, size, files: {path: Blob}, texts }
   Store "meta": "state" -> { downloaded: [ids], inUse: [ids] }  (inUse[0] = top = wins)
   --------------------------------------------------------------------- */
const ModDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open("frae1-mods", 1);
      r.onupgradeneeded = () => {
        r.result.createObjectStore("mods", { keyPath: "id" });
        r.result.createObjectStore("meta");
      };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
    });
  },
  allMods() { return this.tx("mods", "readonly", s => s.getAll()); },
  putMod(m) { return this.tx("mods", "readwrite", s => s.put(m)); },
  deleteMod(id) { return this.tx("mods", "readwrite", s => s.delete(id)); },
  async getState() {
    const st = await this.tx("meta", "readonly", s => s.get("state"));
    return st || { downloaded: [], inUse: [] };
  },
  putState(st) { return this.tx("meta", "readwrite", s => s.put(st, "state")); }
};

/* ---------------------------------------------------------------------
   Turning a list of files into a mod
   files: [{path, blob}] with paths like "MyMod/img/x.webp"
   --------------------------------------------------------------------- */
async function makeMod(files, fallbackName, source) {
  files = files.filter(f => !/(^|\/)(\.|__MACOSX)/.test(f.path));   // skip hidden/system files
  // the folder holding manifest.json is the mod's main folder
  const manifests = files.filter(f => /(^|\/)manifest\.json$/i.test(f.path))
                         .sort((a, b) => a.path.split("/").length - b.path.split("/").length);
  let root = "";
  if (manifests.length) root = manifests[0].path.replace(/manifest\.json$/i, "");
  else {
    // no manifest: if everything sits in one folder, use that folder
    const tops = new Set(files.map(f => f.path.split("/")[0]));
    if (tops.size === 1 && files.every(f => f.path.includes("/"))) root = [...tops][0] + "/";
  }
  let manifest = {};
  if (manifests.length) {
    try { manifest = JSON.parse(await manifests[0].blob.text()); }
    catch (e) { throw new Error("manifest.json is not valid JSON"); }
  }
  const mod = {
    id: "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    name: String(manifest.name || fallbackName || "Unnamed mod"),
    author: String(manifest.author || ""),
    version: String(manifest.version || ""),
    description: String(manifest.description || ""),
    source, files: {}, texts: null, size: 0
  };
  for (const f of files) {
    if (!f.path.startsWith(root)) continue;
    const rel = f.path.slice(root.length).replace(/^assets\//, "");
    if (/^manifest\.json$/i.test(rel)) continue;
    if (/^texts\.json$/i.test(rel)) {
      try { mod.texts = JSON.parse(await f.blob.text()); }
      catch (e) { throw new Error("texts.json is not valid JSON"); }
      continue;
    }
    // only keep files the game actually has (a mod replaces files, it cannot add new ones).
    // Same name, any picture/sound/font type: img/x.png replaces img/x.webp
    const target = gameFile(rel);
    if (!target) continue;
    mod.files[target] = typed(f.blob, rel);
    mod.size += f.blob.size;
  }
  if (!Object.keys(mod.files).length && !mod.texts) {
    throw new Error("No game files found. A mod needs files like img/..., snd/... or a texts.json (download the template to see).");
  }
  return mod;
}

async function addMod(mod) {
  await ModDB.putMod(mod);
  const st = await ModDB.getState();
  st.downloaded.unshift(mod.id);
  await ModDB.putState(st);
}

/* ---------------------------------------------------------------------
   ZIP files (no libraries): write uncompressed zips, read normal zips
   --------------------------------------------------------------------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
// entries: [{path, bytes: Uint8Array}] -> Blob (.zip, "stored" so it is fast)
function makeZip(entries) {
  const parts = [], central = [];
  let offset = 0;
  const enc = new TextEncoder();
  for (const e of entries) {
    const name = enc.encode(e.path), crc = crc32(e.bytes), n = e.bytes.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint32(14, crc, true); h.setUint32(18, n, true); h.setUint32(22, n, true); h.setUint16(26, name.length, true);
    parts.push(h, name, e.bytes);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint32(16, crc, true); c.setUint32(20, n, true); c.setUint32(24, n, true); c.setUint16(28, name.length, true);
    c.setUint32(42, offset, true);
    central.push(c, name);
    offset += 30 + name.length + n;
  }
  const size = central.reduce((a, p) => a + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, size, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: "application/zip" });
}
// Blob (.zip) -> [{path, blob}]
async function readZip(blob) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  const dv = new DataView(buf.buffer);
  let e = buf.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error("That file is not a zip");
  const count = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const dec = new TextDecoder(), out = [];
  for (let i = 0; i < count; i++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const path = dec.decode(buf.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    if (path.endsWith("/")) continue;
    const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
    let data = buf.slice(start, start + csize);
    if (method === 8) {
      const ds = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      data = new Uint8Array(await new Response(ds).arrayBuffer());
    } else if (method !== 0) continue;
    out.push({ path, blob: new Blob([data]) });
  }
  return out;
}
function download(blob, name) {
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

/* ---------------------------------------------------------------------
   Template mod: every game file (except the loading picture) + manifest + texts
   --------------------------------------------------------------------- */
async function buildTemplate(onProgress) {
  const enc = new TextEncoder(), entries = [];
  const manifest = {
    name: "My Eddie's Mod",
    author: "",
    version: "1.0.0",
    description: "Describe your mod here",
    game: "fried-rice-at-eddies-1",
    howTo: "Replace any file in img, snd, characters or fonts with your own using the SAME file name. Pictures can be PNG, JPG, WEBP or SVG at any size (they are stretched to fit the same spot). Sounds can be MP3, WAV or OGG. Change words in texts.json (only change the text on the right side). Delete the files you did not change to keep your mod small. Then load the folder (or a .zip of it) in Settings > Mods."
  };
  entries.push({ path: "manifest.json", bytes: enc.encode(JSON.stringify(manifest, null, 2)) });
  entries.push({ path: "texts.json", bytes: enc.encode(JSON.stringify(DEFAULT_TEXTS, null, 2)) });
  let done = 0;
  const queue = [...ASSET_FILES];
  const workers = Array.from({ length: 6 }, async () => {
    while (queue.length) {
      const f = queue.shift();
      const blob = await (await fetch("assets/" + f)).blob();
      if (kindOf(f) === "image") {
        // every picture goes in the template as a PNG (easy to open in any paint program)
        const png = await toPng(blob, f);
        entries.push({ path: f.replace(/\.[^.]+$/, ".png"), bytes: new Uint8Array(await png.arrayBuffer()) });
      } else {
        entries.push({ path: f, bytes: new Uint8Array(await blob.arrayBuffer()) });
      }
      onProgress(++done / ASSET_FILES.length);
    }
  });
  await Promise.all(workers);
  entries.sort((a, b) => a.path.localeCompare(b.path));
  return makeZip(entries);
}

/* ---------------------------------------------------------------------
   Loading a mod from GitHub ("packed")
   Accepts: user/repo, github.com/user/repo, or .../tree/branch/folder
   --------------------------------------------------------------------- */
async function loadFromGitHub(input, onStatus) {
  const m = input.trim().replace(/\.git$/, "").match(/(?:github\.com\/)?([\w.-]+)\/([\w.-]+)(?:\/tree\/([^/]+)\/?(.*))?/);
  if (!m) throw new Error("Type a GitHub repo like user/repo");
  const [, owner, repo, branchIn, folderIn] = m;
  onStatus("Looking up " + owner + "/" + repo + "...");
  const api = "https://api.github.com/repos/" + owner + "/" + repo;
  const info = await fetch(api);
  if (info.status === 404) throw new Error("Repo not found (it has to be public)");
  if (!info.ok) throw new Error("GitHub said no (" + info.status + "). Try again in a bit.");
  const branch = branchIn || (await info.json()).default_branch;
  const tree = await (await fetch(api + "/git/trees/" + encodeURIComponent(branch) + "?recursive=1")).json();
  if (!tree.tree) throw new Error("Could not read the repo files");
  const folder = (folderIn || "").replace(/\/$/, "");
  const blobs = tree.tree.filter(t => t.type === "blob" && (!folder || t.path.startsWith(folder + "/")));
  const wanted = blobs.filter(t => /(^|\/)(manifest\.json|texts\.json)$/i.test(t.path) ||
                                   gameFile(t.path));
  if (!wanted.length) throw new Error("No mod files in that repo");
  const files = [];
  let done = 0;
  const queue = [...wanted];
  const workers = Array.from({ length: 6 }, async () => {
    while (queue.length) {
      const t = queue.shift();
      const url = "https://raw.githubusercontent.com/" + owner + "/" + repo + "/" + branch + "/" + t.path.split("/").map(encodeURIComponent).join("/");
      const r = await fetch(url);
      if (r.ok) files.push({ path: t.path, blob: await r.blob() });
      onStatus("Downloading " + (++done) + " / " + wanted.length);
    }
  });
  await Promise.all(workers);
  return makeMod(files, repo, { type: "github", repo: owner + "/" + repo, branch });
}

/* ---------------------------------------------------------------------
   Applying mods when the game loads
   --------------------------------------------------------------------- */
const FONT_FAMILY = {
  "fonts/NotoSans-Medium.ttf": "Sans Serif", "fonts/SourceSerifPro-Regular.otf": "Serif",
  "fonts/Grand9K-Pixel.ttf": "Pixel", "fonts/PressStart2P.woff2": "Press Start 2P",
  "fonts/CourierPrime.woff2": "Courier Prime", "fonts/ShareTechMono.woff2": "Share Tech Mono"
};
async function applyMods() {
  // start with the game's own words
  const texts = {};
  const mergeTexts = obj => {
    for (const [k, v] of Object.entries(obj || {})) {
      if (v && typeof v === "object") mergeTexts(v);            // groups
      else if (typeof v === "string" && (v !== k || !(k in texts))) texts[k] = v;
    }
  };
  mergeTexts(DEFAULT_TEXTS);
  let mods = [];
  try {
    const st = await ModDB.getState();
    const all = await ModDB.allMods();
    mods = st.inUse.map(id => all.find(m => m.id === id)).filter(Boolean);
  } catch (e) { console.warn("Mods unavailable", e); }
  // bottom mod first, so the top mod's files and words win
  const files = {};
  for (const mod of [...mods].reverse()) {
    Object.assign(files, mod.files);
    if (mod.texts) mergeTexts(mod.texts);
  }
  TEXTS = texts;
  const url = {};
  for (const [path, blob] of Object.entries(files)) {
    url["assets/" + path] = URL.createObjectURL(blob);
    if (FONT_FAMILY[path]) {
      try {
        const face = new FontFace(FONT_FAMILY[path], await blob.arrayBuffer());
        await face.load();
        document.fonts.add(face);
      } catch (e) { console.warn("Mod font did not load", path); }
    }
  }
  for (const t of PROJECT.targets) {
    for (const c of t.costumes) for (const L of c.layers) if (L.img && url[L.img]) L.img = url[L.img];
    for (const s of t.sounds) if (url[s.src]) s.src = url[s.src];
  }
  return mods.length;
}

/* =====================================================================
   SETTINGS SCREEN
   ===================================================================== */
function buildSettings() {
  const box = $("#settingsPanel");
  box.innerHTML = "";
  const jsBtn = (label, val) => el("button", {

    input.addEventListener("input", () => { settings[key] = +input.value; out.textContent = input.value + "%"; applyVolumes(); saveSettings(); });
    return [input, out];
  };
  box.append(

    el("div", { class: "row" }, el("span", { class: "label" }, T("Jumpscares")),
       el("div", { class: "pair" }, jsBtn("ON", "1"), jsBtn("OFF", "0"))),
    el("div", { class: "row" }, el("span", { class: "label" }, T("Music")), ...slider("music")),
    el("div", { class: "row" }, el("span", { class: "label" }, T("Sound")), ...slider("sound")),
    el("div", { class: "row" }, el("span", { class: "label" }, ""),
       el("button", { class: "big", onclick: () => { blip(); openMods(); } }, T("Mods"))),
    el("button", { class: "confirm", onclick: closeSettings }, T("CONFIRM"))
