<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fried Rice at Eddie's</title>
<!-- Tab icon -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  /* ===== Fonts used by the game's text (Scratch's own fonts + pixel fonts) ===== */
  @font-face { font-family: "Sans Serif"; src: url("assets/fonts/NotoSans-Medium.ttf"); }
  @font-face { font-family: "Serif"; src: url("assets/fonts/SourceSerifPro-Regular.otf"); }
  @font-face { font-family: "Pixel"; src: url("assets/fonts/Grand9K-Pixel.ttf"); }
  @font-face { font-family: "Press Start 2P"; src: url("assets/fonts/PressStart2P.woff2"); }
  @font-face { font-family: "Courier Prime"; src: url("assets/fonts/CourierPrime.woff2"); }
  @font-face { font-family: "Share Tech Mono"; src: url("assets/fonts/ShareTechMono.woff2"); }

  /* ===== Page theme: black VHS look to match the game menu ===== */
  :root {
    --bg: #000;
    --line: #fff;
    --dim: #8a8a99;
    --accent: #5b16ec;
    --soul: #ff2a3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: #fff; overflow: hidden; }
  body {
    font-family: "Press Start 2P", monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }

  /* The game screen keeps its 4:3 shape and grows to fit the window */
  #frame {
    position: relative;
    border: 4px solid var(--line);
    box-shadow: 0 0 0 4px #000, 8px 8px 0 4px #1d1d2b;
    background: #000;
  }
  #stage { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }

  /* ===== Loading screen: a flat picture spinning in 3D, with a bar under it ===== */
  #cover {
    position: absolute; inset: 0; z-index: 5;
    background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6%;
    perspective: 900px;                       /* gives the spin its 3D depth */
    transition: opacity .4s;
  }
  #cover.done { opacity: 0; pointer-events: none; }
  #spinner {
    width: 38%;
    animation: spin 2.4s linear infinite;    /* one full turn every 2.4 seconds */
  }
  @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
  #barOuter { width: 46%; height: 16px; border: 3px solid #fff; padding: 2px; }
  #barInner { height: 100%; width: 0; background: #fff; transition: width .15s; }


  /* ===== Question box (left arrow: Golden Eddie's rate) ===== */
  #ask {
    position: absolute; left: 4%; right: 4%; bottom: 4%; z-index: 7;
    background: #000; border: 3px solid #fff; padding: 10px; display: flex; flex-direction: column; gap: 8px;
    font-family: "Share Tech Mono", monospace;
  }
  #ask[hidden] { display: none; }
  #askText { font-size: calc(var(--u) * 12); }
  #ask div { display: flex; gap: 8px; }
  #askInput { flex: 1; font: inherit; font-size: calc(var(--u) * 12); padding: 6px; background: #111; color: #fff; border: 2px solid #fff; }
  #ask button { font: inherit; font-size: calc(var(--u) * 11); background: #f7931e; color: #fff; border: 2px solid #fff; padding: 0 10px; cursor: pointer; }

  /* ===== Settings + Mods panels (sizes use --u = 1 game pixel) ===== */
  .panel {
    position: absolute; inset: 0; z-index: 6; background: #000; color: #fff;
    font-family: "Share Tech Mono", monospace; font-size: calc(var(--u) * 13);
    display: flex; flex-direction: column; padding: calc(var(--u) * 14) calc(var(--u) * 18);
    animation: fadeIn .35s;
  }
  .panel[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0; } }
  .panel button, .panel input { font: inherit; color: #fff; }
  .panel button { cursor: pointer; background: #000; border: calc(var(--u) * 2) solid #fff; padding: calc(var(--u) * 4) calc(var(--u) * 10); }
  .panel button:hover { background: #222; }
  .panel button:active { transform: translateY(calc(var(--u) * 1)); }
  .panel button:disabled { opacity: .4; cursor: wait; }

  /* debug mode box: see-through, clicks go right through it */
  #debug { position: absolute; left: calc(var(--u) * 4); top: calc(var(--u) * 4); z-index: 5; pointer-events: none;
    max-width: 46%; max-height: calc(100% - var(--u) * 8); overflow: hidden; padding: calc(var(--u) * 4) calc(var(--u) * 6);
    background: rgba(0,0,0,.6); color: #ccc; border: 1px solid #f7931e; border-radius: calc(var(--u) * 3);
    font: calc(var(--u) * 7) / 1.35 "Share Tech Mono", monospace; }
  #debug .head { color: #f7931e; letter-spacing: .15em; }
  #debug b { color: #fff; font-weight: normal; }
  #debug .vars { margin-top: calc(var(--u) * 3); }
  #debug .vars div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #debug .chg, #debug .chg b { color: #ffe14d; }
  #debug .keys { margin-top: calc(var(--u) * 3); color: #888; }
  /* settings */
  #settingsPanel h2 { font-size: calc(var(--u) * 22); font-weight: normal; margin-bottom: calc(var(--u) * 16); }
  #settingsPanel .row { display: flex; align-items: center; gap: calc(var(--u) * 12); margin: calc(var(--u) * 9) 0 calc(var(--u) * 9) calc(var(--u) * 40); }
  #settingsPanel .label { width: calc(var(--u) * 110); font-size: calc(var(--u) * 15); }
  #settingsPanel .pair { display: flex; gap: calc(var(--u) * 8); }
  /* jumpscare buttons: orange when picked, gray when not (like the old pictures) */
  #settingsPanel .pick { min-width: calc(var(--u) * 70); font-family: "Sans Serif", sans-serif; font-size: calc(var(--u) * 16);
    background: #666; border-color: #666; padding: calc(var(--u) * 3) calc(var(--u) * 10); }
  #settingsPanel .pick:hover { border-color: #fff; background: #777; }
  #settingsPanel .pick.on { background: #f7931e; border-color: #f7931e; }
  #settingsPanel .pick.on:hover { border-color: #fff; }
  #settingsPanel input[type=range] { width: calc(var(--u) * 170); accent-color: #f7931e; }
  #settingsPanel .val { width: calc(var(--u) * 40); color: #aaa; }
  #settingsPanel .big { font-size: calc(var(--u) * 15); padding: calc(var(--u) * 4) calc(var(--u) * 22); }
  #settingsPanel .confirm { margin: auto auto 0; font-family: "Sans Serif", sans-serif; font-size: calc(var(--u) * 18);
    background: #666; border-color: #666; padding: calc(var(--u) * 4) calc(var(--u) * 26); }
  #settingsPanel .confirm:hover { border-color: #fff; }

  /* mods */
  #modsPanel { gap: calc(var(--u) * 7); }
  .modsTop { display: flex; align-items: center; gap: calc(var(--u) * 10); }
  .modsTop h2 { font-size: calc(var(--u) * 20); font-weight: normal; }
  .tabs { display: flex; gap: calc(var(--u) * 6); margin-left: auto; }
  .tabs button.on { background: #fff; color: #000; }
  .pane { border: calc(var(--u) * 2) solid #444; padding: calc(var(--u) * 6) calc(var(--u) * 8); display: flex; flex-wrap: wrap; gap: calc(var(--u) * 6); align-items: center; }
  .pane[hidden] { display: none; }
  .pane .hint { color: #999; font-size: calc(var(--u) * 11); width: 100%; }
  #ghInput { flex: 1; min-width: 0; background: #111; border: calc(var(--u) * 2) solid #fff; padding: calc(var(--u) * 4) calc(var(--u) * 6); }
  #modStatus { min-height: calc(var(--u) * 15); font-size: calc(var(--u) * 11); color: #9f9; }
  #modStatus.bad { color: #ff6b6b; }
  .lists { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 10); min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col h3 { font-weight: normal; font-size: calc(var(--u) * 13); margin-bottom: calc(var(--u) * 4); }
  .col h3 small { color: #999; font-size: calc(var(--u) * 10); }
  .list { flex: 1; overflow-y: auto; border: calc(var(--u) * 2) solid #fff; padding: calc(var(--u) * 5); }
  #modsInUse { border-color: #f7931e; }
  .mod { position: relative; border: calc(var(--u) * 2) solid #666; padding: calc(var(--u) * 4) calc(var(--u) * 22) calc(var(--u) * 4) calc(var(--u) * 6);
    margin-bottom: calc(var(--u) * 5); background: #111; cursor: grab; touch-action: none; user-select: none; }
  .mod:hover { border-color: #fff; }
  .modName { font-size: calc(var(--u) * 13); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .modInfo { font-size: calc(var(--u) * 10); color: #999; }
  .mod .del { position: absolute; right: calc(var(--u) * 3); top: calc(var(--u) * 3); border: none; padding: 0 calc(var(--u) * 4); font-size: calc(var(--u) * 14); color: #999; background: none; }
  .mod .del:hover { color: #ff6b6b; background: none; }
  .mod.dragging { opacity: .3; }
  .mod.ghost { position: fixed; z-index: 99; pointer-events: none; opacity: .9; border-color: #fff; font-family: "Share Tech Mono", monospace; color: #fff; }
  .dropMark { height: calc(var(--u) * 3); background: #f7931e; margin-bottom: calc(var(--u) * 5); }
  .empty { color: #666; font-size: calc(var(--u) * 11); text-align: center; padding: calc(var(--u) * 14) 0; }
  #reloadNote { position: absolute; inset: 0; z-index: 7; background: #000; display: flex; align-items: center; justify-content: center; }
  #reloadNote[hidden] { display: none; }
</style>
</head>
<body>

<div id="frame">
  <canvas id="stage" tabindex="0"></canvas>

  <!-- Loading screen: spinning rice bowl + loading bar -->
  <div id="cover">
    <img id="spinner" src="assets/loading-rice.webp" alt="">
    <div id="barOuter"><div id="barInner"></div></div>
  </div>


  <!-- Debug mode box (turn it on in Settings) -->
  <div id="debug" hidden></div>

  <!-- Settings screen (opens when the Settings button is clicked) -->
  <div id="settingsPanel" class="panel" hidden></div>

  <!-- Mods screen -->
  <div id="modsPanel" class="panel" hidden>
    <div class="modsTop">
      <button id="modsBack">&lt; BACK</button>
      <h2>MODS</h2>
      <div class="tabs">
        <button id="tabUnpacked">LOAD UNPACKED</button>
        <button id="tabPacked">LOAD PACKED</button>
      </div>
    </div>
    <div class="pane" id="paneUnpacked">
      <button id="pickFolder">PICK MOD FOLDER</button>
      <button id="pickZip">PICK .ZIP</button>
      <button id="tplBtn" style="margin-left:auto">DOWNLOAD TEMPLATE</button>
      <div class="hint">Pick a mod folder from your computer. New to modding? Download the template, change some files, then pick that folder.</div>
      <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
      <input type="file" id="zipInput" accept=".zip" hidden>
    </div>
    <div class="pane" id="panePacked" hidden>
      <input id="ghInput" placeholder="github.com/user/repo" autocomplete="off" spellcheck="false">
      <button id="ghLoad">LOAD</button>
      <div class="hint">Loads a mod straight from a public GitHub repo (it needs a manifest.json).</div>
    </div>
    <div id="modStatus"></div>
    <div class="lists">
      <div class="col"><h3>DOWNLOADED <small>(not in use)</small></h3><div class="list" id="modsDownloaded"></div></div>
      <div class="col"><h3>IN USE <small>(top one wins)</small></h3><div class="list" id="modsInUse"></div></div>
    </div>
  </div>
  <div id="reloadNote" hidden></div>

  <!-- Question box (left arrow anywhere: how rare Golden Eddie is) -->
  <form id="ask" hidden>
    <div id="askText"></div>
    <div><input id="askInput" autocomplete="off" inputmode="numeric"><button type="submit">OK</button></div>
  </form>

</div>

   ===================================================================== */
/* =====================================================================
   PICTURES
   Loads every picture and draws it on the game screen.

   The game screen is 480 x 360 "game pixels" (it is scaled up to fit
   the window). (0, 0) is the TOP-LEFT corner, x goes right, y goes down.

   Every picture lives in ART (made by tools/build_game1.py), looked up
   by group and name, for example pic("office", "normal").
   A picture has:
     w, h     its size in game pixels at 100%
     cx, cy   its "pin": the point that goes on the spot you draw it at
     layers   what it is made of, back to front:
                {img, x, y, w, h}            an image file
                {img, m, iw, ih, tint?, ...} a character image placed with a matrix
                {rect, fill, stroke, lw, hole?}  a box
                {text, font, color, ...}     real text (mods can change it)
   ===================================================================== */
"use strict";

const VIEW_W = 480, VIEW_H = 360;

/* ---------------------------------------------------------------------
   Loading files
   --------------------------------------------------------------------- */
const Files = {
  images: new Map(),   // url -> <img>
  tints: new Map(),    // "url|color" -> canvas filled with one color (silhouettes, shading)

  image(url) { return this.images.get(url); },

  // The same image, but every visible pixel painted one flat color
  tinted(url, color) {
    const key = url + "|" + color;
    if (!this.tints.has(key)) {
      const img = this.image(url);
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.ceil(img.naturalWidth * 2));
      c.height = Math.max(1, Math.ceil(img.naturalHeight * 2));
      const g = c.getContext("2d");
      g.drawImage(img, 0, 0, c.width, c.height);
      g.globalCompositeOperation = "source-in";
      g.fillStyle = color;
      g.fillRect(0, 0, c.width, c.height);
      this.tints.set(key, c);
    }
    return this.tints.get(key);
  },

  // Loads every picture and sound, reporting progress from 0 to 1
  async loadAll(imageUrls, soundUrls, onProgress) {
    const total = imageUrls.length + soundUrls.length;
    let done = 0;
    const tick = () => onProgress(++done / total);
    const loadImage = url => new Promise(res => {
      const img = new Image();
      img.onload = () => { this.images.set(url, img); tick(); res(); };
      img.onerror = () => { console.warn("Missing image", url); this.images.set(url, img); tick(); res(); };
      img.src = url;
    });
    const loadSound = async url => {
      try { await Sound.load(url); } catch (e) { console.warn("Missing sound", url, e); }
      tick();
    };
    // a few files at a time so the browser stays responsive
    const queue = [...imageUrls.map(u => () => loadImage(u)), ...soundUrls.map(u => () => loadSound(u))];
    const workers = Array.from({ length: 8 }, async () => { while (queue.length) await queue.shift()(); });
    await Promise.all(workers);
  }
};

// Every image file any picture uses (for the loading bar)
function allImageUrls() {
  const urls = new Set();
  for (const group of Object.values(ART))
    for (const p of Object.values(group.pics))
      for (const L of p.layers) if (L.img) urls.add(L.img);
  return [...urls];
}

/* ---------------------------------------------------------------------
   Finding pictures
   --------------------------------------------------------------------- */
function pic(group, name) {
  const g = ART[group];
  const p = g && g.pics[name];
  if (!p) console.warn("No picture", group, name);
  return p;
}
// The n-th picture of a group (1 = first), for random picks and number names
function picAt(group, n) {
  const list = ART[group].list;
  const i = ((Math.round(n) - 1) % list.length + list.length) % list.length;
  return ART[group].pics[list[i]];
}

/* ---------------------------------------------------------------------
   Words
   Mods can change any word with texts.json (old text -> new text).
   --------------------------------------------------------------------- */
let TEXTS = {};
const inkCache = new Map();

// The size of the actual letters (not the line box) at 100px
function measureInk(ctx, text, font) {
  const key = font + "|" + text;
  if (!inkCache.has(key)) {
    ctx.font = `100px "${font}"`;
    const m = ctx.measureText(text);
    inkCache.set(key, {
      left: -m.actualBoundingBoxLeft, top: -m.actualBoundingBoxAscent,
      w: m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
      h: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent
    });
  }
  return inkCache.get(key);
}

function drawText(ctx, L) {
  const shown = TEXTS[L.text] !== undefined ? String(TEXTS[L.text]) : L.text;
  ctx.save();
  ctx.fillStyle = L.color;
  ctx.textBaseline = "alphabetic";
  if (L.tm) {
    // text exactly as it sat in the original drawing (can be turned and stretched)
    ctx.transform(...L.tm);
    ctx.font = `${L.size}px "${L.font}"`;
    ctx.fillText(shown, L.pos[0], L.pos[1]);
  } else if (L.at) {
    // [left x, baseline y, font size]
    ctx.font = `${L.at[2]}px "${L.font}"`;
    ctx.fillText(shown, L.at[0], L.at[1]);
  } else {
    const [x, y, w, h] = L.box;
    const orig = measureInk(ctx, L.text, L.font);
    if (orig.w > 0 && orig.h > 0) {
      ctx.font = `100px "${L.font}"`;
      if (shown === L.text && !L.like) {
        // stretch the letters so they fill the box exactly where the old picture had them
        ctx.translate(x, y);
        ctx.scale(w / orig.w, h / orig.h);
        ctx.fillText(L.text, -orig.left, -orig.top);
      } else {
        // changed text (or text sized like another word): keep the letter size, let the width change
        let k = h / orig.h;
        if (L.like) k = L.like[1] / measureInk(ctx, L.like[0], L.font).h;
        const ink = measureInk(ctx, shown, L.font);
        const baseline = L.like ? y + h : y - orig.top * k;
        let left = x;
        if (L.align === "center") left = x + w / 2 - ink.w * k / 2;
        if (L.align === "right") left = x + w - ink.w * k;
        ctx.translate(left - ink.left * k, baseline);
        ctx.scale(k, k);
        ctx.fillText(shown, 0, 0);
      }
    }
  }
  ctx.restore();
}

/* ---------------------------------------------------------------------
   Drawing one picture's layers (in picture units, top-left = 0,0)
   --------------------------------------------------------------------- */
function drawLayers(ctx, p) {
  ctx.save();
  if (p.clip) { ctx.beginPath(); ctx.rect(0, 0, p.w, p.h); ctx.clip(); }     // nothing pokes out of the picture
  for (const L of p.layers) {
    if (L.img) {
      const img = L.tint ? Files.tinted(L.img, L.tint) : Files.image(L.img);
      if (!img || img.complete === false) continue;
      ctx.save();
      if (L.cut) { ctx.beginPath(); ctx.rect(...L.cut); ctx.clip(); }     // only part of the image
      if (L.outline) {                                                     // only inside these shapes
        if (!L._clip) {
          L._clip = new Path2D();
          for (const [d, m] of L.outline) L._clip.addPath(new Path2D(d), new DOMMatrix(m));
        }
        ctx.clip(L._clip);
      }
      if (L.m) { ctx.transform(...L.m); ctx.drawImage(img, 0, 0, L.iw, L.ih); }
      else ctx.drawImage(img, L.x, L.y, L.w, L.h);
      if (L.shade) {                                                       // darker (characters in dark rooms)
        ctx.globalAlpha *= L.shade;
        const dark = Files.tinted(L.img, "#000");
        if (L.m) ctx.drawImage(dark, 0, 0, L.iw, L.ih); else ctx.drawImage(dark, L.x, L.y, L.w, L.h);
      }
      ctx.restore();
    } else if (L.rect) {
      const [x, y, w, h] = L.rect;
      if (L.fill && L.hole) {
        // a filled box with a see-through window
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.rect(...L.hole);
        ctx.fillStyle = L.fill;
        ctx.fill("evenodd");
      } else if (L.fill) { ctx.fillStyle = L.fill; ctx.fillRect(x, y, w, h); }
      if (L.stroke) {
        ctx.strokeStyle = L.stroke; ctx.lineWidth = L.lw;
        ctx.strokeRect(x + L.lw / 2, y + L.lw / 2, w - L.lw, h - L.lw);
      }
    } else if (L.text !== undefined) {
      drawText(ctx, L);
    }
  }
  ctx.restore();
}

/* ---------------------------------------------------------------------
   draw(ctx, picture, x, y, options)
   Puts the picture's pin on screen spot (x, y).
   options: size (percent, 100 = normal), alpha (0-1),
            bright (-100 darker .. 100 lighter), turn (degrees)
   --------------------------------------------------------------------- */
function draw(ctx, p, x, y, o = {}) {
  if (!p) return;
  const alpha = o.alpha === undefined ? 1 : o.alpha;
  if (alpha <= 0) return;
  const k = (o.size || 100) / 100;
  ctx.save();
  ctx.translate(x, y);
  if (o.turn) ctx.rotate(o.turn * Math.PI / 180);
  ctx.scale(k, k);
  if (p.spin) {
    // a flat picture spinning in 3D (the rice bowl): squeeze it sideways over time
    ctx.scale(Math.cos(performance.now() / 2400 * Math.PI * 2), 1);
  }
  ctx.translate(-p.cx, -p.cy);
  ctx.globalAlpha *= alpha;
  if (o.bright) ctx.filter = `brightness(${Math.max(0, 1 + o.bright / 100)})`;
  drawLayers(ctx, p);
  ctx.restore();
}

/* ---------------------------------------------------------------------
   Hit testing: is a screen point on a visible pixel of a picture?
   Each picture gets a small see-through map the first time it is asked.
   --------------------------------------------------------------------- */
function pictureMask(p) {
  if (p._mask !== undefined) return p._mask;
  const w = Math.max(1, Math.ceil(p.w)), h = Math.max(1, Math.ceil(p.h));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  drawLayers(g, p);
  let data = null;
  try { data = g.getImageData(0, 0, w, h).data; } catch (e) { /* opened from a file: treat as solid */ }
  const alpha = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) alpha[i] = data ? data[i * 4 + 3] : 255;
  p._mask = { w, h, alpha };
  return p._mask;
}

// Was screen point (px, py) on the picture drawn at (x, y) with this size?
function hits(p, x, y, size, px, py) {
  if (!p) return false;
  const k = (size || 100) / 100;
  const u = Math.floor((px - x) / k + p.cx), v = Math.floor((py - y) / k + p.cy);
  const m = pictureMask(p);
  if (u < 0 || v < 0 || u >= m.w || v >= m.h) return false;
  return m.alpha[v * m.w + u] > 0;
}

// Was screen point (px, py) inside the picture's rectangle (good for words)?
function inBox(p, x, y, size, px, py, pad = 0) {
  if (!p) return false;
  const k = (size || 100) / 100;
  const u = (px - x) / k + p.cx, v = (py - y) / k + p.cy;
  return u >= -pad && v >= -pad && u <= p.w + pad && v <= p.h + pad;
}

/* ---------------------------------------------------------------------
   Smooth movement
   The game updates 30 times a second, but screens refresh 60+ times.
   Values that move (panning, fading, shaking) are remembered from the
   last update, and the screen draws them part of the way between the
   old and new value, so motion looks smooth instead of steppy.
   --------------------------------------------------------------------- */
class Smooth {
  constructor() { this.now = {}; this.before = {}; }
  set(key, v) { this.now[key] = v; if (!(key in this.before)) this.before[key] = v; }
  jump(key, v) { this.now[key] = v; this.before[key] = v; }      // move instantly (no blending)
  get(key) { return this.now[key]; }
  snapshot() { Object.assign(this.before, this.now); }          // called at the start of every update
  // the value to draw: `a` is how far we are between the last update (0) and the next (1)
  at(key, a, maxJump = Infinity) {
    const v = this.now[key], b = this.before[key];
    if (b === undefined || Math.abs(v - b) > maxJump) return v;
    return b + (v - b) * a;
  }
}


/* =====================================================================
   SOUND
   Every sound lives in SOUNDS (made by the build), looked up by group
   and name, for example Sound.play("office", "Buzz_Fan_Florescent2").

   Sounds go through a "speaker". A speaker has its own volume
   (0-100), like a radio you can turn up and down while it plays.
   Speakers feed two volume knobs from the Settings screen:
     music  (songs and jingles)
     sound  (everything else)
   ===================================================================== */
"use strict";

const Sound = {
  ctx: new (window.AudioContext || window.webkitAudioContext)(),
  buffers: new Map(),       // url -> decoded sound
  speakers: [],

  async load(url) {
    const data = await (await fetch(url)).arrayBuffer();
    this.buffers.set(url, await this.ctx.decodeAudioData(data));
  },

  // A speaker for one thing in the game (the phone, the fan, the kitchen...)
  speaker(volume = 100) {
    const s = new Speaker(volume);
    this.speakers.push(s);
    return s;
  },

  // Silence everything (the game's "stop all sounds")
  stopAll() { for (const s of this.speakers) s.stopAll(); }
};

// The two volume knobs (the Settings sliders change these)
Sound.master = Sound.ctx.createGain();
Sound.master.connect(Sound.ctx.destination);
Sound.musicBus = Sound.ctx.createGain();
Sound.sfxBus = Sound.ctx.createGain();
Sound.musicBus.connect(Sound.master);
Sound.sfxBus.connect(Sound.master);

class Speaker {
  constructor(volume) {
    // one volume node for music and one for sounds, so each still follows its own knob
    this.music = Sound.ctx.createGain();
    this.sfx = Sound.ctx.createGain();
    this.music.connect(Sound.musicBus);
    this.sfx.connect(Sound.sfxBus);
    this.playing = new Map();     // sound name -> what is playing
    this.setVolume(volume);
  }

  setVolume(v) {
    this.volume = Math.max(0, Math.min(100, v));
    this.music.gain.value = this.sfx.gain.value = this.volume / 100;
  }

  /* Play a sound. Starting a sound that is already playing on this
     speaker starts it over. Options: loop (repeat forever).
     Returns a handle: handle.done turns true when it finishes. */
  play(group, name, o = {}) {
    const info = SOUNDS[group] && SOUNDS[group][name];
    const buffer = info && Sound.buffers.get(info.src);
    const handle = { done: true, stop() {} };
    if (!buffer) { if (!info) console.warn("No sound", group, name); return handle; }
    this.stop(name);
    const src = Sound.ctx.createBufferSource();
    src.buffer = buffer;
    src.loop = !!o.loop;
    src.connect(info.music ? this.music : this.sfx);
    handle.done = false;
    handle.stop = () => { try { src.stop(); } catch (e) {} handle.done = true; };
    src.onended = () => { handle.done = true; if (this.playing.get(name) === handle) this.playing.delete(name); };
    src.start();
    this.playing.set(name, handle);
    return handle;
  }

  isPlaying(name) { const h = this.playing.get(name); return !!h && !h.done; }
  stop(name) { const h = this.playing.get(name); if (h) { h.stop(); this.playing.delete(name); } }
  stopAll() { for (const h of this.playing.values()) h.stop(); this.playing.clear(); }
}

// Play a sound on a speaker only if it is not already playing (for sounds that loop back to back)
function keepPlaying(speaker, group, name) {
  if (!speaker.isPlaying(name)) speaker.play(group, name);
}


/* =====================================================================
   FRIED RICE AT EDDIE'S (game 1)
   The whole game, written as a normal browser game:
     - update() runs 30 times a second and moves the game forward
     - render() draws the current screen (as often as the screen allows)
     - "screens" (title, night, game over...) decide what is shown

   Short cutscenes (the 6 AM chime, the newspaper ad, the power going
   out) are written as small step-by-step scripts with `yield seconds`
   pauses. See the Scripts class below.

   Screen spots are in game pixels: (0, 0) is the top-left corner of
   the 480 x 360 game screen.
   ===================================================================== */
"use strict";

const TICK = 1 / 30;                  // seconds per update
const TICK_MS = 1000 / 30;

/* ---------------------------------------------------------------------
   Small helpers
   --------------------------------------------------------------------- */
const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));    // whole number lo..hi
const randFloat = (lo, hi) => lo + Math.random() * (hi - lo);
const chance = n => rand(1, n) === 1;                                      // "1 in n"
const pick = list => list[Math.floor(Math.random() * list.length)];

/* ---------------------------------------------------------------------
   Scripts: tiny step-by-step sequences
     scripts.run(function* () { ...; yield 2; ...; yield () => done; })
       yield 2          wait 2 seconds
       yield            wait one update
       yield () => x    wait until x is true
   Every script belongs to a "tag" so whole groups can be stopped at once
   (for example everything about the night stops when you die).
   --------------------------------------------------------------------- */
class Scripts {
  constructor() { this.list = []; }
  run(tag, gen) {
    const s = { tag, gen, wait: 0, until: null };
    this.list.push(s);
    return s;
  }
  stop(...tags) { this.list = this.list.filter(s => !tags.includes(s.tag)); }
  stopAll() { this.list = []; }
  has(tag) { return this.list.some(s => s.tag === tag); }
  update() {
    for (const s of [...this.list]) {
      if (!this.list.includes(s)) continue;              // stopped by another script this update
      if (s.wait > 0) { s.wait -= TICK; if (s.wait > 1e-9) continue; }
      if (s.until && !s.until()) continue;
      s.until = null;
      const r = s.gen.next();
      if (!this.list.includes(s)) continue;               // it stopped itself (changed screen)
      if (r.done) { this.list.splice(this.list.indexOf(s), 1); continue; }
      if (typeof r.value === "number") s.wait = r.value;
      else if (typeof r.value === "function") s.until = r.value;
    }
  }
}
