<head>

<title>Fried Rice at Eddie's 2</title>

<link rel="icon" type="image/png" href="favicon.png">
<style>
  /* ===== Fonts used by the game's text (Scratch's own fonts + pixel fonts) ===== */
  @font-face { font-family: "Sans Serif"; src: url("assets/fonts/NotoSans-Medium.ttf"); }
  @font-face { font-family: "Pixel"; src: url("assets/fonts/Grand9K-Pixel.ttf"); }
  @font-face { font-family: "Press Start 2P"; src: url("assets/fonts/PressStart2P.woff2"); }
  @font-face { font-family: "Share Tech Mono"; src: url("assets/fonts/ShareTechMono.woff2"); }
  @font-face { font-family: "Courier Prime"; src: url("assets/fonts/CourierPrime.woff2"); }
  @font-face { font-family: "Serif"; src: url("assets/fonts/SourceSerifPro-Regular.otf"); }

  /* ===== Page theme: black VHS look to match the game menu ===== */
  :root {
    --bg: #000;
    --line: #fff;
    --dim: #8a8a99;
    --accent: #5b16ec;
    --soul: #ff2a3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: #fff; overflow: hidden; }
  body {
    font-family: "Press Start 2P", monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }

  /* The game screen keeps its 4:3 shape and grows to fit the window */
  #frame {
    position: relative;
    border: 4px solid var(--line);
    box-shadow: 0 0 0 4px #000, 8px 8px 0 4px #1d1d2b;
    background: #000;
  }
  #stage { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }

  /* ===== Loading screen: the spinning rice bowl, with a bar under it ===== */
  #cover {
    position: absolute; inset: 0; z-index: 5;
    background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6%;
    transition: opacity .4s;
  }
  #cover.done { opacity: 0; pointer-events: none; }
  #spinner {
    width: 38%;
    animation: spin 2.4s linear infinite;    /* one full turn every 2.4 seconds */
  }
  @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
  #barOuter { width: 46%; height: 16px; border: 3px solid #fff; padding: 2px; }
  #barInner { height: 100%; width: 0; background: #fff; transition: width .15s; }


  /* ===== Question box (left arrow: Golden Eddie's rate) ===== */
  #ask {
    position: absolute; left: 4%; right: 4%; bottom: 4%; z-index: 7;
    background: #000; border: 3px solid #fff; padding: 10px; display: flex; flex-direction: column; gap: 8px;
    font-family: "Share Tech Mono", monospace;
  }
  #ask[hidden] { display: none; }
  #askText { font-size: calc(var(--u) * 12); }
  #ask div { display: flex; gap: 8px; }
  #askInput { flex: 1; font: inherit; font-size: calc(var(--u) * 12); padding: 6px; background: #111; color: #fff; border: 2px solid #fff; }
  #ask button { font: inherit; font-size: calc(var(--u) * 11); background: #f7931e; color: #fff; border: 2px solid #fff; padding: 0 10px; cursor: pointer; }

  /* ===== Settings + Mods panels (sizes use --u = 1 game pixel) ===== */
  .panel {
    position: absolute; inset: 0; z-index: 6; background: #000; color: #fff;
    font-family: "Share Tech Mono", monospace; font-size: calc(var(--u) * 13);
    display: flex; flex-direction: column; padding: calc(var(--u) * 14) calc(var(--u) * 18);
    animation: fadeIn .35s;
  }
  .panel[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0; } }
  .panel button, .panel input { font: inherit; color: #fff; }
  .panel button { cursor: pointer; background: #000; border: calc(var(--u) * 2) solid #fff; padding: calc(var(--u) * 4) calc(var(--u) * 10); }
  .panel button:hover { background: #222; }
  .panel button:active { transform: translateY(calc(var(--u) * 1)); }
  .panel button:disabled { opacity: .4; cursor: wait; }

  /* debug mode box: see-through, clicks go right through it */
  #debug { position: absolute; left: calc(var(--u) * 4); top: calc(var(--u) * 4); z-index: 5; pointer-events: none;
    max-width: 46%; max-height: calc(100% - var(--u) * 8); overflow: hidden; padding: calc(var(--u) * 4) calc(var(--u) * 6);
    background: rgba(0,0,0,.6); color: #ccc; border: 1px solid #f7931e; border-radius: calc(var(--u) * 3);
    font: calc(var(--u) * 7) / 1.35 "Share Tech Mono", monospace; }
  #debug .head { color: #f7931e; letter-spacing: .15em; }
  #debug b { color: #fff; font-weight: normal; }
  #debug .vars { margin-top: calc(var(--u) * 3); }
  #debug .vars div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #debug .chg, #debug .chg b { color: #ffe14d; }
  #debug .warn { margin-top: calc(var(--u) * 2); color: #ff6b6b; }
  #debug .keys { margin-top: calc(var(--u) * 3); color: #888; }
  /* settings */
  #settingsPanel h2 { font-size: calc(var(--u) * 22); font-weight: normal; margin-bottom: calc(var(--u) * 16); }
  #settingsPanel .row { display: flex; align-items: center; gap: calc(var(--u) * 12); margin: calc(var(--u) * 9) 0 calc(var(--u) * 9) calc(var(--u) * 40); }
  #settingsPanel .label { width: calc(var(--u) * 110); font-size: calc(var(--u) * 15); }
  #settingsPanel .pair { display: flex; gap: calc(var(--u) * 8); }
  /* jumpscare buttons: orange when picked, gray when not (like the old pictures) */
  #settingsPanel .pick { min-width: calc(var(--u) * 70); font-family: "Sans Serif", sans-serif; font-size: calc(var(--u) * 16);
    background: #666; border-color: #666; padding: calc(var(--u) * 3) calc(var(--u) * 10); }
  #settingsPanel .pick:hover { border-color: #fff; background: #777; }
  #settingsPanel .pick.on { background: #f7931e; border-color: #f7931e; }
  #settingsPanel .pick.on:hover { border-color: #fff; }
  #settingsPanel input[type=range] { width: calc(var(--u) * 170); accent-color: #f7931e; }
  #settingsPanel .val { width: calc(var(--u) * 40); color: #aaa; }
  #settingsPanel .big { font-size: calc(var(--u) * 15); padding: calc(var(--u) * 4) calc(var(--u) * 22); }
  #settingsPanel .confirm { margin: auto auto 0; font-family: "Sans Serif", sans-serif; font-size: calc(var(--u) * 18);
    background: #666; border-color: #666; padding: calc(var(--u) * 4) calc(var(--u) * 26); }
  #settingsPanel .confirm:hover { border-color: #fff; }

  #settingsPanel .note { color: #888; font-size: calc(var(--u) * 9); }
  #settingsPanel .fileNow { color: #aaa; min-width: calc(var(--u) * 150); }
  #settingsPanel .small { font-size: calc(var(--u) * 12); padding: calc(var(--u) * 2) calc(var(--u) * 10); }

  /* save file screen */
  #filesPanel { align-items: center; justify-content: center; gap: calc(var(--u) * 14); }

  #filesPanel .slot.empty .fileInfo { color: #666; }
  #filesPanel .fileInfo { color: #f7931e; }
  #filesPanel .erase { font-size: calc(var(--u) * 10); color: #888; border-color: #444; }
  #filesPanel .erase:hover { color: #ff6b6b; border-color: #ff6b6b; background: #000; }
  #filesPanel .hint { color: #777; font-size: calc(var(--u) * 11); }

  /* ===== Achievements (Steam style) ===== */
  #toasts { position: absolute; right: calc(var(--u) * 6); bottom: calc(var(--u) * 6); z-index: 8; pointer-events: none;
    display: flex; flex-direction: column; gap: calc(var(--u) * 4); overflow: hidden; }
  .toast { display: flex; align-items: center; gap: calc(var(--u) * 7); width: calc(var(--u) * 150); padding: calc(var(--u) * 6);

    font-family: "Sans Serif", sans-serif; transform: translateY(130%); opacity: 0; transition: transform .45s ease, opacity .45s ease; }
  .toast.in { transform: none; opacity: 1; }
  .toastTitle { color: #fff; font-size: calc(var(--u) * 7.5); }
  .toastName { color: #8f98a0; font-size: calc(var(--u) * 7); margin-top: calc(var(--u) * 1.5); }
  .achIcon { flex: none; width: calc(var(--u) * 28); height: calc(var(--u) * 28); display: grid; place-items: center;

    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
  .achIcon.locked { filter: grayscale(1) brightness(.45); }
  #achPanel { background: #1b2838; font-family: "Sans Serif", sans-serif; gap: calc(var(--u) * 6); }
  .achTop { display: flex; align-items: center; gap: calc(var(--u) * 10); }
  .achTop h2 { font-weight: normal; font-size: calc(var(--u) * 16); }
  .achTop button { font-family: "Share Tech Mono", monospace; font-size: calc(var(--u) * 10); background: transparent; border-color: #3d5a7a; }
  .achCount { margin-left: auto; color: #8f98a0; font-size: calc(var(--u) * 9); }
  .achBar { height: calc(var(--u) * 4); background: #0e1621; }
  .achFill { height: 100%; background: linear-gradient(to right, #5c7e10, #a4d007); }
  .achList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: calc(var(--u) * 3); padding-right: calc(var(--u) * 3); }
  .achRow { display: flex; align-items: center; gap: calc(var(--u) * 8); padding: calc(var(--u) * 5); background: #233246; }
  .achRow.locked { background: #18222f; }
  .achText { flex: 1; min-width: 0; }
  .achName { font-size: calc(var(--u) * 9); color: #fff; }
  .achRow.locked .achName { color: #8f98a0; }
  .achDesc { font-size: calc(var(--u) * 7.5); color: #8f98a0; margin-top: calc(var(--u) * 1); }
  .achDate { font-size: calc(var(--u) * 7); color: #8f98a0; white-space: nowrap; }

  /* mods */
  #modsPanel { gap: calc(var(--u) * 7); }
  .modsTop { display: flex; align-items: center; gap: calc(var(--u) * 10); }
  .modsTop h2 { font-size: calc(var(--u) * 20); font-weight: normal; }
  .tabs { display: flex; gap: calc(var(--u) * 6); margin-left: auto; }
  .tabs button.on { background: #fff; color: #000; }
  .pane { border: calc(var(--u) * 2) solid #444; padding: calc(var(--u) * 6) calc(var(--u) * 8); display: flex; flex-wrap: wrap; gap: calc(var(--u) * 6); align-items: center; }
  .pane[hidden] { display: none; }
  .pane .hint { color: #999; font-size: calc(var(--u) * 11); width: 100%; }
  #ghInput { flex: 1; min-width: 0; background: #111; border: calc(var(--u) * 2) solid #fff; padding: calc(var(--u) * 4) calc(var(--u) * 6); }

  .lists { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 10); min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col h3 { font-weight: normal; font-size: calc(var(--u) * 13); margin-bottom: calc(var(--u) * 4); }
  .col h3 small { color: #999; font-size: calc(var(--u) * 10); }

  #modsInUse { border-color: #f7931e; }
  .mod { position: relative; border: calc(var(--u) * 2) solid #666; padding: calc(var(--u) * 4) calc(var(--u) * 22) calc(var(--u) * 4) calc(var(--u) * 6);
    margin-bottom: calc(var(--u) * 5); background: #111; cursor: grab; touch-action: none; user-select: none; }
  .mod:hover { border-color: #fff; }
  .modName { font-size: calc(var(--u) * 13); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .modInfo { font-size: calc(var(--u) * 10); color: #999; }
  .mod .del { position: absolute; right: calc(var(--u) * 3); top: calc(var(--u) * 3); border: none; padding: 0 calc(var(--u) * 4); font-size: calc(var(--u) * 14); color: #999; background: none; }
  .mod .del:hover { color: #ff6b6b; background: none; }
  .mod.dragging { opacity: .3; }

  .dropMark { height: calc(var(--u) * 3); background: #f7931e; margin-bottom: calc(var(--u) * 5); }
  .empty { color: #666; font-size: calc(var(--u) * 11); text-align: center; padding: calc(var(--u) * 14) 0; }
  #reloadNote { position: absolute; inset: 0; z-index: 7; background: #000; display: flex; align-items: center; justify-content: center; }
  #reloadNote[hidden] { display: none; }
</style>

<body>

<div id="frame">
  <canvas id="stage" tabindex="0"></canvas>

  <!-- Loading screen: spinning rice bowl + loading bar -->
  <div id="cover">
    <img id="spinner" src="assets/loading-rice.webp" alt="">
    <div id="barOuter"><div id="barInner"></div></div>
  </div>


  <!-- Debug mode box (turn it on in Settings) -->
  <div id="debug" hidden></div>

  <!-- Achievement pop-ups (bottom right) and the achievements list -->
  <div id="toasts"></div>
  <div id="achPanel" class="panel" hidden></div>

  <!-- Save file screen (when the address has no ?file=1, 2 or 3) -->
  <div id="filesPanel" class="panel" hidden></div>

  <!-- Settings screen (opens when the Settings button is clicked) -->
  <div id="settingsPanel" class="panel" hidden></div>

  <!-- Mods screen -->
  <div id="modsPanel" class="panel" hidden>
    <div class="modsTop">
      <button id="modsBack">&lt; BACK</button>
      <h2>MODS</h2>
      <div class="tabs">
        <button id="tabUnpacked">LOAD UNPACKED</button>
        <button id="tabPacked">LOAD PACKED</button>
      </div>
    </div>
    <div class="pane" id="paneUnpacked">
      <button id="pickFolder">PICK MOD FOLDER</button>
      <button id="pickZip">PICK .ZIP</button>
      <button id="tplBtn" style="margin-left:auto">DOWNLOAD TEMPLATE</button>
      <div class="hint">Pick a mod folder from your computer. New to modding? Download the template, change some files, then pick that folder.</div>
      <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
      <input type="file" id="zipInput" accept=".zip" hidden>
    </div>
    <div class="pane" id="panePacked" hidden>
      <input id="ghInput" placeholder="github.com/user/repo" autocomplete="off" spellcheck="false">
      <button id="ghLoad">LOAD</button>
      <div class="hint">Loads a mod straight from a public GitHub repo (it needs a manifest.json).</div>
    </div>
    <div id="modStatus"></div>
    <div class="lists">
      <div class="col"><h3>DOWNLOADED <small>(not in use)</small></h3><div class="list" id="modsDownloaded"></div></div>
      <div class="col"><h3>IN USE <small>(top one wins)</small></h3><div class="list" id="modsInUse"></div></div>
    </div>
  </div>
  <div id="reloadNote" hidden></div>

  <!-- Question box (left arrow on the title: how rare Golden Eddie is) -->
  <form id="ask" hidden>
    <div id="askText"></div>
    <div><input id="askInput" autocomplete="off" inputmode="numeric"><button type="submit">OK</button></div>
  </form>

</div>

/* =====================================================================

   Loads every picture and draws it on the game screen.

   The game screen is 480 x 360 "game pixels" (it is scaled up to fit
   the window). (0, 0) is the TOP-LEFT corner, x goes right, y goes down.

   Every picture is a plain image file:
       assets/img/<group>/<name>.webp
   (names in lower case with dashes, see fileName). Each image is 2 image
   pixels per game pixel, and its middle is its "pin": the point that goes
   on the spot you draw it at. names.js lists which pictures exist.
   Some pictures also have real words drawn on top (words.js), so mods can
   change them in texts.json.
   ===================================================================== */
"use strict";

const VIEW_W = 480, VIEW_H = 360;
const IMG_SCALE = 2;                  // image pixels per game pixel
// groups saved at half size to save memory (long animations): 1 image pixel per game pixel (names.js)
const imgScale = group => (typeof HALF_SIZE_GROUPS !== "undefined" && HALF_SIZE_GROUPS.has(group) ? 1
  : typeof BIG_SIZE_GROUPS !== "undefined" && BIG_SIZE_GROUPS.has(group) ? 3 : IMG_SCALE);

// "Show Stage" -> "show-stage" (how names become file names)
function fileName(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "x";
}
const picturePath = (group, name) => `img/${fileName(group)}/${fileName(name)}.webp`;

// Files a mod replaces: asset path -> its own file (see applyMods in ui.js)
const MOD_FILES = {};
const assetUrl = path => MOD_FILES[path] || "assets/" + path;

/* ---------------------------------------------------------------------
   Loading files
   --------------------------------------------------------------------- */
const Files = {
  images: new Map(),   // asset path -> <img>
  sizes: new Map(),    // asset path -> the game's own [width, height] (only for pictures a mod replaced)

  image(path) { return this.images.get(path); },

  // The same picture with every visible pixel black (for darkening), made once
  blacks: new Map(),
  black(img) {
    if (!this.blacks.has(img)) {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth || img.width; c.height = img.naturalHeight || img.height;
      const g = c.getContext("2d");
      g.drawImage(img, 0, 0);
      g.globalCompositeOperation = "source-in";
      g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
      this.blacks.set(img, c);
    }
    return this.blacks.get(img);
  },

  // Loads every picture and sound, reporting progress from 0 to 1
  async loadAll(imagePaths, soundPaths, onProgress) {
    const total = imagePaths.length + soundPaths.length;
    let done = 0;
    const tick = () => onProgress(++done / total);
    const loadOne = url => new Promise(res => {
      const img = new Image();
      img.onload = () => (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(() => res(img));
      img.onerror = () => { console.warn("Missing image", url); res(null); };
      img.src = url;
    });
    const loadImage = async path => {
      const img = await loadOne(assetUrl(path));
      if (img) this.images.set(path, img);
      // a mod's picture may be any size: remember the game's own size so it fills the same spot
      if (MOD_FILES[path]) {
        const own = await loadOne("assets/" + path);
        if (own) this.sizes.set(path, [own.naturalWidth, own.naturalHeight]);
      }
      tick();
    };
    const loadSound = async path => {
      try { await Sound.load(path); } catch (e) { console.warn("Missing sound", path, e); }
      tick();
    };
    // a few files at a time so the browser stays responsive
    const queue = [...imagePaths.map(u => () => loadImage(u)), ...soundPaths.map(u => () => loadSound(u))];
    const workers = Array.from({ length: 8 }, async () => { while (queue.length) await queue.shift()(); });
    await Promise.all(workers);
  }
};

// Every picture file (for the loading bar and the mod template)
function allImagePaths() {
  const out = [];
  for (const [group, names] of Object.entries(PICTURE_NAMES)) for (const n of names) out.push(picturePath(group, n));
  return out;
}

/* ---------------------------------------------------------------------
   Finding pictures
   A picture: its image (img, iw x ih game pixels, pin in the middle) and
   its box (w, h, pin cx, cy) that hit tests and words use.
   --------------------------------------------------------------------- */
const pictureCache = new Map();
// (any spelling works for pictures a mod added: "Cool Stuff"/"Ball" finds img/cool-stuff/ball)
function hasPic(group, name) {
  return !!(PICTURE_NAMES[group] && PICTURE_NAMES[group].includes(name)) || Files.images.has(picturePath(group, name));
}
function pic(group, name) {
  const key = group + "/" + name;
  if (pictureCache.has(key)) return pictureCache.get(key);
  if (!hasPic(group, name)) { console.warn("No picture", group, name); return undefined; }
  const path = picturePath(group, name), img = Files.image(path);
  const [nw, nh] = Files.sizes.get(path) || (img ? [img.naturalWidth, img.naturalHeight] : [0, 0]);
  const k = imgScale(group);
  const iw = nw / k, ih = nh / k;
  const words = typeof PICTURE_WORDS !== "undefined" ? PICTURE_WORDS[key] : undefined;
  const [w, h, cx, cy] = words ? words.box : [iw, ih, iw / 2, ih / 2];
  const p = { img, iw, ih, w, h, cx, cy, words: words ? words.words : null,
              pixel: group === "Pixel",                         // 8-bit pictures stay blocky
              spin: group.toLowerCase() === "loading" };         // the spinning rice bowl
  pictureCache.set(key, p);
  return p;
}
// The n-th picture of a group (1 = first), for random picks and number names
function picAt(group, n) {
  const list = PICTURE_NAMES[group];
  const i = ((Math.round(n) - 1) % list.length + list.length) % list.length;
  return pic(group, list[i]);
}

/* ---------------------------------------------------------------------
   Words
   Mods can change any word with texts.json (old text -> new text).
   --------------------------------------------------------------------- */
let TEXTS = {};
const inkCache = new Map();

// The size of the actual letters (not the line box) at 100px
function measureInk(ctx, text, font) {
  const key = font + "|" + text;
  if (!inkCache.has(key)) {
    ctx.font = `100px "${font}"`;
    const m = ctx.measureText(text);
    inkCache.set(key, {
      left: -m.actualBoundingBoxLeft, top: -m.actualBoundingBoxAscent,
      w: m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
      h: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent
    });
  }
  return inkCache.get(key);
}

function drawText(ctx, L) {
  const shown = TEXTS[L.text] !== undefined ? String(TEXTS[L.text]) : L.text;
  ctx.save();
  ctx.fillStyle = L.color;
  ctx.textBaseline = "alphabetic";
  if (L.tm) {
    // text exactly as it sat in the original drawing (can be turned and stretched)
    ctx.transform(...L.tm);
    ctx.font = `${L.size}px "${L.font}"`;
    ctx.fillText(shown, L.pos[0], L.pos[1]);
  } else if (L.at) {
    // [left x, baseline y, font size]
    ctx.font = `${L.at[2]}px "${L.font}"`;
    ctx.fillText(shown, L.at[0], L.at[1]);
  } else {
    const [x, y, w, h] = L.box;
    const orig = measureInk(ctx, L.text, L.font);
    if (orig.w > 0 && orig.h > 0) {
      ctx.font = `100px "${L.font}"`;
      if (shown === L.text && !L.like) {
        // stretch the letters so they fill the box exactly where the old picture had them
        ctx.translate(x, y);
        ctx.scale(w / orig.w, h / orig.h);
        ctx.fillText(L.text, -orig.left, -orig.top);
      } else {
        // changed text (or text sized like another word): keep the letter size, let the width change
        let k = h / orig.h;
        if (L.like) k = L.like[1] / measureInk(ctx, L.like[0], L.font).h;
        const ink = measureInk(ctx, shown, L.font);
        const baseline = L.like ? y + h : y - orig.top * k;
        let left = x;
        if (L.align === "center") left = x + w / 2 - ink.w * k / 2;
        if (L.align === "right") left = x + w - ink.w * k;
        ctx.translate(left - ink.left * k, baseline);
        ctx.scale(k, k);
        ctx.fillText(shown, 0, 0);
      }
    }
  }
  ctx.restore();
}

/* ---------------------------------------------------------------------
   Painting one picture (in picture units, top-left of its box = 0,0)
   --------------------------------------------------------------------- */
function paintPicture(ctx, p) {
  if (p.img) ctx.drawImage(p.img, p.cx - p.iw / 2, p.cy - p.ih / 2, p.iw, p.ih);
  if (p.words) for (const L of p.words) drawText(ctx, L);
}

/* ---------------------------------------------------------------------
   draw(ctx, picture, x, y, options)
   Puts the picture's pin on screen spot (x, y).
   options: size (percent, 100 = normal), alpha (0-1),
            bright (-100 darker .. 100 lighter), turn (degrees)
   --------------------------------------------------------------------- */
function draw(ctx, p, x, y, o = {}) {
  if (!p) return;
  const alpha = o.alpha === undefined ? 1 : o.alpha;
  if (alpha <= 0) return;
  const k = (o.size || 100) / 100;
  ctx.save();
  ctx.translate(x, y);
  if (o.turn) ctx.rotate(o.turn * Math.PI / 180);
  ctx.scale(k, k);
  if (p.spin) {
    // a flat picture spinning in 3D (the rice bowl): squeeze it sideways over time
    ctx.scale(Math.cos(performance.now() / 2400 * Math.PI * 2), 1);
  }
  ctx.translate(-p.cx, -p.cy);
  if (p.pixel) ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha *= alpha;
  paintPicture(ctx, p);
  // darker / lighter: the picture's own shape painted black (or added again) on top.
  // (much faster than ctx.filter, which makes the browser redo the whole picture every frame)
  if (o.bright && p.img) {
    ctx.globalAlpha = alpha * Math.min(1, Math.abs(o.bright) / 100);
    if (o.bright > 0) ctx.globalCompositeOperation = "lighter";
    ctx.drawImage(o.bright < 0 ? Files.black(p.img) : p.img, p.cx - p.iw / 2, p.cy - p.ih / 2, p.iw, p.ih);
  }
  ctx.restore();
}

/* ---------------------------------------------------------------------
   Hit testing: is a screen point on a visible pixel of a picture?
   Each picture gets a small see-through map the first time it is asked.
   --------------------------------------------------------------------- */
function pictureMask(p) {
  if (p._mask !== undefined) return p._mask;
  const w = Math.max(1, Math.ceil(p.w)), h = Math.max(1, Math.ceil(p.h));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  paintPicture(g, p);
  let data = null;
  try { data = g.getImageData(0, 0, w, h).data; } catch (e) { /* opened from a file: treat as solid */ }
  const alpha = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) alpha[i] = data ? data[i * 4 + 3] : 255;
  p._mask = { w, h, alpha };
  return p._mask;
}

// Was screen point (px, py) on the picture drawn at (x, y) with this size?
function hits(p, x, y, size, px, py) {
  if (!p) return false;
  const k = (size || 100) / 100;
  const u = Math.floor((px - x) / k + p.cx), v = Math.floor((py - y) / k + p.cy);
  const m = pictureMask(p);
  if (u < 0 || v < 0 || u >= m.w || v >= m.h) return false;
  return m.alpha[v * m.w + u] > 0;
}

// Was screen point (px, py) inside the picture's box (good for words)?
function inBox(p, x, y, size, px, py, pad = 0) {
  if (!p) return false;
  const k = (size || 100) / 100;
  const u = (px - x) / k + p.cx, v = (py - y) / k + p.cy;
  return u >= -pad && v >= -pad && u <= p.w + pad && v <= p.h + pad;
}

/* ---------------------------------------------------------------------
   Smooth movement
   The game updates 30 times a second, but screens refresh 60+ times.
   Values that move (panning, fading, shaking) are remembered from the
   last update, and the screen draws them part of the way between the
   old and new value, so motion looks smooth instead of steppy.
   --------------------------------------------------------------------- */
class Smooth {
  constructor() { this.now = {}; this.before = {}; }
  set(key, v) { this.now[key] = v; if (!(key in this.before)) this.before[key] = v; }
  jump(key, v) { this.now[key] = v; this.before[key] = v; }      // move instantly (no blending)
  get(key) { return this.now[key]; }
  snapshot() { Object.assign(this.before, this.now); }          // called at the start of every update
  // the value to draw: `a` is how far we are between the last update (0) and the next (1)
  at(key, a, maxJump = Infinity) {
    const v = this.now[key], b = this.before[key];
    if (b === undefined || Math.abs(v - b) > maxJump) return v;
    return b + (v - b) * a;
  }
}


/* =====================================================================
   SOUND
   Every sound is a plain file, assets/snd/<group>/<name>.mp3, looked up
   by group and name, for example speaker.play("office", "Buzz_Fan_Florescent2").
   names.js lists which sounds exist and which ones are music.

   Sounds go through a "speaker". A speaker has its own volume
   (0-100), like a radio you can turn up and down while it plays.
   Speakers feed two volume knobs from the Settings screen:
     music  (songs and jingles)
     sound  (everything else)
   ===================================================================== */
"use strict";

const Sound = {
  ctx: new (window.AudioContext || window.webkitAudioContext)(),
  buffers: new Map(),       // url -> decoded sound
  speakers: [],

  // where a sound's file is (null if there is no such sound)
  path(group, name) {
    return SOUND_NAMES[group] && SOUND_NAMES[group].includes(name) ? `snd/${fileName(group)}/${fileName(name)}.mp3` : null;
  },
  // every sound file (for the loading bar and the mod template)
  allPaths() {
    const out = [];
    for (const [group, names] of Object.entries(SOUND_NAMES)) for (const n of names) out.push(this.path(group, n));
    return out;
  },

  async load(path) {
    const data = await (await fetch(assetUrl(path))).arrayBuffer();
    this.buffers.set(path, await this.ctx.decodeAudioData(data));
  },

  // A speaker for one thing in the game (the phone, the fan, the kitchen...)
  speaker(volume = 100) {
    const s = new Speaker(volume);
    this.speakers.push(s);
    return s;
  },

  // Silence everything (the game's "stop all sounds")
  stopAll() { for (const s of this.speakers) s.stopAll(); }
};

// The two volume knobs (the Settings sliders change these)
Sound.master = Sound.ctx.createGain();
Sound.master.connect(Sound.ctx.destination);
Sound.musicBus = Sound.ctx.createGain();
Sound.sfxBus = Sound.ctx.createGain();
Sound.musicBus.connect(Sound.master);
Sound.sfxBus.connect(Sound.master);

class Speaker {
  constructor(volume) {
    // one volume node for music and one for sounds, so each still follows its own knob
    this.music = Sound.ctx.createGain();
    this.sfx = Sound.ctx.createGain();
    this.music.connect(Sound.musicBus);
    this.sfx.connect(Sound.sfxBus);
    this.playing = new Map();     // sound name -> what is playing
    this.setVolume(volume);
  }

  setVolume(v) {
    this.volume = Math.max(0, Math.min(100, v));
    this.music.gain.value = this.sfx.gain.value = this.volume / 100;
  }

  /* Play a sound. Starting a sound that is already playing on this
     speaker starts it over. Options: loop (repeat forever).
     Returns a handle: handle.done turns true when it finishes. */
  play(group, name, o = {}) {
    const path = Sound.path(group, name);
    const buffer = path && Sound.buffers.get(path);
    const handle = { done: true, stop() {} };
    if (!buffer) { if (!path) console.warn("No sound", group, name); return handle; }
    this.stop(name);
    const src = Sound.ctx.createBufferSource();
    src.buffer = buffer;
    src.loop = !!o.loop;
    const gain = Sound.ctx.createGain();          // this sound's own volume (for fading out)
    src.connect(gain).connect(MUSIC_NAMES.has(name) ? this.music : this.sfx);
    handle.done = false;
    handle.stop = () => { try { src.stop(); } catch (e) {} handle.done = true; };
    // fade to silence over `secs` seconds, then stop
    handle.fadeOut = secs => {
      const t = Sound.ctx.currentTime;
      gain.gain.setValueAtTime(gain.gain.value, t);
      gain.gain.linearRampToValueAtTime(0, t + secs);
      try { src.stop(t + secs); } catch (e) {}
    };
    src.onended = () => { handle.done = true; if (this.playing.get(name) === handle) this.playing.delete(name); };
    src.start();
    this.playing.set(name, handle);
    return handle;
  }

  isPlaying(name) { const h = this.playing.get(name); return !!h && !h.done; }
  stop(name) { const h = this.playing.get(name); if (h) { h.stop(); this.playing.delete(name); } }
  stopAll() { for (const h of this.playing.values()) h.stop(); this.playing.clear(); }
}

// Play a sound on a speaker only if it is not already playing (for sounds that loop back to back)
function keepPlaying(speaker, group, name) {
  if (!speaker.isPlaying(name)) speaker.play(group, name);
}

/* =====================================================================
   ACTORS: the characters, drawn by the game wherever they stand

   Every character is drawn at runtime on top of the empty rooms, the
   office, the title screen, the jumpscares and so on. What gets drawn:

     1. its 3D model, if there is one in the models folder of the repo
        (models/toy_eddy.glb, models/withered_weddy.obj ...). Any of
        .glb  .gltf  .fbx  .obj  works. (Browsers can't open .blend
        files: tools/convert_models.py turns them into .glb.)
     2. otherwise its 2D drawing (the "Chars" pictures).

   The models are rendered ONCE while the game loads (standing, and
   reaching for you), into flat pictures. Drawing those every frame is
   as cheap as drawing any other picture, so there is no 3D cost while
   you play.

   Which file is which character: ACTOR_FILES below. The first file name
   that exists wins.

   Skeletons: a model built on the base model's skeleton is posed with
   MODEL_POSES. Any other skeleton (an uploaded model, Mixamo, Rigify...)
   follows THE SET RIG (below): its arms, legs, chest and head are found
   by name and pointed the same way, so every model gets the same poses.
   Animations: if a model has a looping animation (the one named idle or
   loop, otherwise its first one), it plays whenever the character is
   standing (rendered while loading into up to 30 frames).
   Faces: the toys have three (models/faces): calm when standing ("stand":
   the stage, newspapers...), creepy when wandering ("creep": cameras, hall,
   vents, title) and scary when reaching for you ("lunge").

   MODS can bring their own characters (Settings > Mods):
     models/<name>.glb (or .gltf .fbx .obj)    a 3D model
     characters/<name>.png (or .webp .jpg .svg)  a 2D drawing (full body)
   <name> is the same as the model names below (toy_eddy, withered_weddy...)
   or the role (tfreddy, wbonnie...). What wins, best first:
     mod model > mod drawing > the game's model (models/) > the game's drawing
   ===================================================================== */
"use strict";

const MODEL_DIR = "../models/";
const MODEL_TYPES = ["glb", "gltf", "fbx", "obj"];

// role -> model file names to look for (without the ending), first one found wins.
// pose: "broken" = bent and wrecked (Toy Endo's model standing in for Meyg)
const ACTOR_FILES = {
  tfreddy: [{ file: "toy_eddy" }],
  tbonnie: [{ file: "toy_weddy" }],
  tchica:  [{ file: "toy_cheddy" }],
  mangle:  [{ file: "meyg" }, { file: "mangled_endo" }, { file: "toy_endo", pose: "broken" }],
  bb:      [{ file: "balloon_kid" }],
  puppet:  [{ file: "the_puppet" }, { file: "puppet" }],
  wfreddy: [{ file: "withered_eddy" }],
  wbonnie: [{ file: "withered_weddy" }],
  wchica:  [{ file: "withered_cheddy" }],
  foxy:    [{ file: "withered_endo" }],
  golden:  [{ file: "golden_eddie" }, { file: "golden_eddy" }],
  endo:    [{ file: "endo" }, { file: "endoskeleton" }],
  // the shadow in Parts/Service is drawn all black, so any Eddy works
  shadow:  [{ file: "shadow_eddy" }, { file: "withered_eddy" }, { file: "toy_eddy" }],
};

// Bone poses for the 3D models: bone name -> [x, y, z] turn in degrees (the
// bone's own axes, like the rotation boxes in Blender's pose mode).
// Bone names are matched without dots, spaces or capitals ("UpperArm.L" = "upperarml").
const MODEL_POSES = {
  stand: { "UpperArm.L": [-78, 0, 0], "UpperArm.R": [-78, 0, 0], "Head": [0, 6, 0] },
  lunge: { "UpperArm.L": [-12, 0, -88], "UpperArm.R": [-12, 0, 88], "Chest": [-14, 0, 0], "Head": [-12, -10, 0],
           "Ear.L": [0, -20, 0], "Ear.R": [0, 20, 0], "Leg.L": [18, 0, 0], "Leg.R": [-12, 0, 0] },
  // wrecked: twisted head, one arm wrenched up, one hanging, legs splayed
  broken: { "UpperArm.L": [40, 0, 30], "UpperArm.R": [-88, 0, 0], "Head": [12, 14, 12], "Chest": [8, 10, 6],
            "Ear.L": [0, -55, 0], "Ear.R": [0, 70, 30], "Leg.L": [0, 25, 0], "Leg.R": [30, -15, 0], "Hand.L": [60, 0, 0] },
  brokenlunge: { "UpperArm.L": [-10, 0, -75], "UpperArm.R": [-30, 0, 85], "Chest": [-18, 6, 0], "Head": [-10, 12, 14],
                 "Ear.L": [0, -55, 0], "Ear.R": [0, 70, 30], "Leg.L": [20, 20, 0] },
};
const ACTOR_RENDER_H = 760;            // how tall (in pixels) each 3D character picture is made
const ACTOR_ANIM_H = 440;              // ...and each frame of an animation (smaller: there are many)
const ACTOR_ANIM_FPS = 12, ACTOR_ANIM_MAX = 10;   // at most 10 frames per loop (memory)
const SCARE_W = 640, SCARE_H = 480;    // jumpscares are drawn live, this big

/* ---------------------------------------------------------------------
   THE SET RIG: models that don't use the base model's skeleton
   (uploaded models, Mixamo, Rigify, VRoid...) are posed through it.
   Their bones are matched to these few parts by name, then each part is
   turned to POINT a set way, so any skeleton ends up in the same pose:
     chest, head, armL, armR (upper arms), legL, legR (thighs)
   Directions: x = the character's left, y = up, z = toward you.
   --------------------------------------------------------------------- */
const SET_RIG_POSES = {
  stand:       { chest: [0, 1, 0.04], armL: [0.2, -1, 0.06], armR: [-0.2, -1, 0.06], legL: [0.06, -1, 0], legR: [-0.06, -1, 0] },
  lunge:       { chest: [0, 1, 0.38], head: [0, 0.7, 1], armL: [0.32, 0.18, 1], armR: [-0.32, 0.18, 1],
                 legL: [0.08, -1, 0.35], legR: [-0.08, -1, -0.25] },
  broken:      { chest: [0.25, 1, 0.12], head: [0.6, 0.6, 0.4], armL: [0.55, 1, 0.2], armR: [-0.12, -1, 0.15],
                 legL: [0.45, -1, 0.05], legR: [-0.3, -1, 0.35] },
  brokenlunge: { chest: [0.15, 1, 0.45], head: [0.5, 0.5, 1], armL: [0.4, 0.3, 1], armR: [-0.2, 0.1, 1],
                 legL: [0.3, -1, 0.3], legR: [-0.1, -1, -0.2] },
};
// bone names -> set-rig part ("mixamorig:LeftArm", "DEF-upper_arm.L", "Bip01 L Thigh", "J_Bip_L_UpperArm"...)
const SET_RIG_PARTS = { arm: ["upperarm", "arm", "uparm"], leg: ["upleg", "upperleg", "thigh", "leg"] };
const SET_RIG_CHEST = ["upperchest", "chest", "spine2", "spine02", "spine1", "spine01", "spine"];
function setRigPart(rawName) {
  const n = String(rawName).toLowerCase().replace(/[^a-z0-9]/g, "")
    .replace(/^(mixamorig\d*|bip0*1|bip|def|org|ccbase|jbip|jbipc|valvebiped|bip01|armature)/, "");
  if (n === "head") return "head";
  // side at the start ("leftarm", "lthigh") or at the end ("upperarml", "thighleft")
  const tries = [["L", n.match(/^(?:left|l)(.+)$/)], ["L", n.match(/^(.+?)(?:left|l)$/)],
                 ["R", n.match(/^(?:right|r)(.+)$/)], ["R", n.match(/^(.+?)(?:right|r)$/)]];
  for (const [side, m] of tries) {
    if (!m) continue;
    for (const [part, names] of Object.entries(SET_RIG_PARTS)) if (names.includes(m[1])) return part + side;
  }
  return null;
}
// Does this skeleton follow the base model (Root > Hips > Chest > Head, UpperArm.L ...)? Then it uses MODEL_POSES.
const isBaseRig = bones => ["hips", "chest", "head", "upperarml", "upperarmr", "legl", "legr"].every(b => bones[b]);

// The names a character can have in a mod's models/ and characters/ folders
const actorNames = role => [...ACTOR_FILES[role].map(c => c.file), role];
// The first mod file for a character in a folder (MOD_FILES is filled by the Mods code)
function modActorFile(folder, role, types) {
  if (typeof MOD_FILES === "undefined") return null;
  for (const name of actorNames(role)) for (const type of types) {
    const url = MOD_FILES[folder + "/" + name + "." + type];
    if (url) return { url, type, file: name, pose: (ACTOR_FILES[role].find(c => c.file === name) || {}).pose };
  }
  return null;
}
const DRAWING_TYPES = ["png", "webp", "jpg", "jpeg", "gif", "svg"];
const loadImage = url => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });

// One finished character picture: the image, its black copy (for darkening),
// and where its body and head are inside it (pixels: [left, top, right, bottom])
function makeSprite(canvas, headPart, same) {
  const w = canvas.naturalWidth || canvas.width, h = canvas.naturalHeight || canvas.height;
  if (same) return { img: canvas, black: blackCopy(canvas, w, h), w, h, body: same.body, head: same.head };   // animation frames share one box
  const k = Math.min(1, 220 / Math.max(w, h));         // measure on a small copy (fast)
  const sw = Math.max(1, Math.round(w * k)), sh = Math.max(1, Math.round(h * k));
  const m = document.createElement("canvas");
  m.width = sw; m.height = sh;
  const g = m.getContext("2d", { willReadFrequently: true });
  g.drawImage(canvas, 0, 0, sw, sh);
  const a = g.getImageData(0, 0, sw, sh).data;
  let x0 = sw, y0 = sh, x1 = -1, y1 = -1;
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    if (a[(y * sw + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) { x0 = 0; y0 = 0; x1 = sw - 1; y1 = sh - 1; }
  // the head: the top part of the body, as wide as the drawing is there
  const band = Math.round(y0 + (y1 - y0) * headPart);
  let hx0 = sw, hx1 = -1;
  for (let y = y0; y <= band; y++) for (let x = 0; x < sw; x++) {
    if (a[(y * sw + x) * 4 + 3] > 40) { if (x < hx0) hx0 = x; if (x > hx1) hx1 = x; }
  }
  if (hx1 < 0) { hx0 = x0; hx1 = x1; }
  return { img: canvas, black: blackCopy(canvas, w, h), w, h,
           body: [x0 / k, y0 / k, (x1 + 1) / k, (y1 + 1) / k],
           head: [hx0 / k, y0 / k, (hx1 + 1) / k, (band + 1) / k] };
}

const Actors = {
  sprites: new Map(),          // "role/kind" -> sprite
  models: {},                  // role -> the model file used (for the debug panel)

  get(role, kind, still) {
    const fallback = { vent: "creep", hall: "creep", title: "creep" }[kind];
    const s = this.sprites.get(role + "/" + (kind || "stand")) || (fallback && this.sprites.get(role + "/" + fallback))
      || this.sprites.get(role + "/stand") || this.flat(role);
    // an animation: the frame for right now (or always the first one when it should hold still)
    if (s && s.frames) return still ? s.frames[0] : s.frames[Math.floor(performance.now() / 1000 * s.fps) % s.frames.length];
    return s;
  },
  // every picture (for the warm-up while loading)
  allPictures() {
    const out = [];
    for (const s of this.sprites.values()) for (const f of s.frames || [s]) out.push(f.img, f.black);
    return out;
  },

  // the 2D drawing (made the first time it is needed)
  flat(role) {
    const key = role + "/stand";
    if (this.sprites.has(key)) return this.sprites.get(key);
    if (!hasPic("Chars", role)) return null;
    const p = pic("Chars", role);
    if (!p.img) return null;
    const s = makeSprite(p.img, 0.4);       // measured straight from the picture (no slow copy)
    this.sprites.set(key, s);
    return s;
  },

  // Look for each character's model and render it. Never fails: anything
  // that goes wrong just leaves that character as its 2D drawing.
  async load(onProgress) {
    // measure every 2D drawing now, while loading (measuring during the night made the game stutter)
    for (const role of Object.keys(ACTOR_FILES)) this.flat(role);
    const found = {};
    await Promise.all(Object.entries(ACTOR_FILES).map(async ([role, list]) => {
      // 1. a mod's 3D model
      const modModel = modActorFile("models", role, MODEL_TYPES);
      if (modModel) { found[role] = modModel; return; }
      // 2. a mod's 2D drawing (wins over the game's own model)
      const modDrawing = modActorFile("characters", role, DRAWING_TYPES);
      if (modDrawing) {
        try {
          const img = await loadImage(modDrawing.url);
          if (img.decode) await img.decode().catch(() => {});
          this.sprites.set(role + "/stand", makeSprite(img, 0.4));
          this.sprites.delete(role + "/lunge");
          this.models[role] = "mod drawing";
          return;
        } catch (e) { console.warn("Mod drawing did not load", modDrawing.file, e); }
      }
      // 3. the game's own model in the models folder
      for (const choice of list) {
        for (const type of MODEL_TYPES) {
          const url = MODEL_DIR + choice.file + "." + type;
          try {
            const r = await fetch(url, { method: "HEAD", cache: "no-cache" });
            if (r.ok) { found[role] = { ...choice, url, type }; return; }
          } catch (e) { /* no file */ }
        }
      }
    }));
    const roles = Object.keys(found);
    if (!roles.length) return;
    let three;
    try { three = await this.startThree(); }
    catch (e) { console.warn("3D models could not be started (using the 2D drawings)", e); return; }
    const cache = new Map();          // the same file used twice (the shadow) is loaded once
    let done = 0;
    for (const role of roles) {
      const f = found[role];
      try {
        if (!cache.has(f.url)) cache.set(f.url, await three.loadModel(f.url, f.type));
        const model = cache.get(f.url);
        const poses = f.pose === "broken" ? ["broken", "brokenlunge"] : ["stand", "lunge"];
        // the toys' other faces (models/faces/<file>_head2.png creepy, _head3.png scary), when there are some
        const faces = await three.loadFaces(f.file);
        // standing: its own looping animation if it has one, otherwise the standing pose (calm face)
        three.setFace(model, null);
        const animate = model.clip && role !== "shadow";      // (the all-black shadow doesn't need to move)
        if (animate) this.sprites.set(role + "/stand", three.renderAnimation(model, 8, poses[0]));
        else this.sprites.set(role + "/stand", makeSprite(three.render(model, poses[0], 8), 0.36));
        // creeping around (cameras, hall, vents): standing, creepy face
        if (faces[2]) {
          three.setFace(model, faces[2]);
          this.sprites.set(role + "/creep", animate ? three.renderAnimation(model, 8, poses[0]) : makeSprite(three.render(model, poses[0], 8), 0.36));
        }
        if (role !== "shadow") {
          if (faces[2]) three.setFace(model, faces[2]);
          // lying down in the vents, walking down the hall (small pictures: they are drawn small)
          if (model.crawlClip) this.sprites.set(role + "/vent", three.renderAnimation(model, 0, poses[0], { clip: model.crawlClip, frames: 8, H: 300, view: "low", wholeHead: true }));
          if (model.walkClip) this.sprites.set(role + "/hall", three.renderAnimation(model, 4, poses[0], { clip: model.walkClip, frames: 8, H: 320 }));
          // the title screen close-up: one big sharp picture
          if (TITLE_FACES.some(f => f.role === role)) {
            const big = makeSprite(three.renderBig(model, poses[0], 1100), 0.36);
            const [x0, y0, x1, y1] = big.body;            // the head and ears: the top of the close-up
            big.head = [x0, y0, x1, y0 + (y1 - y0) * 0.72];
            this.sprites.set(role + "/title", big);
          }
        }
        // reaching for you (in the office, jumpscares): scary face
        three.setFace(model, faces[3] || faces[2] || null);
        this.sprites.set(role + "/lunge", makeSprite(three.render(model, poses[1], 0), 0.36));
        three.setFace(model, null);
        if (model.scareClip && role !== "shadow") this.scares[role] = { model, face: faces[3] || faces[2] || null };
        this.models[role] = f.url;
      } catch (e) { console.warn("Could not use the 3D model", f.url, e); }
      if (onProgress) onProgress(++done / roles.length);
    }
    // keep three.js only if a jumpscare needs it
    if (Object.keys(this.scares).length) this.three = three;
    else three.dispose();
  },

  // ---- live 3D jumpscares ----
  scares: {},                  // role -> {model, face}
  hasScare(role) { return !!(this.three && this.scares[role]); },
  scareLength(role) { return this.hasScare(role) ? this.scares[role].model.scareClip.duration : 0; },
  scareFrame(role, t) {
    const s = this.scares[role];
    this.three.setFace(s.model, s.face);
    return this.three.renderScare(s.model, t);
  },

  // three.js (lib/three, loaded only when there is a model to show)
  async startThree() {
    const THREE = await import("three");
    const R = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
    R.outputColorSpace = THREE.SRGBColorSpace;
    R.setClearColor(0x000000, 0);
    const scene = new THREE.Scene();
    // stage lights: a soft room light, a key light from above the camera, a fill and a rim
    scene.add(new THREE.HemisphereLight(0xc8c8d8, 0x2a2a30, 1.1));
    for (const [x, y, z, power] of [[-2.5, 4.5, 4, 2.4], [3.5, 2, 3, 0.8], [0.5, 3.5, -4, 1.8]]) {
      const l = new THREE.DirectionalLight(0xffffff, power);
      l.position.set(x, y, z);
      scene.add(l);
    }
    const camera = new THREE.PerspectiveCamera(26, 1, 0.01, 1000);
    const DEG = Math.PI / 180;
    const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");

    async function loadModel(url, type) {
      let root, clips = [];
      if (type === "glb" || type === "gltf") {
        const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
        const gltf = await new GLTFLoader().loadAsync(url);
        root = gltf.scene; clips = gltf.animations || [];
      } else if (type === "fbx") {
        const { FBXLoader } = await import("three/addons/loaders/FBXLoader.js");
        root = await new FBXLoader().loadAsync(url);
        clips = root.animations || [];
      } else {
        const { OBJLoader } = await import("three/addons/loaders/OBJLoader.js");
        root = await new OBJLoader().loadAsync(url);
        // a plain .obj has no colors: give it a plastic grey
        root.traverse(o => { if (o.isMesh && (!o.material || o.material.type === "MeshPhongMaterial"))
          o.material = new THREE.MeshStandardMaterial({ color: 0xb8b0a8, roughness: 0.6 }); });
      }
      // make every model the same size (2.4 tall, feet on the floor, in the middle).
      // (measured on the real, skinned shape: "precise")
      root.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(root, true);
      const size = box.getSize(new THREE.Vector3());
      const k = 2.4 / (size.y || 1);
      root.scale.multiplyScalar(k);
      root.updateMatrixWorld(true);
      const b2 = new THREE.Box3().setFromObject(root, true);
      const c = b2.getCenter(new THREE.Vector3());
      root.position.x -= c.x; root.position.z -= c.z; root.position.y -= b2.min.y;
      root.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
      // the bones by their plain names, with their resting turn (and place) remembered
      const bones = {};
      root.traverse(o => { if (o.isBone) { bones[norm(o.name)] = o; o.userData.rest = o.quaternion.clone(); o.userData.restPos = o.position.clone(); } });
      const model = { root, bones, baseRig: isBaseRig(bones) };
      // not the base skeleton: find the set-rig parts in it
      if (!model.baseRig) model.rig = findSetRig(root);
      // a looping animation: the one called idle/loop, otherwise the first one (that isn't a jumpscare)
      const isScare = c => /scare|jump|death|kill/i.test(c.name);
      const clip = clips.find(c => /idle|loop/i.test(c.name)) || clips.find(c => !isScare(c) && !/crawl|vent|prone|walk|hall/i.test(c.name));
      const usable = c => c && c.duration > 0.05 && c.tracks.length;
      if (usable(clip) || usable(clips.find(isScare))) model.mixer = new THREE.AnimationMixer(root);
      if (usable(clip)) {
        model.action = model.mixer.clipAction(clip);
        model.action.play();
        model.clip = clip;
      }
      // a jumpscare animation (Scare / Jumpscare / Death): played live when this character gets you
      // lying down in a vent / coming down the hall
      const crawl = clips.find(c => /crawl|vent|prone/i.test(c.name)), walk = clips.find(c => /walk|hall/i.test(c.name));
      if (usable(crawl)) model.crawlClip = crawl;
      if (usable(walk)) model.walkClip = walk;
      const scare = clips.find(isScare);
      if (usable(scare)) { model.scareClip = scare; model.scareAction = model.mixer.clipAction(scare); }
      return model;
    }

    const isAncestor = (a, b) => { for (let p = b.parent; p; p = p.parent) if (p === a) return true; return false; };
    const firstChildBone = (b, toward) => {
      const kids = b.children.filter(c => c.isBone);
      return (toward && kids.find(k => k === toward || isAncestor(k, toward))) || kids[0] || null;
    };
    function findSetRig(root) {
      const rig = {}, all = [];
      root.traverse(o => { if (o.isBone) all.push(o); });
      for (const b of all) {
        const part = setRigPart(b.name);
        if (!part) continue;
        // two bones for one part (Mixamo's UpLeg and Leg): the one closer to the body wins
        if (!rig[part] || isAncestor(b, rig[part])) rig[part] = b;
      }
      const plain = b => b.name.toLowerCase().replace(/[^a-z0-9]/g, "").replace(/^(mixamorig\d*|bip0*1|def|org|jbipc?)/, "");
      for (const want of SET_RIG_CHEST) { const b = all.find(x => plain(x) === want); if (b) { rig.chest = b; break; } }
      return rig;
    }
    // turn one bone so it points along `dir` (from the bone to its child)
    const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _q = new THREE.Quaternion(), _bw = new THREE.Quaternion(), _pw = new THREE.Quaternion();
    function aim(bone, child, dir) {
      if (!bone || !child) return;
      bone.getWorldPosition(_a); child.getWorldPosition(_b);
      const d = _b.sub(_a);
      if (d.lengthSq() < 1e-10) return;
      _q.setFromUnitVectors(d.normalize(), new THREE.Vector3(...dir).normalize());
      bone.getWorldQuaternion(_bw);
      bone.parent.getWorldQuaternion(_pw);
      bone.quaternion.copy(_pw.invert().multiply(_q.multiply(_bw)));
      bone.updateMatrixWorld(true);
    }
    function poseSetRig(model, which) {
      const rig = model.rig, P = SET_RIG_POSES[which] || {};
      model.root.updateMatrixWorld(true);
      if (P.chest && rig.chest) aim(rig.chest, firstChildBone(rig.chest, rig.head), P.chest);
      if (P.head && rig.head) aim(rig.head, firstChildBone(rig.head), P.head);
      for (const part of ["armL", "armR", "legL", "legR"]) if (P[part] && rig[part]) aim(rig[part], firstChildBone(rig[part]), P[part]);
    }

    function pose(model, which) {
      for (const b of Object.values(model.bones)) { b.quaternion.copy(b.userData.rest); b.position.copy(b.userData.restPos); }
      if (!model.baseRig) { poseSetRig(model, which); return; }
      for (const [name, [x, y, z]] of Object.entries(MODEL_POSES[which] || {})) {
        const b = model.bones[norm(name)];
        // Blender's XYZ turn order = three.js "ZYX"
        if (b) b.quaternion.copy(b.userData.rest).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(x * DEG, y * DEG, z * DEG, "ZYX")));
      }
      model.root.updateMatrixWorld(true);
    }

    // one picture of the model in a pose, seen from `angle` degrees to the side
    function render(model, which, angle) {
      pose(model, which);
      return trim(shoot(model, angle, ACTOR_RENDER_H));
    }
    // the model as it is now -> a picture (H pixels tall, not cut down)
    function shoot(model, angle, H, view) {
      const W = Math.round(H * (view === "low" ? 1.4 : 0.95));
      R.setSize(W, H, false);
      camera.aspect = W / H;
      const d = 9.2, a = angle * DEG;
      if (view === "face") {
        // a close-up of the head (the title screen): the head fills the picture, nice and sharp
        camera.position.set(0, 2.05, 4.2);
        camera.lookAt(0, 2.0, 0);
      } else if (view === "low") {
        // lying down (vents): seen from in front, a bit above, so the face looking up is in view
        camera.position.set(Math.sin(a) * d, 2.4, Math.cos(a) * d + 1.5);
        camera.lookAt(0, 0.35, 1.2);
      } else {
        camera.position.set(Math.sin(a) * d, 1.45, Math.cos(a) * d);
        camera.lookAt(0, 1.2, 0);
      }
      camera.updateProjectionMatrix();
      scene.add(model.root);
      R.render(scene, camera);
      scene.remove(model.root);
      // copy it into a normal picture, cut down to the character
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      c.getContext("2d", { willReadFrequently: true }).drawImage(R.domElement, 0, 0);
      return c;
    }
    // the model's looping animation -> pictures (frames), all cut to the same box so it doesn't wobble
    // o: {clip (default: the idle loop), frames, H (picture height), view ("low" for lying down), wholeHead}
    function renderAnimation(model, angle, standPose, o = {}) {
      const clip = o.clip || model.clip;
      const n = Math.max(2, Math.min(o.frames || ACTOR_ANIM_MAX, Math.round(clip.duration * ACTOR_ANIM_FPS)));
      const act = clip === model.clip ? model.action : model.mixer.clipAction(clip);
      model.mixer.stopAllAction();
      act.reset().play();
      const shots = [];
      for (let i = 0; i < n; i++) {
        pose(model, standPose);                       // standing pose for the bones the animation doesn't move...
        model.mixer.setTime(clip.duration * i / n);   // ...then the animation on top
        model.root.updateMatrixWorld(true);
        shots.push(shoot(model, angle, o.H || ACTOR_ANIM_H, o.view));
      }
      model.mixer.stopAllAction();
      if (model.action) model.action.play();
      model.mixer.setTime(0);
      const box = unionBox(shots);
      const frames = shots.map(c => cropTo(c, box));
      const first = makeSprite(frames[0], 0.36);
      if (o.wholeHead) first.head = first.body.slice();   // lying down: the whole thing goes where the head would
      const sprites = frames.map((c, i) => (i === 0 ? first : makeSprite(c, 0.36, first)));
      return { frames: sprites, fps: n / clip.duration };
    }
    // a still picture, bigger than usual (the title screen close-up)
    function renderBig(model, which, H) {
      pose(model, which);
      return trim(shoot(model, 0, H, "face"));
    }

    function dispose() { R.dispose(); R.forceContextLoss && R.forceContextLoss(); }

    // One moment of a jumpscare, from where you sit (live: only while a jumpscare plays)
    const scareCam = new THREE.PerspectiveCamera(55, SCARE_W / SCARE_H, 0.01, 1000);
    function renderScare(model, t) {
      for (const b of Object.values(model.bones)) { b.quaternion.copy(b.userData.rest); b.position.copy(b.userData.restPos); }
      model.mixer.stopAllAction();
      model.scareAction.reset().play();
      model.mixer.setTime(Math.min(t, model.scareClip.duration - 0.001));
      model.root.updateMatrixWorld(true);
      R.setSize(SCARE_W, SCARE_H, false);
      scareCam.position.set(0, 1.62, 3.15);
      scareCam.lookAt(0, 1.42, 0);
      scene.add(model.root);
      R.render(scene, scareCam);
      scene.remove(model.root);
      model.scareAction.stop();
      if (model.action) model.action.play();
      return R.domElement;
    }
    // A toy's other faces: head textures painted by tools/face_toys.py (a mod can bring its own)
    const texLoader = new THREE.TextureLoader();
    async function loadFaces(file) {
      const out = {};
      for (const n of [2, 3]) {
        const rel = "models/faces/" + file + "_head" + n + ".png";
        const url = (typeof MOD_FILES !== "undefined" && MOD_FILES[rel]) || "../" + rel;
        try {
          const t = await texLoader.loadAsync(url);
          t.flipY = false;                               // (the way glTF models read pictures)
          t.colorSpace = THREE.SRGBColorSpace;
          out[n] = t;
        } catch (e) { /* this model has no such face */ }
      }
      return out;
    }
    // Put a face texture on the head (null = the model's own)
    function setFace(model, tex) {
      model.root.traverse(o => {
        if (!o.isMesh) return;
        for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
          if (!m || !/head/i.test(m.name || "")) continue;
          if (m.userData.ownMap === undefined) m.userData.ownMap = m.map || null;
          const map = tex || m.userData.ownMap;
          m.map = map;
          m.needsUpdate = true;
        }
      });
    }

    return { loadModel, render, renderAnimation, renderBig, renderScare, loadFaces, setFace, dispose };
  },
};

// The picture's shape in black (for darkening)
function blackCopy(canvas, w, h) {
  const black = document.createElement("canvas");
  black.width = w; black.height = h;
  const bg = black.getContext("2d");
  bg.drawImage(canvas, 0, 0);
  bg.globalCompositeOperation = "source-in";
  bg.fillStyle = "#000"; bg.fillRect(0, 0, w, h);
  return black;
}
// The box around everything drawn in any of these pictures (same size pictures)
function unionBox(list) {
  let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
  for (const c of list) {
    const { width: w, height: h } = c;
    const a = c.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, w, h).data;
    for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) {
      if (a[(y * w + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
  }
  const w = list[0].width, h = list[0].height;
  if (x1 < 0) return [0, 0, w, h];
  return [Math.max(0, x0 - 4), Math.max(0, y0 - 4), Math.min(w, x1 + 5), Math.min(h, y1 + 5)];
}
function cropTo(c, [x0, y0, x1, y1]) {
  const out = document.createElement("canvas");
  out.width = x1 - x0; out.height = y1 - y0;
  out.getContext("2d").drawImage(c, -x0, -y0);
  return out;
}
// Cut the empty space around a picture away (keeps memory small)
function trim(c) {
  const g = c.getContext("2d", { willReadFrequently: true });
  const { width: w, height: h } = c;
  const a = g.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) {
    if (a[(y * w + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return c;
  x0 = Math.max(0, x0 - 4); y0 = Math.max(0, y0 - 4); x1 = Math.min(w, x1 + 5); y1 = Math.min(h, y1 + 5);
  const out = document.createElement("canvas");
  out.width = x1 - x0; out.height = y1 - y0;
  out.getContext("2d").drawImage(c, -x0, -y0);
  return out;
}

/* ---------------------------------------------------------------------
   drawActor(ctx, role, box, options)
   Draws a character into box [left, top, right, bottom] (current units).
   options: mode "body" (feet at the bottom of the box) or "head" (head fills it),
            kind "lunge", shade 0..1 (darker), tint true (all black), still (no idle animation),
            rot (degrees), cut [x, y, w, h] (only inside), alpha, flip
   --------------------------------------------------------------------- */
function drawActor(ctx, role, box, o = {}) {
  const s = Actors.get(role, o.kind, o.still);
  if (!s) return;
  const head = o.mode === "head";
  const part = head ? s.head : s.body;
  const k = (box[3] - box[1]) / Math.max(1, part[3] - part[1]);
  const ax = (part[0] + part[2]) / 2, ay = head ? (part[1] + part[3]) / 2 : part[3];   // this point of the picture...
  const tx = (box[0] + box[2]) / 2, ty = head ? (box[1] + box[3]) / 2 : box[3];       // ...goes here
  ctx.save();
  if (o.cut) { ctx.beginPath(); ctx.rect(o.cut[0], o.cut[1], o.cut[2], o.cut[3]); ctx.clip(); }
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  ctx.translate(tx, ty);
  if (o.rot) ctx.rotate(o.rot * Math.PI / 180);
  ctx.scale(o.flip ? -k : k, k);
  ctx.translate(-ax, -ay);
  if (!o.tint) ctx.drawImage(s.img, 0, 0);
  const shade = o.tint ? 1 : Math.min(0.95, o.shade || 0);
  if (shade > 0.01) { ctx.globalAlpha *= shade; ctx.drawImage(s.black, 0, 0); }
  ctx.restore();
}

// Draws a character spot that was made for a picture of its own:
// spot.pin is that picture's pin, spot.box is in its units. (x, y, size) like draw().
function drawSpot(ctx, spot, x, y, size = 100, o = {}) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size / 100, size / 100);
  ctx.translate(-spot.pin[0], -spot.pin[1]);
  drawActor(ctx, spot.role, spot.box, { ...spot, ...o });
  ctx.restore();
}

// Runs fn with the drawing lined up with a room picture drawn by draw(ctx, p, x, y, {size})
// (so spots measured in the room picture land in the right place)
function inPicture(ctx, p, x, y, size, fn) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size / 100, size / 100);
  ctx.translate(-p.cx, -p.cy);
  fn();
  ctx.restore();
}

// "darker" in draw()'s units (-100..0) and a shade together (both darken)
const addShade = (shade, bright) => 1 - (1 - (shade || 0)) * (1 - Math.max(0, -(bright || 0)) / 100);

/* ---------------------------------------------------------------------
   Character spots that are not in a room (the old pictures' pins and boxes)
   --------------------------------------------------------------------- */
const EXTRA_SPOTS = {
  // in the office

  golden:  { role: "golden", pin: [180, 180], box: [40, 40, 320, 340], mode: "body", rot: -12, shade: 0.5 },

// custom night prizes that are characters (little plushies on the desk)
const PLUSH_ROLE = { Sprite58: "bb", Sprite59: "wbonnie", Sprite60: "wchica", Sprite62: "foxy",
                     Sprite63: "wfreddy", Sprite64: "golden", Sprite66: "tbonnie" };
const PLUSH_SPOT = { pin: [60, 85], box: [10, 10, 110, 165], mode: "body", shade: 0.3, still: true };
// custom night portraits

// title screen faces (Toy Eddy staring, and the old ones for a split second)
const TITLE_FACES = [
  { role: "tfreddy", box: [250, 30, 520, 330], shade: 0.5, rot: -3 },
  { role: "wfreddy", box: [240, 20, 530, 340], shade: 0.45, rot: -6 },
  { role: "wbonnie", box: [250, -10, 520, 330], shade: 0.45, rot: -6 },
  { role: "wchica", box: [240, 20, 530, 340], shade: 0.45, rot: -6 },
];
// jumpscares: how many steps the lunge takes
const SCARE_FRAMES = who => (Actors.hasScare(who) ? Math.ceil(Actors.scareLength(who) * 15) + 6
  : who === "golden" ? 1 : 9);

// A 3D jumpscare (the model's own Scare animation), drawn live over the dark office
function drawScare3D(ctx, who, i) {
  const t = i / 15, len = Actors.scareLength(who);
  ctx.save();
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 480, 360);
  const office = pic("Office", "000");
  if (office && office.img) ctx.drawImage(office.img, -60, 0, 600, 360);
  ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(0, 0, 480, 360);
  // the screen shakes harder as it reaches you
  const k = Math.min(1, t / Math.max(0.1, len)), sh = 2 + 9 * k * k;
  ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
  ctx.drawImage(Actors.scareFrame(who, t), -8, -6, 496, 372);
  ctx.restore();
}

// One jumpscare step: the character lunging at you in the dark office
function drawScare(ctx, who, i) {
  if (Actors.hasScare(who)) return drawScare3D(ctx, who, i);
  const frames = SCARE_FRAMES(who);
  const k = Math.min(1, i / Math.max(1, frames - 1));
  const u = k * k * (3 - 2 * k);                       // smooth start and stop
  const jit = Math.sin(i * 2.7) * 6 * u;
  const hh = who === "golden" ? 330 : 120 + 260 * u;
  const hy = who === "puppet" ? 300 - 120 * u : 190 - 20 * u;
  ctx.save();
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 480, 360);
  const office = pic("Office", "000");
  if (office && office.img) ctx.drawImage(office.img, -60, 0, 600, 360);
  ctx.fillStyle = `rgba(0,0,0,${0.35 + 0.25 * u})`; ctx.fillRect(0, 0, 480, 360);
  drawActor(ctx, who, [240 + jit - hh / 2, hy - hh / 2, 240 + jit + hh / 2, hy + hh / 2],
    { mode: "head", kind: "lunge", rot: Math.sin(i * 1.9) * 7 * u, shade: 0.18 });
  ctx.restore();
}


/* =====================================================================
   FRIED RICE AT EDDIE'S 2 (Tape 2)
   The whole game, written as a normal browser game:
     - update() runs 30 times a second and moves the game forward
     - render() draws the current screen (as often as the screen allows)
     - "screens" (title, night, custom...) decide what is shown

   How a night works (like FNaF 2):
     - there are no doors. You have a MASK, a FLASHLIGHT and the CAMERAS
     - characters walk from camera to camera, then come down the hall or
       crawl through the two air vents into the office
     - when someone is in the office, put the mask on right away
     - Withered Endo (in the hall) only leaves if you flash the light at him
     - the music box (camera 11) must be wound up or the Puppet comes
     - the flashlight runs on a battery; when it is empty you are in trouble

   Positions use Scratch's stage spots (x right, y UP, 0,0 = middle),
   because every picture came from the Scratch project. S(x, y) turns
   them into canvas spots on the 480 x 360 game screen.
   ===================================================================== */
"use strict";

const TICK = 1 / 30;                  // seconds per update
const TICK_MS = 1000 / 30;

/* ---------------------------------------------------------------------
   Small helpers
   --------------------------------------------------------------------- */
const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));    // whole number lo..hi
const randFloat = (lo, hi) => lo + Math.random() * (hi - lo);
const chance = n => rand(1, n) === 1;                                      // "1 in n"
const pick = list => list[Math.floor(Math.random() * list.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const SX = x => 240 + x;              // Scratch x -> screen x
const SY = y => 180 - y;              // Scratch y -> screen y

// A word the game shows. Mods can change it in texts.json ("group" is just
// where it is listed in texts.json). The build collects every W("...", "...").
const W = (group, s) => (TEXTS[s] !== undefined ? String(TEXTS[s]) : s);

/* ---------------------------------------------------------------------
   Scripts: tiny step-by-step sequences (same as Tape 1)
     yield 2          wait 2 seconds
     yield            wait one update
     yield () => x    wait until x is true
   --------------------------------------------------------------------- */
class Scripts {
  constructor() { this.list = []; }
  run(tag, gen) { const s = { tag, gen, wait: 0, until: null }; this.list.push(s); return s; }
  stop(...tags) { this.list = this.list.filter(s => !tags.includes(s.tag)); }
  stopAll() { this.list = []; }
  has(tag) { return this.list.some(s => s.tag === tag); }
  update() {
    for (const s of [...this.list]) {
      if (!this.list.includes(s)) continue;
      if (s.wait > 0) { s.wait -= TICK; if (s.wait > 1e-9) continue; }
      if (s.until && !s.until()) continue;
      s.until = null;
      const r = s.gen.next();
      if (!this.list.includes(s)) continue;
      if (r.done) { this.list.splice(this.list.indexOf(s), 1); continue; }
      if (typeof r.value === "number") s.wait = r.value;
      else if (typeof r.value === "function") s.until = r.value;
    }
  }
}

   The cast. Every character has an id the code uses, and a name the
   player sees (mods can rename them in texts.json).
   --------------------------------------------------------------------- */
const CAST = {
