<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fried Rice at Eddie's 2</title>
<!-- Tab icon -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  /* ===== Fonts used by the game's text (Scratch's own fonts + pixel fonts) ===== */
  @font-face { font-family: "Sans Serif"; src: url("assets/fonts/NotoSans-Medium.ttf"); }
  @font-face { font-family: "Pixel"; src: url("assets/fonts/Grand9K-Pixel.ttf"); }
  @font-face { font-family: "Press Start 2P"; src: url("assets/fonts/PressStart2P.woff2"); }
  @font-face { font-family: "Share Tech Mono"; src: url("assets/fonts/ShareTechMono.woff2"); }
  @font-face { font-family: "Courier Prime"; src: url("assets/fonts/CourierPrime.woff2"); }
  @font-face { font-family: "Serif"; src: url("assets/fonts/SourceSerifPro-Regular.otf"); }

  /* ===== Page theme: black VHS look to match the game menu ===== */
  :root {
    --bg: #000;
    --line: #fff;
    --dim: #8a8a99;
    --accent: #5b16ec;
    --soul: #ff2a3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: #fff; overflow: hidden; }
  body {
    font-family: "Press Start 2P", monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }

  /* The game screen keeps its 4:3 shape and grows to fit the window */
  #frame {
    position: relative;
    border: 4px solid var(--line);
    box-shadow: 0 0 0 4px #000, 8px 8px 0 4px #1d1d2b;
    background: #000;
  }
  #stage { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }

  /* ===== Loading screen: Toy Eddy (the 3D model) turning around, with a bar under it ===== */
  #cover {
    position: absolute; inset: 0; z-index: 5;
    background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4%;
    transition: opacity .4s;
  }
  #cover.done { opacity: 0; pointer-events: none; }
  /* turntable.png is 16 frames side by side (200 x 260 each); steps() shows one at a time */
  #spinner {
    height: 46%; aspect-ratio: 200 / 260;
    background: url("assets/turntable.png") 0 0 / 1600% 100% no-repeat;
    animation: turn 1.6s steps(16) infinite;   /* one full turn every 1.6 seconds */
  }
  @keyframes turn { from { background-position-x: 0%; } to { background-position-x: 106.6667%; } }
  #barOuter { width: 46%; height: 16px; border: 3px solid #fff; padding: 2px; }
  #barInner { height: 100%; width: 0; background: #fff; transition: width .15s; }


  /* ===== Question box (left arrow: Golden Eddie's rate) ===== */
  #ask {
    position: absolute; left: 4%; right: 4%; bottom: 4%; z-index: 7;
    background: #000; border: 3px solid #fff; padding: 10px; display: flex; flex-direction: column; gap: 8px;
    font-family: "Share Tech Mono", monospace;
  }
  #ask[hidden] { display: none; }
  #askText { font-size: calc(var(--u) * 12); }
  #ask div { display: flex; gap: 8px; }
  #askInput { flex: 1; font: inherit; font-size: calc(var(--u) * 12); padding: 6px; background: #111; color: #fff; border: 2px solid #fff; }
  #ask button { font: inherit; font-size: calc(var(--u) * 11); background: #f7931e; color: #fff; border: 2px solid #fff; padding: 0 10px; cursor: pointer; }

  /* ===== Settings + Mods panels (sizes use --u = 1 game pixel) ===== */
  .panel {
    position: absolute; inset: 0; z-index: 6; background: #000; color: #fff;
    font-family: "Share Tech Mono", monospace; font-size: calc(var(--u) * 13);
    display: flex; flex-direction: column; padding: calc(var(--u) * 14) calc(var(--u) * 18);
    animation: fadeIn .35s;
  }
  .panel[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0; } }
  .panel button, .panel input { font: inherit; color: #fff; }
  .panel button { cursor: pointer; background: #000; border: calc(var(--u) * 2) solid #fff; padding: calc(var(--u) * 4) calc(var(--u) * 10); }
  .panel button:hover { background: #222; }
  .panel button:active { transform: translateY(calc(var(--u) * 1)); }
  .panel button:disabled { opacity: .4; cursor: wait; }

  /* debug mode box: see-through, clicks go right through it */
  #debug { position: absolute; left: calc(var(--u) * 4); top: calc(var(--u) * 4); z-index: 5; pointer-events: none;
    max-width: 46%; max-height: calc(100% - var(--u) * 8); overflow: hidden; padding: calc(var(--u) * 4) calc(var(--u) * 6);
    background: rgba(0,0,0,.6); color: #ccc; border: 1px solid #f7931e; border-radius: calc(var(--u) * 3);
    font: calc(var(--u) * 7) / 1.35 "Share Tech Mono", monospace; }
  #debug .head { color: #f7931e; letter-spacing: .15em; }
  #debug b { color: #fff; font-weight: normal; }
  #debug .vars { margin-top: calc(var(--u) * 3); }
  #debug .vars div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #debug .chg, #debug .chg b { color: #ffe14d; }
  #debug .warn { margin-top: calc(var(--u) * 2); color: #ff6b6b; }
  #debug .keys { margin-top: calc(var(--u) * 3); color: #888; }
  /* settings */
  #settingsPanel h2 { font-size: calc(var(--u) * 22); font-weight: normal; margin-bottom: calc(var(--u) * 16); }
  #settingsPanel .row { display: flex; align-items: center; gap: calc(var(--u) * 12); margin: calc(var(--u) * 9) 0 calc(var(--u) * 9) calc(var(--u) * 40); }
  #settingsPanel .label { width: calc(var(--u) * 110); font-size: calc(var(--u) * 15); }
  #settingsPanel .pair { display: flex; gap: calc(var(--u) * 8); }
  /* jumpscare buttons: orange when picked, gray when not (like the old pictures) */
  #settingsPanel .pick { min-width: calc(var(--u) * 70); font-family: "Sans Serif", sans-serif; font-size: calc(var(--u) * 16);
    background: #666; border-color: #666; padding: calc(var(--u) * 3) calc(var(--u) * 10); }
  #settingsPanel .pick:hover { border-color: #fff; background: #777; }
  #settingsPanel .pick.on { background: #f7931e; border-color: #f7931e; }
  #settingsPanel .pick.on:hover { border-color: #fff; }
  #settingsPanel input[type=range] { width: calc(var(--u) * 170); accent-color: #f7931e; }
  #settingsPanel .val { width: calc(var(--u) * 40); color: #aaa; }
  #settingsPanel .big { font-size: calc(var(--u) * 15); padding: calc(var(--u) * 4) calc(var(--u) * 22); }
  #settingsPanel .confirm { margin: auto auto 0; font-family: "Sans Serif", sans-serif; font-size: calc(var(--u) * 18);
    background: #666; border-color: #666; padding: calc(var(--u) * 4) calc(var(--u) * 26); }
  #settingsPanel .confirm:hover { border-color: #fff; }

  #settingsPanel .note { color: #888; font-size: calc(var(--u) * 9); }
  #settingsPanel .fileNow { color: #aaa; min-width: calc(var(--u) * 150); }
  #settingsPanel .small { font-size: calc(var(--u) * 12); padding: calc(var(--u) * 2) calc(var(--u) * 10); }

  /* save file screen */
  #filesPanel { align-items: center; justify-content: center; gap: calc(var(--u) * 14); }
  #filesPanel h2 { font-size: calc(var(--u) * 22); font-weight: normal; }
  #filesPanel .slots { display: flex; flex-direction: column; gap: calc(var(--u) * 10); width: 72%; }
  #filesPanel .slotWrap { display: flex; gap: calc(var(--u) * 8); }
  #filesPanel .slot { flex: 1; display: flex; justify-content: space-between; align-items: center;
    padding: calc(var(--u) * 10) calc(var(--u) * 14); font-size: calc(var(--u) * 15); border-width: calc(var(--u) * 3); }
  #filesPanel .slot:hover, #filesPanel .slot:focus { border-color: #f7931e; background: #1a1206; outline: none; }
  #filesPanel .slot.empty .fileInfo { color: #666; }
  #filesPanel .fileInfo { color: #f7931e; }
  #filesPanel .erase { font-size: calc(var(--u) * 10); color: #888; border-color: #444; }
  #filesPanel .erase:hover { color: #ff6b6b; border-color: #ff6b6b; background: #000; }
  #filesPanel .hint { color: #777; font-size: calc(var(--u) * 11); }

  /* ===== Achievements (Steam style) ===== */
  #toasts { position: absolute; right: calc(var(--u) * 6); bottom: calc(var(--u) * 6); z-index: 8; pointer-events: none;
    display: flex; flex-direction: column; gap: calc(var(--u) * 4); overflow: hidden; }
  .toast { display: flex; align-items: center; gap: calc(var(--u) * 7); width: calc(var(--u) * 150); padding: calc(var(--u) * 6);
    background: linear-gradient(to bottom, #2a3f5a, #1b2838); border: 1px solid #3d5a7a; box-shadow: 0 calc(var(--u) * 3) calc(var(--u) * 10) rgba(0,0,0,.6);
    font-family: "Sans Serif", sans-serif; transform: translateY(130%); opacity: 0; transition: transform .45s ease, opacity .45s ease; }
  .toast.in { transform: none; opacity: 1; }
  .toastTitle { color: #fff; font-size: calc(var(--u) * 7.5); }
  .toastName { color: #8f98a0; font-size: calc(var(--u) * 7); margin-top: calc(var(--u) * 1.5); }
  .achIcon { flex: none; width: calc(var(--u) * 28); height: calc(var(--u) * 28); display: grid; place-items: center;
    color: #fff; font: 600 calc(var(--u) * 13) "Sans Serif", sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,.6);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
  .achIcon.locked { filter: grayscale(1) brightness(.45); }
  #achPanel { background: #1b2838; font-family: "Sans Serif", sans-serif; gap: calc(var(--u) * 6); }
  .achTop { display: flex; align-items: center; gap: calc(var(--u) * 10); }
  .achTop h2 { font-weight: normal; font-size: calc(var(--u) * 16); }
  .achTop button { font-family: "Share Tech Mono", monospace; font-size: calc(var(--u) * 10); background: transparent; border-color: #3d5a7a; }
  .achCount { margin-left: auto; color: #8f98a0; font-size: calc(var(--u) * 9); }
  .achBar { height: calc(var(--u) * 4); background: #0e1621; }
  .achFill { height: 100%; background: linear-gradient(to right, #5c7e10, #a4d007); }
  .achList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: calc(var(--u) * 3); padding-right: calc(var(--u) * 3); }
  .achRow { display: flex; align-items: center; gap: calc(var(--u) * 8); padding: calc(var(--u) * 5); background: #233246; }
  .achRow.locked { background: #18222f; }
  .achText { flex: 1; min-width: 0; }
  .achName { font-size: calc(var(--u) * 9); color: #fff; }
  .achRow.locked .achName { color: #8f98a0; }
  .achDesc { font-size: calc(var(--u) * 7.5); color: #8f98a0; margin-top: calc(var(--u) * 1); }
  .achDate { font-size: calc(var(--u) * 7); color: #8f98a0; white-space: nowrap; }

  /* mods */
  #modsPanel { gap: calc(var(--u) * 7); }
  .modsTop { display: flex; align-items: center; gap: calc(var(--u) * 10); }
  .modsTop h2 { font-size: calc(var(--u) * 20); font-weight: normal; }
  .tabs { display: flex; gap: calc(var(--u) * 6); margin-left: auto; }
  .tabs button.on { background: #fff; color: #000; }
  .pane { border: calc(var(--u) * 2) solid #444; padding: calc(var(--u) * 6) calc(var(--u) * 8); display: flex; flex-wrap: wrap; gap: calc(var(--u) * 6); align-items: center; }
  .pane[hidden] { display: none; }
  .pane .hint { color: #999; font-size: calc(var(--u) * 11); width: 100%; }
  #ghInput { flex: 1; min-width: 0; background: #111; border: calc(var(--u) * 2) solid #fff; padding: calc(var(--u) * 4) calc(var(--u) * 6); }
  #modStatus { min-height: calc(var(--u) * 15); font-size: calc(var(--u) * 11); color: #9f9; }
  #modStatus.bad { color: #ff6b6b; }
  .lists { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 10); min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col h3 { font-weight: normal; font-size: calc(var(--u) * 13); margin-bottom: calc(var(--u) * 4); }
  .col h3 small { color: #999; font-size: calc(var(--u) * 10); }
  .list { flex: 1; overflow-y: auto; border: calc(var(--u) * 2) solid #fff; padding: calc(var(--u) * 5); }
  #modsInUse { border-color: #f7931e; }
  .mod { position: relative; border: calc(var(--u) * 2) solid #666; padding: calc(var(--u) * 4) calc(var(--u) * 22) calc(var(--u) * 4) calc(var(--u) * 6);
    margin-bottom: calc(var(--u) * 5); background: #111; cursor: grab; touch-action: none; user-select: none; }
  .mod:hover { border-color: #fff; }
  .modName { font-size: calc(var(--u) * 13); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .modInfo { font-size: calc(var(--u) * 10); color: #999; }
  .mod .del { position: absolute; right: calc(var(--u) * 3); top: calc(var(--u) * 3); border: none; padding: 0 calc(var(--u) * 4); font-size: calc(var(--u) * 14); color: #999; background: none; }
  .mod .del:hover { color: #ff6b6b; background: none; }
  .mod.dragging { opacity: .3; }
  .mod.ghost { position: fixed; z-index: 99; pointer-events: none; opacity: .9; border-color: #fff; font-family: "Share Tech Mono", monospace; color: #fff; }
  .dropMark { height: calc(var(--u) * 3); background: #f7931e; margin-bottom: calc(var(--u) * 5); }
  .empty { color: #666; font-size: calc(var(--u) * 11); text-align: center; padding: calc(var(--u) * 14) 0; }
  #reloadNote { position: absolute; inset: 0; z-index: 7; background: #000; display: flex; align-items: center; justify-content: center; }
  #reloadNote[hidden] { display: none; }
</style>
</head>
<body>

<div id="frame">
  <canvas id="stage" tabindex="0"></canvas>

  <!-- Loading screen: spinning rice bowl + loading bar -->
  <div id="cover">
    <div id="spinner"></div>
    <div id="barOuter"><div id="barInner"></div></div>
  </div>


  <!-- Debug mode box (turn it on in Settings) -->
  <div id="debug" hidden></div>

  <!-- Achievement pop-ups (bottom right) and the achievements list -->
  <div id="toasts"></div>
  <div id="achPanel" class="panel" hidden></div>

  <!-- Save file screen (when the address has no ?file=1, 2 or 3) -->
  <div id="filesPanel" class="panel" hidden></div>

  <!-- Settings screen (opens when the Settings button is clicked) -->
  <div id="settingsPanel" class="panel" hidden></div>

  <!-- Mods screen -->
  <div id="modsPanel" class="panel" hidden>
    <div class="modsTop">
      <button id="modsBack">&lt; BACK</button>
      <h2>MODS</h2>
      <div class="tabs">
        <button id="tabUnpacked">LOAD UNPACKED</button>
        <button id="tabPacked">LOAD PACKED</button>
      </div>
    </div>
    <div class="pane" id="paneUnpacked">
      <button id="pickFolder">PICK MOD FOLDER</button>
      <button id="pickZip">PICK .ZIP</button>
      <button id="tplBtn" style="margin-left:auto">DOWNLOAD TEMPLATE</button>
      <div class="hint">Pick a mod folder from your computer. New to modding? Download the template, change some files, then pick that folder.</div>
      <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
      <input type="file" id="zipInput" accept=".zip" hidden>
    </div>
    <div class="pane" id="panePacked" hidden>
      <input id="ghInput" placeholder="github.com/user/repo" autocomplete="off" spellcheck="false">
      <button id="ghLoad">LOAD</button>
      <div class="hint">Loads a mod straight from a public GitHub repo (it needs a manifest.json).</div>
    </div>
    <div id="modStatus"></div>
    <div class="lists">
      <div class="col"><h3>DOWNLOADED <small>(not in use)</small></h3><div class="list" id="modsDownloaded"></div></div>
      <div class="col"><h3>IN USE <small>(top one wins)</small></h3><div class="list" id="modsInUse"></div></div>
    </div>
  </div>
  <div id="reloadNote" hidden></div>

  <!-- Question box (left arrow on the title: how rare Golden Eddie is) -->
  <form id="ask" hidden>
    <div id="askText"></div>
    <div><input id="askInput" autocomplete="off" inputmode="numeric"><button type="submit">OK</button></div>
  </form>

</div>

<script>

/* =====================================================================
   WORDS ON PICTURES
   Real text drawn on top of some pictures (menus, clock, camera buttons,
   the secret song lyrics...). Mods can change any of it in texts.json.
   box: the picture's [width, height, pin x, pin y]; each word has its
   font, color and where it sits in the picture. Made by tools/flatten.py.
   ===================================================================== */
"use strict";

const PICTURE_WORDS = {
};


/* =====================================================================
   PICTURES
   Loads every picture and draws it on the game screen.

   The game screen is 480 x 360 "game pixels" (it is scaled up to fit
   the window). (0, 0) is the TOP-LEFT corner, x goes right, y goes down.

   Every picture is a plain image file:
       assets/img/<group>/<name>.webp
   (names in lower case with dashes, see fileName). Each image is 2 image
   pixels per game pixel, and its middle is its "pin": the point that goes
   on the spot you draw it at. names.js lists which pictures exist.
   Some pictures also have real words drawn on top (words.js), so mods can
   change them in texts.json.
   ===================================================================== */
"use strict";

const VIEW_W = 480, VIEW_H = 360;
const IMG_SCALE = 2;                  // image pixels per game pixel

// "Show Stage" -> "show-stage" (how names become file names)
function fileName(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "x";
}
const picturePath = (group, name) => `img/${fileName(group)}/${fileName(name)}.webp`;

// Files a mod replaces: asset path -> its own file (see applyMods in ui.js)
const MOD_FILES = {};
const assetUrl = path => MOD_FILES[path] || "assets/" + path;

/* ---------------------------------------------------------------------
   Loading files
   --------------------------------------------------------------------- */
const Files = {
  images: new Map(),   // asset path -> <img>
  sizes: new Map(),    // asset path -> the game's own [width, height] (only for pictures a mod replaced)

  image(path) { return this.images.get(path); },

  // Loads every picture and sound, reporting progress from 0 to 1
  async loadAll(imagePaths, soundPaths, onProgress) {
    const total = imagePaths.length + soundPaths.length;
    let done = 0;
    const tick = () => onProgress(++done / total);
    const loadOne = url => new Promise(res => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => { console.warn("Missing image", url); res(null); };
      img.src = url;
    });
    const loadImage = async path => {
      const img = await loadOne(assetUrl(path));
      if (img) this.images.set(path, img);
      // a mod's picture may be any size: remember the game's own size so it fills the same spot
      if (MOD_FILES[path]) {
        const own = await loadOne("assets/" + path);
        if (own) this.sizes.set(path, [own.naturalWidth, own.naturalHeight]);
      }
      tick();
    };
    const loadSound = async path => {
      try { await Sound.load(path); } catch (e) { console.warn("Missing sound", path, e); }
      tick();
    };
    // a few files at a time so the browser stays responsive
    const queue = [...imagePaths.map(u => () => loadImage(u)), ...soundPaths.map(u => () => loadSound(u))];
    const workers = Array.from({ length: 8 }, async () => { while (queue.length) await queue.shift()(); });
    await Promise.all(workers);
  }
};

// Every picture file (for the loading bar and the mod template)
function allImagePaths() {
  const out = [];
  for (const [group, names] of Object.entries(PICTURE_NAMES)) for (const n of names) out.push(picturePath(group, n));
  return out;
}

/* ---------------------------------------------------------------------
   Finding pictures
   A picture: its image (img, iw x ih game pixels, pin in the middle) and
   its box (w, h, pin cx, cy) that hit tests and words use.
   --------------------------------------------------------------------- */
const pictureCache = new Map();
function hasPic(group, name) { return !!(PICTURE_NAMES[group] && PICTURE_NAMES[group].includes(name)); }
function pic(group, name) {
  const key = group + "/" + name;
  if (pictureCache.has(key)) return pictureCache.get(key);
  if (!hasPic(group, name)) { console.warn("No picture", group, name); return undefined; }
  const path = picturePath(group, name), img = Files.image(path);
  const [nw, nh] = Files.sizes.get(path) || (img ? [img.naturalWidth, img.naturalHeight] : [0, 0]);
  const iw = nw / IMG_SCALE, ih = nh / IMG_SCALE;
  const words = typeof PICTURE_WORDS !== "undefined" ? PICTURE_WORDS[key] : undefined;
  const [w, h, cx, cy] = words ? words.box : [iw, ih, iw / 2, ih / 2];
  const p = { img, iw, ih, w, h, cx, cy, words: words ? words.words : null,
              pixel: group === "Pixel",                         // 8-bit pictures stay blocky
              spin: group.toLowerCase() === "loading" };         // the spinning rice bowl
  pictureCache.set(key, p);
  return p;
}
// The n-th picture of a group (1 = first), for random picks and number names
function picAt(group, n) {
  const list = PICTURE_NAMES[group];
  const i = ((Math.round(n) - 1) % list.length + list.length) % list.length;
  return pic(group, list[i]);
}

/* ---------------------------------------------------------------------
   Words
   Mods can change any word with texts.json (old text -> new text).
   --------------------------------------------------------------------- */
let TEXTS = {};
const inkCache = new Map();

// The size of the actual letters (not the line box) at 100px
function measureInk(ctx, text, font) {
  const key = font + "|" + text;
  if (!inkCache.has(key)) {
    ctx.font = `100px "${font}"`;
    const m = ctx.measureText(text);
    inkCache.set(key, {
      left: -m.actualBoundingBoxLeft, top: -m.actualBoundingBoxAscent,
      w: m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
      h: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent
    });
  }
  return inkCache.get(key);
}

function drawText(ctx, L) {
  const shown = TEXTS[L.text] !== undefined ? String(TEXTS[L.text]) : L.text;
  ctx.save();
  ctx.fillStyle = L.color;
  ctx.textBaseline = "alphabetic";
  if (L.tm) {
    // text exactly as it sat in the original drawing (can be turned and stretched)
    ctx.transform(...L.tm);
    ctx.font = `${L.size}px "${L.font}"`;
    ctx.fillText(shown, L.pos[0], L.pos[1]);
  } else if (L.at) {
    // [left x, baseline y, font size]
    ctx.font = `${L.at[2]}px "${L.font}"`;
    ctx.fillText(shown, L.at[0], L.at[1]);
  } else {
    const [x, y, w, h] = L.box;
    const orig = measureInk(ctx, L.text, L.font);
    if (orig.w > 0 && orig.h > 0) {
      ctx.font = `100px "${L.font}"`;
      if (shown === L.text && !L.like) {
        // stretch the letters so they fill the box exactly where the old picture had them
        ctx.translate(x, y);
        ctx.scale(w / orig.w, h / orig.h);
        ctx.fillText(L.text, -orig.left, -orig.top);
      } else {
        // changed text (or text sized like another word): keep the letter size, let the width change
        let k = h / orig.h;
        if (L.like) k = L.like[1] / measureInk(ctx, L.like[0], L.font).h;
        const ink = measureInk(ctx, shown, L.font);
        const baseline = L.like ? y + h : y - orig.top * k;
        let left = x;
        if (L.align === "center") left = x + w / 2 - ink.w * k / 2;
        if (L.align === "right") left = x + w - ink.w * k;
        ctx.translate(left - ink.left * k, baseline);
        ctx.scale(k, k);
        ctx.fillText(shown, 0, 0);
      }
    }
  }
  ctx.restore();
}

/* ---------------------------------------------------------------------
   Painting one picture (in picture units, top-left of its box = 0,0)
   --------------------------------------------------------------------- */
function paintPicture(ctx, p) {
  if (p.img) ctx.drawImage(p.img, p.cx - p.iw / 2, p.cy - p.ih / 2, p.iw, p.ih);
  if (p.words) for (const L of p.words) drawText(ctx, L);
}

/* ---------------------------------------------------------------------
   draw(ctx, picture, x, y, options)
   Puts the picture's pin on screen spot (x, y).
   options: size (percent, 100 = normal), alpha (0-1),
            bright (-100 darker .. 100 lighter), turn (degrees)
   --------------------------------------------------------------------- */
function draw(ctx, p, x, y, o = {}) {
  if (!p) return;
  const alpha = o.alpha === undefined ? 1 : o.alpha;
  if (alpha <= 0) return;
  const k = (o.size || 100) / 100;
  ctx.save();
  ctx.translate(x, y);
  if (o.turn) ctx.rotate(o.turn * Math.PI / 180);
  ctx.scale(k, k);
  if (p.spin) {
    // a flat picture spinning in 3D (the rice bowl): squeeze it sideways over time
    ctx.scale(Math.cos(performance.now() / 2400 * Math.PI * 2), 1);
  }
  ctx.translate(-p.cx, -p.cy);
  if (p.pixel) ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha *= alpha;
  if (o.bright) ctx.filter = `brightness(${Math.max(0, 1 + o.bright / 100)})`;
  paintPicture(ctx, p);
  ctx.restore();
}

/* ---------------------------------------------------------------------
   Hit testing: is a screen point on a visible pixel of a picture?
   Each picture gets a small see-through map the first time it is asked.
   --------------------------------------------------------------------- */
function pictureMask(p) {
  if (p._mask !== undefined) return p._mask;
  const w = Math.max(1, Math.ceil(p.w)), h = Math.max(1, Math.ceil(p.h));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  paintPicture(g, p);
  let data = null;
  try { data = g.getImageData(0, 0, w, h).data; } catch (e) { /* opened from a file: treat as solid */ }
  const alpha = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) alpha[i] = data ? data[i * 4 + 3] : 255;
  p._mask = { w, h, alpha };
  return p._mask;
}

// Was screen point (px, py) on the picture drawn at (x, y) with this size?
function hits(p, x, y, size, px, py) {
  if (!p) return false;
  const k = (size || 100) / 100;
  const u = Math.floor((px - x) / k + p.cx), v = Math.floor((py - y) / k + p.cy);
  const m = pictureMask(p);
  if (u < 0 || v < 0 || u >= m.w || v >= m.h) return false;
  return m.alpha[v * m.w + u] > 0;
}

// Was screen point (px, py) inside the picture's box (good for words)?
function inBox(p, x, y, size, px, py, pad = 0) {
  if (!p) return false;
  const k = (size || 100) / 100;
  const u = (px - x) / k + p.cx, v = (py - y) / k + p.cy;
  return u >= -pad && v >= -pad && u <= p.w + pad && v <= p.h + pad;
}

/* ---------------------------------------------------------------------
   Smooth movement
   The game updates 30 times a second, but screens refresh 60+ times.
   Values that move (panning, fading, shaking) are remembered from the
   last update, and the screen draws them part of the way between the
   old and new value, so motion looks smooth instead of steppy.
   --------------------------------------------------------------------- */
class Smooth {
  constructor() { this.now = {}; this.before = {}; }
  set(key, v) { this.now[key] = v; if (!(key in this.before)) this.before[key] = v; }
  jump(key, v) { this.now[key] = v; this.before[key] = v; }      // move instantly (no blending)
  get(key) { return this.now[key]; }
  snapshot() { Object.assign(this.before, this.now); }          // called at the start of every update
  // the value to draw: `a` is how far we are between the last update (0) and the next (1)
  at(key, a, maxJump = Infinity) {
    const v = this.now[key], b = this.before[key];
    if (b === undefined || Math.abs(v - b) > maxJump) return v;
    return b + (v - b) * a;
  }
}


/* =====================================================================
   SOUND
   Every sound is a plain file, assets/snd/<group>/<name>.mp3, looked up
   by group and name, for example speaker.play("office", "Buzz_Fan_Florescent2").
   names.js lists which sounds exist and which ones are music.

   Sounds go through a "speaker". A speaker has its own volume
   (0-100), like a radio you can turn up and down while it plays.
   Speakers feed two volume knobs from the Settings screen:
     music  (songs and jingles)
     sound  (everything else)
   ===================================================================== */
"use strict";

const Sound = {
  ctx: new (window.AudioContext || window.webkitAudioContext)(),
  buffers: new Map(),       // url -> decoded sound
  speakers: [],

  // where a sound's file is (null if there is no such sound)
  path(group, name) {
    return SOUND_NAMES[group] && SOUND_NAMES[group].includes(name) ? `snd/${fileName(group)}/${fileName(name)}.mp3` : null;
  },
  // every sound file (for the loading bar and the mod template)
  allPaths() {
    const out = [];
    for (const [group, names] of Object.entries(SOUND_NAMES)) for (const n of names) out.push(this.path(group, n));
    return out;
  },

  async load(path) {
    const data = await (await fetch(assetUrl(path))).arrayBuffer();
    this.buffers.set(path, await this.ctx.decodeAudioData(data));
  },

  // A speaker for one thing in the game (the phone, the fan, the kitchen...)
  speaker(volume = 100) {
    const s = new Speaker(volume);
    this.speakers.push(s);
    return s;
  },

  // Silence everything (the game's "stop all sounds")
  stopAll() { for (const s of this.speakers) s.stopAll(); }
};

// The two volume knobs (the Settings sliders change these)
Sound.master = Sound.ctx.createGain();
Sound.master.connect(Sound.ctx.destination);
Sound.musicBus = Sound.ctx.createGain();
Sound.sfxBus = Sound.ctx.createGain();
Sound.musicBus.connect(Sound.master);
Sound.sfxBus.connect(Sound.master);

class Speaker {
  constructor(volume) {
    // one volume node for music and one for sounds, so each still follows its own knob
    this.music = Sound.ctx.createGain();
    this.sfx = Sound.ctx.createGain();
    this.music.connect(Sound.musicBus);
    this.sfx.connect(Sound.sfxBus);
    this.playing = new Map();     // sound name -> what is playing
    this.setVolume(volume);
  }

  setVolume(v) {
    this.volume = Math.max(0, Math.min(100, v));
    this.music.gain.value = this.sfx.gain.value = this.volume / 100;
  }

  /* Play a sound. Starting a sound that is already playing on this
     speaker starts it over. Options: loop (repeat forever).
     Returns a handle: handle.done turns true when it finishes. */
  play(group, name, o = {}) {
    const path = Sound.path(group, name);
    const buffer = path && Sound.buffers.get(path);
    const handle = { done: true, stop() {} };
    if (!buffer) { if (!path) console.warn("No sound", group, name); return handle; }
    this.stop(name);
    const src = Sound.ctx.createBufferSource();
    src.buffer = buffer;
    src.loop = !!o.loop;
    const gain = Sound.ctx.createGain();          // this sound's own volume (for fading out)
    src.connect(gain).connect(MUSIC_NAMES.has(name) ? this.music : this.sfx);
    handle.done = false;
    handle.stop = () => { try { src.stop(); } catch (e) {} handle.done = true; };
    // fade to silence over `secs` seconds, then stop
    handle.fadeOut = secs => {
      const t = Sound.ctx.currentTime;
      gain.gain.setValueAtTime(gain.gain.value, t);
      gain.gain.linearRampToValueAtTime(0, t + secs);
      try { src.stop(t + secs); } catch (e) {}
    };
    src.onended = () => { handle.done = true; if (this.playing.get(name) === handle) this.playing.delete(name); };
    src.start();
    this.playing.set(name, handle);
    return handle;
  }

  isPlaying(name) { const h = this.playing.get(name); return !!h && !h.done; }
  stop(name) { const h = this.playing.get(name); if (h) { h.stop(); this.playing.delete(name); } }
  stopAll() { for (const h of this.playing.values()) h.stop(); this.playing.clear(); }
}

// Play a sound on a speaker only if it is not already playing (for sounds that loop back to back)
function keepPlaying(speaker, group, name) {
  if (!speaker.isPlaying(name)) speaker.play(group, name);
}


/* =====================================================================
   FRIED RICE AT EDDIE'S 2 (Tape 2)
   The whole game, written as a normal browser game:
     - update() runs 30 times a second and moves the game forward
     - render() draws the current screen (as often as the screen allows)
     - "screens" (title, night, custom...) decide what is shown

   How a night works (like FNaF 2):
     - there are no doors. You have a MASK, a FLASHLIGHT and the CAMERAS
     - characters walk from camera to camera, then come down the hall or
       crawl through the two air vents into the office
     - when someone is in the office, put the mask on right away
     - Withered Endo (in the hall) only leaves if you flash the light at him
     - the music box (camera 11) must be wound up or the Puppet comes
     - the flashlight runs on a battery; when it is empty you are in trouble

   Positions use Scratch's stage spots (x right, y UP, 0,0 = middle),
   because every picture came from the Scratch project. S(x, y) turns
   them into canvas spots on the 480 x 360 game screen.
   ===================================================================== */
"use strict";

const TICK = 1 / 30;                  // seconds per update
const TICK_MS = 1000 / 30;

/* ---------------------------------------------------------------------
   Small helpers
   --------------------------------------------------------------------- */
const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));    // whole number lo..hi
const randFloat = (lo, hi) => lo + Math.random() * (hi - lo);
const chance = n => rand(1, n) === 1;                                      // "1 in n"
const pick = list => list[Math.floor(Math.random() * list.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const SX = x => 240 + x;              // Scratch x -> screen x
const SY = y => 180 - y;              // Scratch y -> screen y

// A word the game shows. Mods can change it in texts.json ("group" is just
// where it is listed in texts.json). The build collects every W("...", "...").
const W = (group, s) => (TEXTS[s] !== undefined ? String(TEXTS[s]) : s);

/* ---------------------------------------------------------------------
   Scripts: tiny step-by-step sequences (same as Tape 1)
     yield 2          wait 2 seconds
     yield            wait one update
     yield () => x    wait until x is true
   --------------------------------------------------------------------- */
class Scripts {
  constructor() { this.list = []; }
  run(tag, gen) { const s = { tag, gen, wait: 0, until: null }; this.list.push(s); return s; }
  stop(...tags) { this.list = this.list.filter(s => !tags.includes(s.tag)); }
  stopAll() { this.list = []; }
  has(tag) { return this.list.some(s => s.tag === tag); }
  update() {
    for (const s of [...this.list]) {
      if (!this.list.includes(s)) continue;
      if (s.wait > 0) { s.wait -= TICK; if (s.wait > 1e-9) continue; }
      if (s.until && !s.until()) continue;
      s.until = null;
      const r = s.gen.next();
      if (!this.list.includes(s)) continue;
      if (r.done) { this.list.splice(this.list.indexOf(s), 1); continue; }
      if (typeof r.value === "number") s.wait = r.value;
      else if (typeof r.value === "function") s.until = r.value;
    }
  }
}

/* ---------------------------------------------------------------------
   The cast. Every character has an id the code uses, and a name the
   player sees (mods can rename them in texts.json).
   --------------------------------------------------------------------- */
const CAST = {
  tfreddy: { name: W("Characters", "Toy Eddy") },
  tbonnie: { name: W("Characters", "Toy Weddy") },
  tchica:  { name: W("Characters", "Toy Cheddy") },

/* ---------------------------------------------------------------------
   Save files (3 of them). The page address picks one: 2/?file=2
   Kept in this browser as "frae2-save-file2".
   beat5 / beat6 / beat420 are the three stars (same names as Tape 1 so
   the game menu can show them).
   --------------------------------------------------------------------- */
const SAVE_FILES = 3;
const saveKey = file => "frae2-save-file" + file;

function fileFromUrl() {
  const f = Number(new URLSearchParams(location.search).get("file"));
  return Number.isInteger(f) && f >= 1 && f <= SAVE_FILES ? f : null;
}
function loadProgress(file) {
  const p = { night: 1, beat5: false, beat6: false, beat420: false, started: false,
              prizes: [], achievements: {}, caughtBy: [], custom: null };
  try {
    const raw = localStorage.getItem(saveKey(file));
    if (raw) {
      const s = JSON.parse(raw);
      p.night = Number(s.night) || 1;
      p.beat5 = !!s.beat5; p.beat6 = !!s.beat6; p.beat420 = !!s.beat420;
      p.prizes = Array.isArray(s.prizes) ? s.prizes : [];
      p.achievements = (s.achievements && typeof s.achievements === "object") ? s.achievements : {};
      p.caughtBy = Array.isArray(s.caughtBy) ? s.caughtBy : [];
      p.custom = Array.isArray(s.custom) ? s.custom : null;
      p.started = true;
    }
  } catch (e) { /* storage blocked: play without saving */ }
  return p;
}
function saveProgress(file, p) {
  try {
    localStorage.setItem(saveKey(file), JSON.stringify({ night: p.night, beat5: p.beat5, beat6: p.beat6, beat420: p.beat420,
      prizes: p.prizes, achievements: p.achievements, caughtBy: p.caughtBy, custom: p.custom }));
  } catch (e) {}
}
function eraseProgress(file) { try { localStorage.removeItem(saveKey(file)); } catch (e) {} }

/* =====================================================================
   THE GAME
   ===================================================================== */
class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.scripts = new Scripts();
    this.smooth = new Smooth();
    this.file = 1;
    this.progress = loadProgress(1);
    this.mouse = { x: 240, y: 180, down: false };
    this.clicks = [];
    this.keys = [];
    this.held = new Set();          // keys being held down (flashlight, vent lights)
    this.goldenRate = 1000;         // 1 in this many monitor flips can bring Golden Eddie (left arrow changes it)
    this.paused = false;
    this.makeSpeakers();
    this.screen = "black";
    this.layers = [];
    this.tick = 0;
  }

  makeSpeakers() {
    const sp = v => Sound.speaker(v);
    this.sp = {
      music: sp(100), blip: sp(60), fan: sp(25), amb: sp(40), buzz: sp(0), vent: sp(0), flip: sp(100),
      camHum: sp(0), camBlip: sp(60), mask: sp(100), breath: sp(0), steps: sp(30), bb: sp(80), radio: sp(0),
      musicbox: sp(0), windup: sp(70), jack: sp(0), scream: sp(100), stat: sp(100), phone: sp(100),
      chime: sp(100), honk: sp(100), mini: sp(80), flicker: sp(100),
    };
  }

  /* ---------------------------------------------------------------
     Main loop pieces
     --------------------------------------------------------------- */
  update() {
    this.smooth.snapshot();
    this.tick++;
    if (!this.paused) {
      this.scripts.update();
      if (this.screen === "title") this.updateTitle();
      else if (this.screen === "custom") this.updateCustom();
      else if (this.screen === "night") this.updateNight();
      else if (this.screen === "mini") this.updateMini();
      else if (this.screen === "card") this.updateCard();
    }
    this.clicks.length = 0;
    this.keys.length = 0;
  }

  render(a) {
    const ctx = this.ctx, k = this.canvas.width / VIEW_W;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    if (this.screen === "title") this.drawTitle(ctx, a);
    else if (this.screen === "custom") this.drawCustom(ctx, a);
    else if (this.screen === "night") this.drawNight(ctx, a);
    else if (this.screen === "mini") this.drawMini(ctx, a);
    for (const L of this.layers) L.draw(ctx, a);
  }

  go(screen) {
    this.scripts.stopAll();
    this.layers = [];
    this.screen = screen;
  }

  // A layer on top of everything: a picture, or any drawing function, with its own fade
  overlay(group, name, o = {}) {
    const L = {
      pic: group ? pic(group, name) : null, x: o.x ?? 240, y: o.y ?? 180, size: o.size || 100, fade: o.fade ?? 1,
      key: "ov" + Math.random(), paint: o.paint,
      draw: (ctx, a) => {
        const f = this.smooth.at(L.key, a);
        if (L.paint) { ctx.save(); ctx.globalAlpha *= f; L.paint(ctx, a); ctx.restore(); }
        else draw(ctx, L.pic, L.x, L.y, { size: L.size, alpha: f });
      },
      setFade: f => { L.fade = f; this.smooth.set(L.key, f); },
    };
    this.smooth.jump(L.key, L.fade);
    this.layers.push(L);
    return L;
  }
  removeOverlay(L) { this.layers = this.layers.filter(x => x !== L); }
  *fade(L, to, steps = 40) {
    const from = L.fade;
    for (let i = 1; i <= steps; i++) { L.setFade(from + (to - from) * i / steps); yield; }
  }

  /* ---------------------------------------------------------------
     Input (called by the page)
     --------------------------------------------------------------- */
  pointer(x, y, down) {
    this.mouse.x = x; this.mouse.y = y;
    if (down === true && !this.mouse.down) this.clicks.push({ x, y });
    if (down !== undefined) this.mouse.down = down;
  }
  key(k) { this.keys.push(k); }
  hold(k, on) { if (on) this.held.add(k); else this.held.delete(k); }

  // Text helper: draws words with a font, size and color
  text(ctx, s, x, y, o = {}) {
    ctx.save();
    ctx.font = `${o.weight || ""} ${o.size || 10}px "${o.font || "Share Tech Mono"}"`;
    ctx.fillStyle = o.color || "#fff";
    ctx.textAlign = o.align || "left";
    ctx.textBaseline = o.base || "alphabetic";
    if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
    if (o.shadow) { ctx.shadowColor = o.shadow; ctx.shadowBlur = 3; }
    ctx.fillText(s, x, y, o.max);
    ctx.restore();
  }

  // TV static on top of a picture (strength 0-1)
  drawStatic(ctx, strength) {
    if (strength <= 0) return;
    draw(ctx, picAt("Sprite28", rand(1, 4)), 240, 180, { size: 100, alpha: strength });
  }

  /* =================================================================
     TITLE SCREEN
     ================================================================= */
  useFile(file) { this.file = file; this.progress = loadProgress(file); }
  save() { if (!settings.debug) saveProgress(this.file, this.progress); }

  boot() { this.showTitle(); }

  menuItems() {
    const items = [
      { id: "new",      label: W("Title menu", "New Game"),   show: true },
      { id: "continue", label: W("Title menu", "Continue"),   show: true },
      { id: "night6",   label: W("Title menu", "6th Night"),  show: this.progress.beat5 },
      { id: "custom",   label: W("Title menu", "It's still dark."), show: true },
    ].filter(i => i.show);
    items.forEach((it, i) => { it.x = 46; it.y = 222 + i * 26; });
    return items;
  }

  showTitle() {
    this.go("title");
    Sound.stopAll();
    this.sp.music.setVolume(100);
    this.sp.music.play("Title", "title", { loop: true });
    this.level = this.progress.night;
    this.selected = this.progress.beat6 ? "custom" : this.progress.beat5 ? "night6" : this.level === 1 ? "new" : "continue";
    this.hovered = null;
    this.face = 1;
    this.titleFlash = 0;
    this.smooth.jump("titleFade", 0);
    this.scripts.run("title", function* () {
      for (let i = 1; i <= 30; i++) { this.smooth.set("titleFade", i / 30); yield; }
    }.call(this));
    // the faces behind the menu twitch now and then (like FNaF 2's title)
    this.scripts.run("title", function* () {
      for (;;) {
        this.face = 1;
        yield randFloat(1.5, 5);
        this.face = rand(2, 4);
        this.titleFlash = 1;
        yield randFloat(0.05, 0.25);
      }
    }.call(this));
  }

  updateTitle() {
    const m = this.mouse, items = this.menuItems();
    this.titleFlash = Math.max(0, this.titleFlash - 0.08);
    const over = items.find(i => m.x > i.x - 24 && m.x < i.x + 190 && m.y > i.y - 18 && m.y < i.y + 6);
    if (over && over.id !== this.hovered) { this.blip(); this.selected = over.id; }
    this.hovered = over ? over.id : null;
    const sHover = m.x < 110 && m.y > 330;
    const aHover = m.x > 330 && m.y > 330;
    if ((sHover && !this.settingsHover) || (aHover && !this.achHover)) this.blip();
    this.settingsHover = sHover; this.achHover = aHover;
    for (const c of this.clicks) {
      if (aHover) { openAchievements(); return; }
      if (sHover) { openSettings(); return; }
      if (over) { this.choose(over.id); return; }
    }
    for (const k of this.keys) {
      const i = items.findIndex(it => it.id === this.selected);
      if (k === "up" || k === "down") {
        this.selected = items[(i + (k === "up" ? -1 : 1) + items.length) % items.length].id;
        this.blip();
      } else if (k === "enter") { this.choose(this.selected); return; }
    }
  }
  blip() { this.sp.blip.play("Sprite10", "COMPUTER_DIGITAL_L2076605"); }

  choose(id) {
    if (id === "new") {
      this.level = 1;
      this.progress.night = 1;
      this.died = false;
      return this.newspaper();
    }
    if (id === "continue") return this.startIntro();
    if (id === "night6") { this.level = 6; return this.startIntro(); }
    if (id === "custom") return this.showCustom();
  }

  drawTitle(ctx, a) {
    const f = this.smooth.at("titleFade", a);
    ctx.save();
    ctx.globalAlpha = f;
    // faces on the right, a little static, then the words
    draw(ctx, picAt("Title", this.face), 240, 180);
    this.drawStatic(ctx, 0.12 + this.titleFlash * 0.4);
    const title = [W("Title menu", "Fried"), W("Title menu", "Rice"), W("Title menu", "at"), W("Title menu", "Eddie's"), W("Title menu", "2")];
    title.forEach((s, i) => this.text(ctx, s, 22, 46 + i * 27, { size: 27 }));
    // stars (nights 5 and 6 beaten, and the 20/20/20/20 night)
    const stars = [this.progress.beat5, this.progress.beat6, this.progress.beat420].filter(Boolean).length;
    for (let i = 0; i < stars; i++) draw(ctx, pic("Sprite29", "Gold_Star"), 34 + i * 26, 192, { size: 22 });
    for (const it of this.menuItems()) {
      this.text(ctx, it.label, it.x, it.y, { size: 17 });
      if (it.id === this.selected) this.text(ctx, ">>", it.x - 26, it.y, { size: 17 });
      if (it.id === "continue" && this.selected === "continue")
        this.text(ctx, W("Title menu", "Night") + " " + Math.min(5, this.level), it.x + 1, it.y + 12, { size: 9, color: "#bbb" });
    }
    this.text(ctx, W("Settings", "Settings"), 14, 350, { size: 11, color: this.settingsHover ? "#f7931e" : "#fff" });
    const got = ACHIEVEMENTS.filter(x => this.progress.achievements[x.id]).length;
    this.text(ctx, ACH_WORD("Achievements") + "  " + got + "/" + ACHIEVEMENTS.length, 470, 350,
      { size: 11, align: "right", color: this.achHover ? "#f7931e" : "#fff" });
    ctx.restore();
  }

  settingsClosed() { if (this.screen === "title") this.showTitle(); }

  /* =================================================================
     NEWSPAPER (New Game) AND THE NIGHT INTRO
     ================================================================= */
  newspaper() {
    const ad = this.overlay(null, null, { fade: 0, paint: ctx => this.drawNewspaper(ctx) });
    this.scripts.run("ad", function* () {
      yield* this.fade(ad, 1, 30);
      this.scripts.stop("title");
      this.screen = "black";
      this.sp.music.stopAll();
      let t = 0;
      yield () => (t += TICK) >= 6 || this.clicks.length > 0;
      yield* this.fade(ad, 0, 30);
      this.startIntro();
    }.call(this));
  }

  startIntro() {
    this.go("black");
    Sound.stopAll();
    if (this.level < 6) this.progress.night = this.level;
    this.save();
    const ord = ["", "1st", "2nd", "3rd", "4th", "5th", "6th", "7th"][this.level];
    const card = this.overlay(null, null, { paint: ctx => {
      this.text(ctx, "12:00 AM", 240, 170, { size: 26, align: "center", font: "Press Start 2P" });
      this.text(ctx, ord + " " + W("Night start", "Night"), 240, 200, { size: 14, align: "center", font: "Press Start 2P" });
    } });
    this.scripts.run("intro", function* () {
      this.sp.blip.play("Sprite10", "Change camera");
      yield 2.2;
      yield* this.fade(card, 0, 30);
      this.removeOverlay(card);
      // Toy Eddy turning around in the corner while the night loads
      const spin = this.overlay(null, null, { paint: () => draw(this.ctx, picAt("Turntable", 1 + Math.floor(performance.now() / 100) % 16), 440, 300, { size: 70 }) });
      yield randFloat(1.5, 3);
      this.removeOverlay(spin);
      this.startNight();
    }.call(this));
  }

  /* =================================================================
     THE NIGHT
     ================================================================= */
  startNight() {
    this.go("night");
    const L = this.level;
    const ai = {};

      maskUp: false, maskFrame: 0,          // 0 = off, 1-6 = sliding up/down
      monitorUp: false, camsUp: false, monitorFrame: 0,
      cam: 9,
      maskArmed: false, monitorArmed: false,
      flash: false, ventL: false, ventR: false,     // lights on right now
      flashHeld: 0,              // how long the hallway light has been held (counts flashes for Endo)
      camFlash: false,
      at: {},                    // where each character is
      wait: {},                  // seconds until each character's next chance to move
      ai,
      visit: null,               // someone in the office: {who, t, masked, leaveIn}
      bbIn: false, mangleIn: false, mangleAttack: 0,

    for (const who of Object.keys(PATHS)) { n.at[who] = PATHS[who][0]; n.wait[who] = randFloat(4, 6); }
    n.at.foxy = 8; n.wait.foxy = randFloat(4, 6);

    sp.radio.setVolume(0); sp.radio.play("Mangle", "elec garble", { loop: true });
    sp.musicbox.setVolume(0); sp.musicbox.play("Sprite6", "Music_Box_Melody_Playful", { loop: true });
    sp.breath.setVolume(0); sp.breath.play("Sprite3", "deepbreaths", { loop: true });

    this.runPhone();
    this.runCameraPan();
    this.runExtras();
    if (L === 1) this.showHelp();
  }

  // A short how-to on the first night
  showHelp() {
    const help = this.overlay(null, null, { fade: 0, paint: ctx => {
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(100, 92, 280, 42);
      this.text(ctx, W("Help", "Hold SPACE (or click and hold) for the flashlight"), 240, 106, { size: 8, align: "center" });
      this.text(ctx, W("Help", "Q / bottom-left bar: mask    E / bottom-right bar: cameras"), 240, 118, { size: 8, align: "center" });
      this.text(ctx, W("Help", "A / D (or hold the LIGHT buttons): vent lights"), 240, 129, { size: 8, align: "center" });
    } });
    this.scripts.run("night", function* () {
      yield* this.fade(help, 1, 20);
      yield 9;
      yield* this.fade(help, 0, 30);
      this.removeOverlay(help);
    }.call(this));
  }

  /* --------------------------------------------------------------
     THE CLOCK: one hour every 70 seconds, 6 AM wins
     -------------------------------------------------------------- */
  updateClock() {
    const n = this.n;
    n.clock += TICK;
    if (n.clock < 70) return;
    n.clock -= 70;
    n.hour++;
    // later hours wake everyone up a little
    const extra = (HOURLY[this.level] || {})[n.hour];
    if (extra) for (const [k, v] of Object.entries(extra)) n.ai[k] += v;
    if (this.level >= 2 && this.level <= 6 && (n.hour === 3 || n.hour === 5))
      for (const k of Object.keys(n.ai)) if (n.ai[k] > 0 && k !== "golden") n.ai[k] = Math.min(20, n.ai[k] + 1);
    if (n.hour === 6) this.sixAM();
  }

  /* --------------------------------------------------------------
     THE PHONE CALL (nights 1-6). Same call banner as Tape 1.
     -------------------------------------------------------------- */
  runPhone() {
    const n = this.n;
    if (this.level > 6 || this.died) return;
    const sp = this.sp.phone;
    let ring = null, call = null;
    const answer = () => {
      if (n.phone !== "ringing") return;
      this.scripts.stop("ring");
      if (ring) ring.fadeOut(0.15);
      call = sp.play("Sprite11", "call " + this.level + "b");
      n.phone = "talking";
      n.callTime = 0;
      this.scripts.run("phone", function* () {
        yield () => call.done;
        n.phone = "off";
        this.unlock("call");
      }.call(this));
    };
    const hangUp = () => {
      this.unlock("hangup");
      if (ring) ring.stop();
      if (call) call.stop();
      this.scripts.stop("ring", "phone");
      n.phone = "off";
    };
    this.phoneTap = () => (n.phone === "ringing" ? answer() : hangUp());
    this.scripts.run("ring", function* () {
      yield 1.5;
      ring = sp.play("Ringtone", "ringtone");
      yield 1;
      n.phone = "ringing";
      yield randFloat(2, 6);
      answer();
    }.call(this));
  }
  phoneBox() { return { x: 8, y: 52, w: 160, h: 42 }; }
  updatePhone() {
    const n = this.n;
    if (n.phone === "talking") n.callTime += TICK;
    const show = this.smooth.get("phoneShow") || 0;
    this.smooth.set("phoneShow", clamp(show + (n.phone === "off" ? -0.15 : 0.15), 0, 1));
    this.sp.phone.setVolume(n.camsUp ? 55 : 100);
  }
  drawPhone(ctx, a) {
    const n = this.n, show = this.smooth.at("phoneShow", a) || 0;
    if (show <= 0) return;
    const { x, y: y0, w, h } = this.phoneBox();
    const y = y0 - (1 - show) * 14;
    ctx.save();
    ctx.globalAlpha = show;
    ctx.fillStyle = "rgba(28, 28, 32, 0.92)";
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 13); ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.12)"; ctx.lineWidth = 0.75; ctx.stroke();
    const cx = x + 21, cy = y + h / 2, r = 14;
    const g = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
    g.addColorStop(0, "#7ee08a"); g.addColorStop(1, "#1f9e4a");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = '600 11px "Sans Serif"';
    ctx.fillText(W("Phone", "AM"), cx, cy + 0.5);
    ctx.textAlign = "left";
    ctx.font = '600 10px "Sans Serif"';
    ctx.fillText(W("Phone", "Aidan") + " (" + W("Phone", "Manager") + ")", x + 41, y + 15, w - 80);
    ctx.font = '8px "Sans Serif"';
    ctx.fillStyle = "rgba(235, 235, 245, 0.6)";
    if (n.phone === "ringing") ctx.fillText(W("Phone", "incoming call..."), x + 41, y + 28);
    else {
      const t = Math.floor(n.callTime);
      ctx.fillText(Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"), x + 41, y + 28);
    }
    const bx = x + w - 21, ringing = n.phone === "ringing";
    const pulse = ringing ? 1 + 0.06 * Math.sin(performance.now() / 120) : 1;
    ctx.fillStyle = ringing ? "#30d158" : "#ff3b30";
    ctx.beginPath(); ctx.arc(bx, cy, 13 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.translate(bx, cy);
    if (!ringing) ctx.rotate(Math.PI * 0.75);
    ctx.scale(0.62, 0.62);
    ctx.translate(-12, -12);
    ctx.fillStyle = "#fff";
    ctx.fill(PHONE_ICON);
    ctx.restore();
  }

  /* --------------------------------------------------------------
     The camera picture slowly slides left and right
     -------------------------------------------------------------- */
  runCameraPan() {
    this.scripts.run("night", function* () {
      const glide = function* (from, to) {
        for (let t = TICK; t < 7; t += TICK) { this.smooth.set("camPan", from + (to - from) * t / 7); yield; }
        this.smooth.set("camPan", to);
      }.bind(this);
      for (;;) { yield* glide(110, -110); yield 2; yield* glide(-110, 110); yield 2; }
    }.call(this));
  }

  // Little things that make the night feel alive (and a few rare scares)
  runExtras() {
    const n = this.n;
    // the fan on the desk spins
    this.scripts.run("night", function* () { for (;;) { n.fanFrame = 3 - n.fanFrame; yield 0.07; } }.call(this));
    // the bare endoskeleton sometimes sits in the left vent (it does nothing)
    this.scripts.run("night", function* () {
      for (;;) { yield 20; n.endo = this.level >= 2 && chance(6); n.shadow = this.level >= 3 && chance(40); }
    }.call(this));
    // rare one-frame scary faces (only with jumpscares ON)
    if (settings.jumpscares === "1") {
      this.scripts.run("night", function* () {
        for (;;) {
          yield 1;
          if (this.level >= 2 && chance(400) && !n.maskUp) {
            n.halluc = pick(["bbEyes", "shadowHead"]);
            yield randFloat(0.1, 0.4);
            n.halluc = null;
          }
        }
      }.call(this));
    }
  }

  /* --------------------------------------------------------------
     THE CHARACTERS
     Every ~5 seconds each one gets a chance to move: roll 1-20, and if
     the roll is their AI level or lower, they take the next step.
     -------------------------------------------------------------- */
  updateCharacters() {
    const n = this.n;
    for (const who of Object.keys(PATHS)) {
      if (n.ai[who] <= 0 || n.at[who] === "office" || n.at[who] === "gone") continue;
      n.wait[who] -= TICK;
      if (n.wait[who] > 0) continue;
      n.wait[who] = randFloat(4.5, 5.5);
      if (rand(1, 20) <= n.ai[who]) this.step(who);
    }
    this.updateFoxy();
  }

  // Someone in a spot that only one can use?
  taken(spot, me) {
    const n = this.n;
    if (spot === "office") return !!n.visit || Object.entries(n.at).some(([k, v]) => k !== me && v === "office");
    if (spot === "hall" || spot === "ventL" || spot === "ventR")
      return Object.entries(n.at).some(([k, v]) => k !== me && k !== "foxy" && v === spot);
    return false;
  }

  // Take one step toward the office
  step(who) {
    const n = this.n, path = PATHS[who], here = n.at[who];
    let next;
    const detour = (DETOURS[who] || {})[here];
    if (detour !== undefined && chance(2)) next = detour;
    else if (here === "hall" && DETOURS[who] && DETOURS[who].hall !== undefined) next = DETOURS[who].hall;
    else next = path[path.indexOf(here) + 1];
    if (next === undefined) return;

    // at a vent opening or in the hall: the last step into the office
    if (next === "office") {
      // a mask on while they are at the vent sends them back (they think you are one of them)
      if ((here === "ventL" || here === "ventR") && n.maskUp) return this.sendBack(who);
      // they only sneak in while you are looking at the cameras
      if (!n.camsUp || this.taken("office", who)) return;
      if (who === "bb") return this.bbEnters();
      if (who === "mangle") return this.mangleEnters();
      n.at[who] = "office";
      n.visit = { who, t: 0, started: false, masked: 0 };
      this.sp.steps.setVolume(60);
      this.sp.steps.play("Left Vent", "ventwalk1");
      return;
    }
    if (this.taken(next, who)) return;
    const from = here;
    n.at[who] = next;
    // footsteps in the vents
    if (next === 5 || next === 6 || next === "ventL" || next === "ventR") {
      this.sp.steps.setVolume(next === "ventL" || next === "ventR" ? 60 : 30);
      this.sp.steps.play("Left Vent", pick(["ventwalk1", "ventwalk2"]));
    }
    if (who === "bb") this.sp.bb.play("BB", pick(["Hello?", "Hi!", "Laugh"]));
    // the camera you watch glitches when someone leaves or comes in
    if (n.camsUp && (from === n.cam || next === n.cam)) this.camGlitch();
  }

  // Back to the start (they leave the office or the vent)
  sendBack(who) {
    const n = this.n;
    n.at[who] = PATHS[who][0];
    n.wait[who] = randFloat(6, 9);
    if (who === "bb") this.sp.bb.play("BB", "Hi!");
  }

  // BB gets in: he laughs, and your lights stop working until 6 AM
  bbEnters() {
    const n = this.n;
    n.at.bb = "office";
    n.bbIn = true;
    this.sp.bb.setVolume(100);
    this.sp.bb.play("BB in the office", "echo4b");
  }
  // Mangled Endo gets in: hangs from the ceiling, radio crackling, and may drop on you
  mangleEnters() {
    const n = this.n;
    n.at.mangle = "office";
    n.mangleIn = true;
    n.mangleAttack = randFloat(8, 25);
  }

  /* --------------------------------------------------------------
     WITHERED ENDO (Foxy): comes from Parts/Service to the hallway.
     Flash the light at him over and over until he gives up.
     -------------------------------------------------------------- */
  updateFoxy() {
    const n = this.n, f = n.foxy;
    if (n.ai.foxy <= 0) return;
    if (!f.hall) {
      n.wait.foxy -= TICK;
      if (n.wait.foxy > 0) return;
      n.wait.foxy = randFloat(4.5, 5.5);
      if (rand(1, 20) > n.ai.foxy || this.taken("hall", "foxy") && chance(2)) return;
      if (n.camsUp && n.cam === 8) this.camGlitch();
      f.hall = true;
      n.at.foxy = "hall";
      f.flashes = 0;
      f.need = rand(4, 6) + Math.floor(n.ai.foxy / 5);
      f.timer = randFloat(14, 22) - n.ai.foxy * 0.3;
      f.retreat = 0;
      return;
    }
    // he is in the hall
    if (f.retreat > 0) {                      // flashed enough: he walks back
      f.retreat -= TICK;
      if (f.retreat <= 0) { f.hall = false; n.at.foxy = 8; n.wait.foxy = randFloat(8, 14); }
      return;
    }
    f.timer -= TICK;
    if (f.timer <= 0) {
      if (n.flash && !n.maskUp && !n.camsUp) { f.timer = 1; return; }   // he will not lunge into the light
      if (n.camsUp) this.forceMonitorDown();
      this.jumpscare("foxy");
    }
  }
  // Called when the hallway light turns on
  flashedHall() {
    const f = this.n.foxy;
    if (!f.hall || f.retreat > 0) return;
    f.flashes++;
    f.timer = Math.max(f.timer, 3);
    if (f.flashes >= f.need) { f.retreat = randFloat(1, 2.5); this.unlock("flash"); }
  }

  /* --------------------------------------------------------------
     SOMEONE IN THE OFFICE
     They come in while the cameras are up. When you put the monitor
     down, the lights flicker and you have a moment to put on the mask.
     Keep it on until they leave.
     -------------------------------------------------------------- */
  updateVisit() {
    const n = this.n, v = n.visit;
    if (!v) return;
    if (!v.started) {
      // waiting for you to put the monitor down (they pull it down after a while)
      v.t += TICK;
      if (v.t > 7 && n.camsUp) this.forceMonitorDown();
      if (!n.monitorUp && !n.monitorFrame) { v.started = true; v.t = 0; this.officeFlicker(true); }
      return;
    }
    v.t += TICK;
    const grace = this.level <= 2 ? 1.6 : 1.1;
    if (n.maskUp && n.maskFrame === 0) {
      v.masked += TICK;
      if (v.masked > (v.leaveAt || (v.leaveAt = randFloat(3, 5.5)))) {
        // they give up and go back
        n.at[v.who] = "gone";
        const who = v.who;
        n.visit = null;
        this.officeFlicker(false);
        this.unlock("mask");
        this.scripts.run("night", function* () { yield 5; if (this.n && n.at[who] === "gone") this.sendBack(who); }.call(this));
      }
      return;
    }
    if (v.masked > 0 && !n.maskUp) return this.jumpscare(v.who);     // took the mask off too early
    if (v.t > grace) this.jumpscare(v.who);
  }
  officeFlicker(on) {
    const sp = this.sp;
    if (on) { sp.flicker.setVolume(100); sp.flicker.play("Light Left", "ComputerInteriorLong_EVL02_2"); }
    else { sp.flicker.stopAll(); sp.flicker.play("Sprite21", "recording1"); }
  }

  /* --------------------------------------------------------------
     THE PUPPET: the music box (camera 11) winds down all night.
     Hold the button on camera 11 to wind it back up.
     -------------------------------------------------------------- */
  updateMusicBox() {
    const n = this.n;
    if (n.puppet > 0) return;
    const ai = n.ai.puppet;
    const secondsToEmpty = 150 - ai * 5;
    n.musicBox -= TICK / secondsToEmpty;
    // the tune plays only while you watch camera 11
    this.sp.musicbox.setVolume(n.camsUp && n.cam === 11 ? 35 : 0);
    if (n.musicBox <= 0) { n.musicBox = 0; this.puppetComes(); }
  }
  windMusicBox() {
    const n = this.n;
    if (n.puppet > 0) return;
    n.musicBox = Math.min(1, n.musicBox + TICK / 2.2);
    if (this.tick % 9 === 0) this.sp.windup.play("Wind up", "windup2");
    if (n.musicBox === 1) this.unlock("wound");
  }
  puppetComes() {
    const n = this.n, sp = this.sp;
    n.puppet = 1;
    sp.musicbox.stopAll();
    sp.jack.setVolume(5);
    sp.jack.play("Sprite27", "jackinthebox");
    this.scripts.run("puppet", function* () {
      for (let i = 0; i < 10; i++) { sp.jack.setVolume(5 + i * 2); yield 0.25; }
      n.puppet = 2;
      for (let i = 0; i < 10; i++) { sp.jack.setVolume(25 + i * 7); yield 0.4; }
      n.puppet = 3;
      sp.jack.setVolume(100);
      yield randFloat(6, 14);
      n.puppet = 4;
      if (n.camsUp) this.forceMonitorDown();
      this.jumpscare("puppet");
    }.call(this));
  }

  /* --------------------------------------------------------------
     GOLDEN EDDIE (rare): a head in the hallway, or slumped in the
     office when you put the monitor down. In the office: put the mask
     on or pick the monitor back up, fast.
     -------------------------------------------------------------- */
  rollGolden() {
    const n = this.n;
    const ai = n.ai.golden;
    const odds = ai > 0 ? Math.max(4, 60 - ai * 3) : Math.max(1, Math.round(this.goldenRate));
    if (n.golden || this.level < 3 && ai <= 0) return;
    if (rand(1, odds) === 1) {
      n.golden = "office";
      n.goldenTimer = 1.6;
      this.unlock("golden");
    }
  }
  updateGolden() {
    const n = this.n;
    if (n.golden !== "office") return;
    if (n.maskUp || n.camsUp) { n.golden = null; return; }
    n.goldenTimer -= TICK;
    if (n.goldenTimer <= 0) { n.golden = null; this.jumpscare("golden"); }
  }

  /* --------------------------------------------------------------
     THE MASK (bottom-left bar, or Q)
     -------------------------------------------------------------- */
  toggleMask() {
    const n = this.n;
    if (n.monitorUp || n.monitorFrame || n.maskFrame) return;
    n.maskUp = !n.maskUp;
    this.sp.mask.play("Sprite4", n.maskUp ? "mask.show" : "mask.hide");
    const up = n.maskUp;
    this.scripts.run("mask", function* () {
      for (let f = 1; f <= 6; f++) { n.maskFrame = up ? f : 7 - f; yield; }
      n.maskFrame = 0;
    }.call(this));
  }

  /* --------------------------------------------------------------
     THE MONITOR (bottom-right bar, or E)
     -------------------------------------------------------------- */
  toggleMonitor() {
    const n = this.n;
    if (n.maskUp || n.maskFrame || n.monitorFrame) return;
    if (!n.monitorUp) this.raiseMonitor(); else this.lowerMonitor();
  }
  raiseMonitor() {
    const n = this.n;
    n.monitorUp = true;
    this.sp.flip.play("Sprite5", "Cam Up");
    this.rollGolden();
    if (n.golden === "office") n.golden = null;     // he only shows when you put it down
    this.scripts.run("monitor", function* () {
      for (let f = 1; f <= 11; f++) { n.monitorFrame = f; yield; }
      n.monitorFrame = 0;
      n.camsUp = true;
      n.switchFx = 1;
      this.seeCam(n.cam);
    }.call(this));
  }
  lowerMonitor() {
    const n = this.n;
    const wasUp = n.camsUp;
    n.monitorUp = false;
    n.camsUp = false;
    this.scripts.stop("monitor");
    this.sp.flip.play("Sprite5", "Cam down");
    this.scripts.run("monitor", function* () {
      for (let f = wasUp ? 11 : n.monitorFrame; f >= 1; f--) { n.monitorFrame = f; yield; }
      n.monitorFrame = 0;
      this.afterMonitorDown();
    }.call(this));
  }
  forceMonitorDown() { if (this.n.monitorUp) this.lowerMonitor(); }
  afterMonitorDown() {
    const n = this.n;
    // Golden Eddie might be sitting there now
    if (!n.visit && chance(3)) this.rollGolden();
    // Mangled Endo might drop down
    if (n.mangleIn && n.mangleAttack <= 0 && chance(3)) this.jumpscare("mangle");
  }

  /* --------------------------------------------------------------
     THE CAMERAS
     -------------------------------------------------------------- */
  switchCam(c) {
    const n = this.n;
    if (n.cam === c) return;
    n.cam = c;
    n.switchFx = 1;
    this.sp.camBlip.play("Sprite10", "Change camera");
    this.seeCam(c);
  }
  seeCam(c) {
    const n = this.n;
    n.camsSeen.add(c);
    if (n.camsSeen.size === 12) this.unlock("cams");
  }
  camGlitch() { this.n.switchFx = 1; }

  /* --------------------------------------------------------------
     EVERY UPDATE OF THE NIGHT
     -------------------------------------------------------------- */
  updateNight() {
    const n = this.n, m = this.mouse;
    if (n.frozen) return;
    if (n.jumpscare) return this.updateJumpscare();
    this.updateClock();
    if (n.frozen || this.screen !== "night") return;

    // looking around the office (mouse near the edges)
    if (!n.camsUp && !n.monitorFrame && !n.maskUp) {
      const dx = m.x - 240;
      let pan = this.smooth.get("pan");
      const speed = Math.abs(dx) > 150 ? 15 : Math.abs(dx) > 70 ? 6 : 0;
      pan = clamp(pan - Math.sign(dx) * speed, -95, 95);
      this.smooth.set("pan", pan);
    }

    this.updateBars();
    this.updateLights();
    this.updateCharacters();
    this.updateVisit();
    this.updateMusicBox();
    this.updateGolden();
    this.updatePhone();
    this.updateNightSounds();
    if (n.mangleIn) n.mangleAttack -= TICK;
    n.switchFx = Math.max(0, n.switchFx - 0.08);
    n.maskTime = n.maskUp ? n.maskTime + TICK : 0;

    // Toy Weddy slides past while the mask is on
    if (n.visit && n.visit.who === "tbonnie" && n.visit.started && n.maskUp) n.slide = Math.min(1, n.slide + TICK / 2.5);
    else n.slide = 0;

    for (const c of this.clicks) this.nightClick(c.x, c.y);
    for (const k of this.keys) {
      if (k === "mask") this.toggleMask();
      if (k === "cams") this.toggleMonitor();
    }
  }

  // The two bars at the bottom: move the mouse over them (move off and back to use again)
  updateBars() {
    const n = this.n, m = this.mouse;
    const onMask = m.y > SY(-150) && m.x > SX(-240) && m.x < SX(-5);
    const onCams = m.y > SY(-150) && m.x > SX(5) && m.x < SX(240);
    if (m.y < SY(-140)) { n.maskArmed = true; n.monitorArmed = true; }
    if (onMask && n.maskArmed && !n.camsUp) { n.maskArmed = false; this.toggleMask(); }
    if (onCams && n.monitorArmed && !n.maskUp) { n.monitorArmed = false; this.toggleMonitor(); }
  }

  // Flashlight and vent lights (they need battery, and BB in the office breaks them)
  updateLights() {
    const n = this.n, m = this.mouse;
    const ok = n.battery > 0 && !n.bbIn;
    const pan = this.smooth.get("pan");
    const office = !n.camsUp && !n.monitorFrame && !n.maskUp && !n.maskFrame;
    // vent light buttons (hold them) or A / D
    const onLeft = m.down && hits(pic("Light Left", "0"), SX(pan - 300), SY(-15), 65, m.x, m.y);
    const onRight = m.down && hits(pic("Right Right", "0"), SX(pan + 300), SY(-15), 65, m.x, m.y);
    const ventL = office && ok && (onLeft || this.held.has("left"));
    const ventR = office && ok && !ventL && (onRight || this.held.has("right"));
    // flashlight: SPACE / F / Ctrl, or click and hold on the room (not on a button or bar)
    const mouseLight = m.down && !onLeft && !onRight && m.y < SY(-140) && !this.onPhone(m.x, m.y);
    const want = this.held.has("flash") || mouseLight;
    const hall = office && ok && want && !ventL && !ventR;
    if (hall && !n.flash) {
      this.flashedHall();
      if (this.level >= 3 && !n.golden && chance(45)) n.golden = "hall";
    }
    if (!hall && n.golden === "hall") n.golden = null;
    n.flash = hall;
    n.ventL = ventL; n.ventR = ventR;
    // on the cameras the flashlight lights up the room
    n.camFlash = n.camsUp && ok && want && !this.onMap(m.x, m.y);
    const on = n.flash || n.ventL || n.ventR || n.camFlash;
    if (on) n.battery = Math.max(0, n.battery - TICK * (this.level >= 5 ? 1.2 : 1));
    if (n.flash) n.hallFlicker = (n.foxy.hall || Object.values(n.at).includes("hall")) && chance(5);
    else n.hallFlicker = false;
    // the music box button on camera 11
    n.winding = n.camsUp && n.cam === 11 && m.down && hits(pic("Wind up", "Wind up0"), SX(-10), SY(-90), 100, m.x, m.y);
    if (n.winding) this.windMusicBox();
  }
  onPhone(x, y) {
    const pb = this.phoneBox();
    return this.n.phone !== "off" && x >= pb.x && x <= pb.x + pb.w && y >= pb.y && y <= pb.y + pb.h;
  }
  onMap(x, y) {
    if (!this.n.camsUp) return false;
    if (x > 280 && y > 170) return true;                                          // the map
    if (this.n.cam === 11 && hits(pic("Wind up", "Wind up0"), SX(-10), SY(-90), 100, x, y)) return true;
    return false;
  }

  updateNightSounds() {
    const n = this.n, sp = this.sp;
    sp.fan.setVolume(n.camsUp ? 10 : n.maskUp ? 15 : 25);
    sp.buzz.setVolume(n.flash ? 40 : 0);
    sp.vent.setVolume(n.ventL || n.ventR ? 30 : 0);
    sp.camHum.setVolume(n.camsUp ? 25 : 0);
    sp.breath.setVolume(n.maskUp ? 70 : 0);
    // radio static when Mangled Endo is close
    const m = n.at.mangle;
    sp.radio.setVolume(n.mangleIn ? 45 : m === "hall" || m === "ventR" ? 30 : m === 6 ? 15 : (n.camsUp && n.cam === m) ? 10 : 0);
  }

  nightClick(x, y) {
    const n = this.n;
    if (this.onPhone(x, y)) { this.phoneTap(); return; }
    if (n.camsUp) {
      for (const [k, r] of Object.entries(MAP_BUTTONS)) {
        const bx = SX(139) + r[0] * 0.45, by = SY(-73) + r[1] * 0.45;
        if (x >= bx - 2 && x <= bx + r[2] * 0.45 + 2 && y >= by - 2 && y <= by + r[3] * 0.45 + 2) { this.switchCam(Number(k)); return; }
      }
      return;
    }
    if (n.maskUp || n.monitorFrame) return;
    // honk the nose on the poster (top left wall)
    const pan = this.smooth.get("pan");
    if (Math.hypot(x - (SX(pan) - 303), y - 104) < 14) { this.sp.honk.play("Sprite21", "PartyFavorraspyPart_AC01__3"); this.unlock("honk"); }
  }

  /* =================================================================
     JUMPSCARES, DEATH, 6 AM
     ================================================================= */
  jumpscare(who) {
    const n = this.n;
    if (n.jumpscare || n.frozen) return;
    this.scripts.stop("night", "puppet", "ring", "phone", "monitor", "mask");
    n.phone = "off";
    n.halluc = null;
    n.maskUp = false; n.maskFrame = 0;
    n.monitorUp = n.camsUp = false; n.monitorFrame = 0;
    this.killer = who;
    this.caughtBy(who);
    Sound.stopAll();
    if (who === "golden") return this.goldenCrash();
    if (settings.jumpscares !== "1") return this.dead();
    this.sp.scream.play("Sprite27", "Xscream2");
    const frames = PICTURE_NAMES.Scare.filter(s => s.startsWith(who + "-"));
    n.jumpscare = { who, frames, i: 0 };
  }
  updateJumpscare() {
    const j = this.n.jumpscare;
    if (this.tick % 2 === 0) j.i++;
    if (j.i >= j.frames.length + 4) { this.n.jumpscare = null; this.dead(); }
  }

  // Static, then (sometimes) a strange little 8-bit game, then the title
  dead() {
    this.died = true;
    this.go("black");
    Sound.stopAll();
    this.sp.stat.play("Sprite28", "After Death");
    const st = this.overlay(null, null, { paint: ctx => {
      this.drawStatic(ctx, 1);
      if (settings.jumpscares !== "1") this.text(ctx, W("Game over", "You were caught by") + " " + CAST[this.killer].name, 240, 190,
        { size: 14, align: "center", shadow: "#000" });
    } });
    this.scripts.run("dead", function* () {
      yield settings.jumpscares === "1" ? 4 : 5;
      this.sp.stat.stopAll();
      if (settings.jumpscares === "1" && chance(3)) return this.startMinigame();
      this.removeOverlay(st);
      const over = this.overlay(null, null, { fade: 0, paint: ctx => this.text(ctx, W("Game over", "GAME OVER"), 470, 350,
        { size: 20, align: "right", font: "Press Start 2P" }) });
      yield* this.fade(over, 1, 20);
      yield 3;
      this.showTitle();
    }.call(this));
  }

  // Golden Eddie: no jumpscare, the game just shuts down
  goldenCrash() {
    this.go("black");
    Sound.stopAll();
    this.sp.scream.play("Sprite27", "Xscream2");
    if (settings.jumpscares === "1") this.overlay("Scare", "golden-1", { size: 100 });
    this.scripts.run("crash", function* () { yield 1.2; Sound.stopAll(); this.layers = []; yield 2; this.showTitle(); }.call(this));
  }

  sixAM() {
    const n = this.n;
    this.scripts.stop("night", "puppet", "ring", "phone", "monitor", "mask");
    n.frozen = true; n.phone = "off"; n.halluc = null;
    this.smooth.jump("phoneShow", 0);
    Sound.stopAll();
    this.died = false;
    this.sp.chime.play("Ambience", "Chimes");
    const card = this.overlay(null, null, { fade: 0, paint: (ctx, a) => {
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 480, 360);
      const k = this.smooth.at("roll", a) || 0;         // the 5 rolls up into a 6
      ctx.save();
      ctx.beginPath(); ctx.rect(150, 150, 70, 50); ctx.clip();
      this.text(ctx, "5", 210, 196 - k * 46, { size: 40, align: "right", font: "Press Start 2P" });
      this.text(ctx, "6", 210, 242 - k * 46, { size: 40, align: "right", font: "Press Start 2P" });
      ctx.restore();
      this.text(ctx, "AM", 230, 196, { size: 40, font: "Press Start 2P" });
    } });
    this.smooth.jump("roll", 0);
    this.scripts.run("6am", function* () {
      yield* this.fade(card, 1, 30);
      yield 1.5;
      for (let t = 0; t <= 1; t += TICK / 2) { this.smooth.set("roll", t); yield; }
      this.smooth.set("roll", 1);
      this.sp.chime.play("Ambience", "CROWD_SMALL_CHIL_EC049202");
      yield 4;
      yield* this.fade(card, 0, 30);
      this.nightWon();
    }.call(this));
    this.scripts.run("6am", function* () { yield 1; if (this.screen === "night") this.screen = "black"; }.call(this));
  }

  nightWon() {
    const L = this.level, n = this.n;
    if (L <= 6) this.unlock("night" + L);
    if (n && n.battery >= 50) this.unlock("battery");
    if (L < 5) { this.level = L + 1; return this.startIntro(); }
    if (L === 5) { this.progress.beat5 = true; this.progress.night = 5; return this.ending("paycheck"); }
    if (L === 6) { this.progress.beat6 = true; return this.ending("check2"); }
    // custom night: the preset's prize
    const p = PRESETS[this.presetIndex || 0];
    if (p.prize === "star") { this.progress.beat420 = true; this.unlock("max"); }
    else if (p.prize && !this.progress.prizes.includes(p.prize)) this.progress.prizes.push(p.prize);
    if (p.prize) this.unlock("prize");
    if (this.progress.prizes.length >= 9) this.unlock("allprizes");
    return this.ending("pinkslip");
  }

    this.save();
    this.go("black");
    this.sp.music.play("Sprite19", "FNAF 2 - Win Music-Lullaby Waltz (End Of The Game).mp3");
    const card = this.overlay(null, null, { fade: 0, paint: ctx => this.drawEnding(ctx, name) });
    this.scripts.run("ending", function* () {
      yield* this.fade(card, 1, 30);
      yield 2;
      let t = 0;
      yield () => (t += TICK) > 25 || this.clicks.length > 0;
      yield* this.fade(card, 0, 30);
      this.showTitle();
    }.call(this));
  }
