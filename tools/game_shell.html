<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fried Rice at Eddie's</title>
<style>
  /* ===== Fonts used by the game's text (Scratch's own fonts + pixel fonts) ===== */
  @font-face { font-family: "Sans Serif"; src: url("assets/fonts/NotoSans-Medium.ttf"); }
  @font-face { font-family: "Serif"; src: url("assets/fonts/SourceSerifPro-Regular.otf"); }
  @font-face { font-family: "Pixel"; src: url("assets/fonts/Grand9K-Pixel.ttf"); }
  @font-face { font-family: "Press Start 2P"; src: url("assets/fonts/PressStart2P.woff2"); }
  @font-face { font-family: "Courier Prime"; src: url("assets/fonts/CourierPrime.woff2"); }
  @font-face { font-family: "Share Tech Mono"; src: url("assets/fonts/ShareTechMono.woff2"); }

  /* ===== Page theme: black VHS look to match the game menu ===== */
  :root {
    --bg: #000;
    --line: #fff;
    --dim: #8a8a99;
    --accent: #5b16ec;
    --soul: #ff2a3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: #fff; overflow: hidden; }
  body {
    font-family: "Press Start 2P", monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }

  /* The game screen keeps Scratch's 4:3 shape and grows to fit the window */
  #frame {
    position: relative;
    border: 4px solid var(--line);
    box-shadow: 0 0 0 4px #000, 8px 8px 0 4px #1d1d2b;
    background: #000;
  }
  #stage { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }

  /* ===== Loading screen: a flat picture spinning in 3D, with a bar under it ===== */
  #cover {
    position: absolute; inset: 0; z-index: 5;
    background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6%;
    perspective: 900px;                       /* gives the spin its 3D depth */
    transition: opacity .4s;
  }
  #cover.done { opacity: 0; pointer-events: none; }
  #spinner {
    width: 38%;
    animation: spin 2.4s linear infinite;    /* one full turn every 2.4 seconds */
  }
  @keyframes spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
  #barOuter { width: 46%; height: 16px; border: 3px solid #fff; padding: 2px; }
  #barInner { height: 100%; width: 0; background: #fff; transition: width .15s; }

  /* ===== "ask and wait" box ===== */
  #ask {
    position: absolute; left: 4%; right: 4%; bottom: 4%; z-index: 4;
    background: #000; border: 3px solid #fff; padding: 10px; display: flex; flex-direction: column; gap: 8px;
  }
  #ask[hidden] { display: none; }
  #askText { font-size: 11px; }
  #ask div { display: flex; gap: 8px; }
  #askInput { flex: 1; font: inherit; font-size: 12px; padding: 6px; background: #111; color: #fff; border: 2px solid #fff; }
  #ask button { font: inherit; font-size: 11px; background: var(--accent); color: #fff; border: 2px solid #fff; padding: 0 10px; cursor: pointer; }


  /* ===== Settings + Mods panels (sizes use --u = 1 Scratch pixel) ===== */
  .panel {
    position: absolute; inset: 0; z-index: 6; background: #000; color: #fff;
    font-family: "Share Tech Mono", monospace; font-size: calc(var(--u) * 13);
    display: flex; flex-direction: column; padding: calc(var(--u) * 14) calc(var(--u) * 18);
    animation: fadeIn .35s;
  }
  .panel[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0; } }
  .panel button, .panel input { font: inherit; color: #fff; }
  .panel button { cursor: pointer; background: #000; border: calc(var(--u) * 2) solid #fff; padding: calc(var(--u) * 4) calc(var(--u) * 10); }
  .panel button:hover { background: #222; }
  .panel button:active { transform: translateY(calc(var(--u) * 1)); }
  .panel button:disabled { opacity: .4; cursor: wait; }

  /* settings */
  #settingsPanel h2 { font-size: calc(var(--u) * 22); font-weight: normal; margin-bottom: calc(var(--u) * 16); }
  #settingsPanel .row { display: flex; align-items: center; gap: calc(var(--u) * 12); margin: calc(var(--u) * 9) 0 calc(var(--u) * 9) calc(var(--u) * 40); }
  #settingsPanel .label { width: calc(var(--u) * 110); font-size: calc(var(--u) * 15); }
  #settingsPanel .pair { display: flex; gap: calc(var(--u) * 8); }
  /* jumpscare buttons: orange when picked, gray when not (like the old pictures) */
  #settingsPanel .pick { min-width: calc(var(--u) * 70); font-family: "Sans Serif", sans-serif; font-size: calc(var(--u) * 16);
    background: #666; border-color: #666; padding: calc(var(--u) * 3) calc(var(--u) * 10); }
  #settingsPanel .pick:hover { border-color: #fff; background: #777; }
  #settingsPanel .pick.on { background: #f7931e; border-color: #f7931e; }
  #settingsPanel .pick.on:hover { border-color: #fff; }
  #settingsPanel input[type=range] { width: calc(var(--u) * 170); accent-color: #f7931e; }
  #settingsPanel .val { width: calc(var(--u) * 40); color: #aaa; }
  #settingsPanel .big { font-size: calc(var(--u) * 15); padding: calc(var(--u) * 4) calc(var(--u) * 22); }
  #settingsPanel .confirm { margin: auto auto 0; font-family: "Sans Serif", sans-serif; font-size: calc(var(--u) * 18);
    background: #666; border-color: #666; padding: calc(var(--u) * 4) calc(var(--u) * 26); }
  #settingsPanel .confirm:hover { border-color: #fff; }

  /* mods */
  #modsPanel { gap: calc(var(--u) * 7); }
  .modsTop { display: flex; align-items: center; gap: calc(var(--u) * 10); }
  .modsTop h2 { font-size: calc(var(--u) * 20); font-weight: normal; }
  .tabs { display: flex; gap: calc(var(--u) * 6); margin-left: auto; }
  .tabs button.on { background: #fff; color: #000; }
  .pane { border: calc(var(--u) * 2) solid #444; padding: calc(var(--u) * 6) calc(var(--u) * 8); display: flex; flex-wrap: wrap; gap: calc(var(--u) * 6); align-items: center; }
  .pane[hidden] { display: none; }
  .pane .hint { color: #999; font-size: calc(var(--u) * 11); width: 100%; }
  #ghInput { flex: 1; min-width: 0; background: #111; border: calc(var(--u) * 2) solid #fff; padding: calc(var(--u) * 4) calc(var(--u) * 6); }
  #modStatus { min-height: calc(var(--u) * 15); font-size: calc(var(--u) * 11); color: #9f9; }
  #modStatus.bad { color: #ff6b6b; }
  .lists { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 10); min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col h3 { font-weight: normal; font-size: calc(var(--u) * 13); margin-bottom: calc(var(--u) * 4); }
  .col h3 small { color: #999; font-size: calc(var(--u) * 10); }
  .list { flex: 1; overflow-y: auto; border: calc(var(--u) * 2) solid #fff; padding: calc(var(--u) * 5); }
  #modsInUse { border-color: #f7931e; }
  .mod { position: relative; border: calc(var(--u) * 2) solid #666; padding: calc(var(--u) * 4) calc(var(--u) * 22) calc(var(--u) * 4) calc(var(--u) * 6);
    margin-bottom: calc(var(--u) * 5); background: #111; cursor: grab; touch-action: none; user-select: none; }
  .mod:hover { border-color: #fff; }
  .modName { font-size: calc(var(--u) * 13); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .modInfo { font-size: calc(var(--u) * 10); color: #999; }
  .mod .del { position: absolute; right: calc(var(--u) * 3); top: calc(var(--u) * 3); border: none; padding: 0 calc(var(--u) * 4); font-size: calc(var(--u) * 14); color: #999; background: none; }
  .mod .del:hover { color: #ff6b6b; background: none; }
  .mod.dragging { opacity: .3; }
  .mod.ghost { position: fixed; z-index: 99; pointer-events: none; opacity: .9; border-color: #fff; font-family: "Share Tech Mono", monospace; color: #fff; }
  .dropMark { height: calc(var(--u) * 3); background: #f7931e; margin-bottom: calc(var(--u) * 5); }
  .empty { color: #666; font-size: calc(var(--u) * 11); text-align: center; padding: calc(var(--u) * 14) 0; }
  #reloadNote { position: absolute; inset: 0; z-index: 7; background: #000; display: flex; align-items: center; justify-content: center; }
  #reloadNote[hidden] { display: none; }
</style>
</head>
<body>

<div id="frame">
  <canvas id="stage" tabindex="0"></canvas>

  <!-- Loading screen: spinning rice bowl + loading bar -->
  <div id="cover">
    <img id="spinner" src="assets/loading-rice.webp" alt="">
    <div id="barOuter"><div id="barInner"></div></div>
  </div>


  <!-- Settings screen (opens when the Settings button is clicked) -->
  <div id="settingsPanel" class="panel" hidden></div>

  <!-- Mods screen -->
  <div id="modsPanel" class="panel" hidden>
    <div class="modsTop">
      <button id="modsBack">&lt; BACK</button>
      <h2>MODS</h2>
      <div class="tabs">
        <button id="tabUnpacked">LOAD UNPACKED</button>
        <button id="tabPacked">LOAD PACKED</button>
      </div>
    </div>
    <div class="pane" id="paneUnpacked">
      <button id="pickFolder">PICK MOD FOLDER</button>
      <button id="pickZip">PICK .ZIP</button>
      <button id="tplBtn" style="margin-left:auto">DOWNLOAD TEMPLATE</button>
      <div class="hint">Pick a mod folder from your computer. New to modding? Download the template, change some files, then pick that folder.</div>
      <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
      <input type="file" id="zipInput" accept=".zip" hidden>
    </div>
    <div class="pane" id="panePacked" hidden>
      <input id="ghInput" placeholder="github.com/user/repo" autocomplete="off" spellcheck="false">
      <button id="ghLoad">LOAD</button>
      <div class="hint">Loads a mod straight from a public GitHub repo (it needs a manifest.json).</div>
    </div>
    <div id="modStatus"></div>
    <div class="lists">
      <div class="col"><h3>DOWNLOADED <small>(not in use)</small></h3><div class="list" id="modsDownloaded"></div></div>
      <div class="col"><h3>IN USE <small>(top one wins)</small></h3><div class="list" id="modsInUse"></div></div>
    </div>
  </div>
  <div id="reloadNote" hidden></div>

  <!-- Box for the "ask and wait" block -->
  <form id="ask" hidden>
    <div id="askText"></div>
    <div><input id="askInput" autocomplete="off"><button type="submit">OK</button></div>
  </form>
</div>

<script>
/*ENGINE*/

/* =====================================================================
   PROJECT DATA (sprites, costumes, sounds, starting values)
   Made by tools/build_game1.py from the Scratch project.
   ===================================================================== */
/*PROJECT*/

/* =====================================================================
   SAVE PROGRESS
   Scratch forgets your progress when the page reloads. The web version
   remembers which night you reached. Set SAVE_PROGRESS to false to
   turn this off.
   ===================================================================== */
const SAVE_PROGRESS = true;
const SAVE_KEY = "frae1-save";
const SAVED_VARS = ["level", "beat 5", "beat 6", "beat 420"];

function loadSave() {
  if (!SAVE_PROGRESS) return;
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}");
    const stage = PROJECT.targets.find(t => t.isStage);
    for (const k of SAVED_VARS) if (k in saved) stage.start.vars[k] = saved[k];
  } catch (e) { /* storage blocked: just play without saving */ }
}
let lastSave = "";
function writeSave() {
  if (!SAVE_PROGRESS) return;
  const data = JSON.stringify(Object.fromEntries(SAVED_VARS.map(k => [k, G[k]])));
  if (data === lastSave) return;
  lastSave = data;
  try { localStorage.setItem(SAVE_KEY, data); } catch (e) {}
}

/* =====================================================================
   START UP
   ===================================================================== */
const canvas = document.getElementById("stage");
const frame = document.getElementById("frame");

// Fit the 4:3 screen inside the window (and keep it sharp on hi-res screens)
function fit() {
  const full = document.fullscreenElement === frame;
  const maxW = window.innerWidth - (full ? 0 : 40);
  const maxH = window.innerHeight - (full ? 0 : 40);
  const w = Math.max(240, Math.min(maxW, maxH * 4 / 3));
  const h = w * 3 / 4;
  frame.style.width = (full ? window.innerWidth : w + 8) + "px";
  frame.style.height = (full ? window.innerHeight : h + 8) + "px";
  canvas.style.width = w + "px";
  frame.style.setProperty("--u", (w / 480) + "px");     // 1 Scratch pixel, used by the panels
  canvas.style.height = h + "px";
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  if (rt) rt.redraw();
}
window.addEventListener("resize", fit);
document.addEventListener("fullscreenchange", fit);

loadSave();
rt = new Runtime(canvas, PROJECT);
fit();

/*SCRIPTS*/

/*UI*/

// The settings screen replaces the old Scratch settings buttons
rt.hooks["settings menu"] = openSettings;
setupModsUI();
applyVolumes();
PROJECT.targets.find(t => t.isStage).start.vars.Jumpscares = settings.jumpscares;

const barInner = document.getElementById("barInner");

// Put mods in place first, then load every file the game needs (with the progress bar)
applyMods().then(() => {
const imageUrls = new Set(), soundUrls = new Set();
for (const t of PROJECT.targets) {
  for (const c of t.costumes) for (const L of c.layers) if (L.img) imageUrls.add(L.img);
  for (const s of t.sounds) soundUrls.add(s.src);
}
return Promise.all([
  document.fonts.load('10px "Sans Serif"'), document.fonts.load('10px "Serif"'),
  document.fonts.load('10px "Pixel"'), document.fonts.load('10px "Press Start 2P"'),
  document.fonts.load('10px "Courier Prime"'), document.fonts.load('10px "Share Tech Mono"'),
  Assets.loadAll([...imageUrls], [...soundUrls], rt.audio, p => {
    barInner.style.width = Math.round(p * 100) + "%";
  })
]);
}).then(() => {
  // Everything is loaded: start the game right away (like pressing the green flag)
  rt.createTargets();
  const cover = document.getElementById("cover");
  cover.classList.add("done");
  setTimeout(() => cover.remove(), 450);
  canvas.focus();
  rt.audio.resume();
  rt.greenFlag();
  last = performance.now();
  requestAnimationFrame(loop);
});

// Browsers only allow sound after the player clicks or presses a key,
// so the sound turns on at the first click/key if it could not start by itself
function unlockSound() { if (rt.audio.state !== "running") rt.audio.resume(); }
window.addEventListener("pointerdown", unlockSound);
window.addEventListener("keydown", unlockSound);

/* =====================================================================
   MAIN LOOP: run scripts 30 times a second, draw when something changed
   ===================================================================== */
let last = performance.now(), acc = 0, saveTimer = 0;
function loop(now) {
  acc += now - last;
  last = now;
  if (acc > 200) acc = 200;                     // tab was hidden: don't try to catch up forever
  let stepped = false;
  while (acc >= FRAME_MS) {
    rt.step();
    stepped = true;
    acc -= FRAME_MS;
    if (++saveTimer >= 60) { saveTimer = 0; writeSave(); }
  }
  // draw every screen refresh while things move (smooth), otherwise only when something changed
  if (rt.needsRedraw || rt.moving || stepped) rt.render(Math.min(1, acc / FRAME_MS));
  requestAnimationFrame(loop);
}

/* =====================================================================
   INPUT: mouse, touch and keyboard go to the game
   ===================================================================== */
canvas.addEventListener("pointerdown", e => { canvas.focus(); rt.setMouse(e.clientX, e.clientY); rt.mousePressed(); });
window.addEventListener("pointermove", e => { rt.setMouse(e.clientX, e.clientY); rt.mouseMoved(); });
window.addEventListener("pointerup", e => { rt.setMouse(e.clientX, e.clientY); rt.mouseReleased(); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;     // typing in a box is not game input
  const k = scratchKey(e);
  if (!k) return;
  if (k.includes("arrow") || k === "space") e.preventDefault();
  rt.keyPressed(k);
});
document.addEventListener("keyup", e => { const k = scratchKey(e); if (k) rt.keyReleased(k); });

/* ===== Esc goes back to the game menu ===== */
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#modsPanel").hidden) closeMods();
  else if (!$("#settingsPanel").hidden) closeSettings();
  else location.href = "../index.html";
});
</script>
</body>
</html>
